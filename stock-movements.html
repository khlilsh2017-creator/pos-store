<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حركة المخزون - المنتجات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #1a56db;
      --primary-hover: #1e40af;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --info: #0ea5e9;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
    }
    .header h1 {
      font-size: 1.8rem;
      color: var(--primary);
    }
    .search-box {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .search-box input, .search-box select {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: white;
      outline: none;
      min-width: 200px;
    }
    .search-box input:focus, .search-box select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: white;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--bg); }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .table-wrapper {
      overflow-x: auto;
      margin-top: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th {
      background: var(--bg);
      font-weight: 600;
      padding: 12px 8px;
      text-align: right;
      border-bottom: 2px solid var(--border);
    }
    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:hover { background: #f8fafc; }
    .product-row { cursor: pointer; }
    .product-row.active { background: #e0f2fe; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-in { background: #dcfce7; color: #166534; }
    .badge-out { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #dbeafe; color: #1e40af; }
    .text-center { text-align: center; }
    .text-muted { color: var(--muted); }
    .mt-10 { margin-top: 10px; }
    .mb-10 { margin-bottom: 10px; }
    .flex-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
    .flex-1 { flex: 1; min-width: 150px; }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      align-items: center;
    }
    .pagination button {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .pagination button:hover { background: var(--bg); }
    .pagination .active-page {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .movement-detail {
      background: #f8fafc;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      border-right: 4px solid var(--primary);
    }
    .movement-detail .title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .movement-detail .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .movement-detail .meta span i { margin-left: 4px; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .empty { text-align: center; padding: 30px; color: var(--muted); font-size: 1.1rem; }

    @media (max-width: 768px) {
      .header { flex-direction: column; align-items: stretch; }
      .search-box input, .search-box select { width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1><i class="fas fa-boxes"></i> حركة المخزون</h1><p style="color:var(--muted);margin-top:4px;">تتبع دخول وخروج وتعديلات مخزون كل منتج.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;"><a class="btn btn-outline" href="products.html"><i class="fas fa-boxes"></i> المنتجات</a><a class="btn btn-outline" href="index.html"><i class="fas fa-home"></i> الرئيسية</a></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="بحث باسم المنتج أو الباركود..." />
      <select id="categoryFilter">
        <option value="">جميع التصنيفات</option>
      </select>
      <button class="btn" onclick="loadProducts()"><i class="fas fa-sync-alt"></i> تحديث</button>
    </div>
  </div>

  <div class="card">
    <div class="flex-row">
      <div class="flex-1"><strong>عدد المنتجات:</strong> <span id="productCount">0</span></div>
      <div class="flex-1"><span class="badge badge-in">دخول</span> <span class="badge badge-out">خروج</span> <span class="badge badge-info">أنواع أخرى</span></div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>المنتج</th>
            <th>الباركود</th>
            <th>المخزون الحالي</th>
            <th>السعر</th>
            <th>التكلفة</th>
            <th>التصنيف</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
          <tr><td colspan="8" class="loading">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="paginationControls"></div>
  </div>

  <!-- قسم عرض تفاصيل الحركة لمنتج معين -->
  <div id="movementDetails" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h3 id="movementProductTitle"><i class="fas fa-history"></i> سجل حركة المنتج</h3>
      <button class="btn btn-outline btn-sm" onclick="closeMovementDetails()"><i class="fas fa-times"></i> إغلاق</button>
    </div>
    <div id="movementList" class="mt-10"></div>
  </div>
</div>

<script>
  const API_BASE = 'https://api.ibnalmukhtar.com'; // غيّر إلى رابط الـ API الخاص بك
  let token = localStorage.getItem('pos_token') || '';
  if (!token) {
    // إذا لم يكن هناك توكن، يمكن التوجيه إلى صفحة تسجيل الدخول أو عرض رسالة
    document.body.innerHTML = '<div style="text-align:center;padding:50px;"><h2>الرجاء تسجيل الدخول أولاً</h2><button onclick="window.location.href=\'index.html\'">تسجيل الدخول</button></div>';
  }

  let currentPage = 1;
  const pageSize = 20;
  let productsData = [];
  let productsTotal = 0;
  let categoriesMap = {};
  let selectedProductId = null;
  function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

  // جلب التصنيفات لملء الفلتر
  async function loadCategories() {
    try {
      const res = await fetch(`${API_BASE}/categories?flat=1`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (data.categories) {
        const select = document.getElementById('categoryFilter');
        // احتفظ بالخيار الأول
        select.innerHTML = '<option value="">جميع التصنيفات</option>';
        data.categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.id;
          opt.textContent = cat.name;
          select.appendChild(opt);
          categoriesMap[cat.id] = cat.name;
        });
      }
    } catch (e) { console.error('خطأ في تحميل التصنيفات:', e); }
  }

  // جلب المنتجات
  async function loadProducts(page = 1) {
    const search = document.getElementById('searchInput').value.trim();
    const category = document.getElementById('categoryFilter').value;
    const limit = pageSize;
    const offset = (page - 1) * limit;

    let url = `${API_BASE}/products?limit=${limit}&page=${page}&sort=name`;
    if (search) url += `&search=${encodeURIComponent(search)}`;
    if (category) url += `&category_id=${category}`;

    try {
      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('فشل جلب المنتجات');
      const data = await res.json();
      productsData = data.products || [];
      productsTotal = Number(data.total || productsData.length);
      document.getElementById('productCount').textContent = productsTotal;

      renderProductsTable(productsData);
      renderPagination(page, Math.ceil(productsTotal / pageSize) || 1);
    } catch (e) {
      document.getElementById('productsTableBody').innerHTML = `<tr><td colspan="8" class="text-center text-muted">خطأ في التحميل: ${e.message}</td></tr>`;
      console.error(e);
    }
  }

  // عرض المنتجات في الجدول
  function renderProductsTable(products) {
    const tbody = document.getElementById('productsTableBody');
    if (!products || products.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty">لا توجد منتجات</td></tr>`;
      return;
    }
    let html = '';
    products.forEach((p, idx) => {
      const isActive = p.id === selectedProductId;
      html += `
        <tr class="product-row ${isActive ? 'active' : ''}" onclick="selectProduct(${p.id})">
          <td>${idx + 1}</td>
          <td><strong>${escapeHtml(p.name)}</strong></td>
          <td>${escapeHtml(p.barcode || '-')}</td>
          <td>${Number(p.stock_quantity || 0)}</td>
          <td>${Number(p.price || 0).toFixed(2)}</td>
          <td>${Number(p.cost || 0).toFixed(2)}</td>
          <td>${escapeHtml(p.category_name || '-')}</td>
          <td><button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); viewMovements(${p.id})"><i class="fas fa-eye"></i> الحركة</button></td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  // التحكم في الترقيم
  function renderPagination(current, totalPages) {
    const container = document.getElementById('paginationControls');
    if (totalPages <= 1) {
      container.innerHTML = '';
      return;
    }
    let html = `<button onclick="changePage(${current-1})" ${current<=1?'disabled':''}>السابق</button>`;
    for (let i = 1; i <= totalPages; i++) {
      html += `<button onclick="changePage(${i})" class="${i===current?'active-page':''}">${i}</button>`;
    }
    html += `<button onclick="changePage(${current+1})" ${current>=totalPages?'disabled':''}>التالي</button>`;
    container.innerHTML = html;
  }

  function changePage(page) {
    if (page < 1) return;
    currentPage = page;
    loadProducts(page);
  }

  // تحديد منتج (تمييز الصف)
  function selectProduct(productId) {
    selectedProductId = productId;
    loadProducts(currentPage); // إعادة تحميل لتحديث التظليل
  }

  // عرض حركة المنتج
  async function viewMovements(productId) {
    const detailsDiv = document.getElementById('movementDetails');
    const listDiv = document.getElementById('movementList');
    const titleEl = document.getElementById('movementProductTitle');

    // البحث عن اسم المنتج من البيانات المخزنة
    const product = productsData.find(p => p.id === productId);
    titleEl.innerHTML = `<i class="fas fa-history"></i> سجل حركة المنتج: ${escapeHtml(product ? product.name : '#' + productId)}`;

    detailsDiv.style.display = 'block';
    listDiv.innerHTML = '<div class="loading">جاري تحميل الحركة...</div>';

    try {
      const res = await fetch(`${API_BASE}/products/${productId}/stock-movements`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('فشل جلب الحركة');
      const data = await res.json();
      const movements = data.movements || [];
      if (movements.length === 0) {
        listDiv.innerHTML = '<div class="empty">لا توجد حركة مخزون لهذا المنتج</div>';
        return;
      }

      let html = '';
      movements.forEach(m => {
        const change = m.quantity_change || 0;
        const typeClass = change > 0 ? 'badge-in' : (change < 0 ? 'badge-out' : 'badge-info');
        const typeLabel = change > 0 ? 'دخول' : (change < 0 ? 'خروج' : 'تعديل');
        const refTypeMap = {
          'sale': 'بيع',
          'cancel_sale': 'إلغاء بيع',
          'return_sale': 'إرجاع بيع',
          'full_return_sale': 'مرتجع كلي',
          'undo_cancel_sale': 'عكس إلغاء بيع',
          'undo_return_sale': 'عكس إرجاع',
          'purchase': 'شراء',
          'cancel_purchase': 'إلغاء شراء',
          'return_purchase': 'إرجاع شراء',
          'undo_cancel_purchase': 'عكس إلغاء شراء',
          'online_order': 'طلب إنترنت',
          'update_online_order': 'تحديث طلب إنترنت',
          'update_online_order_revert': 'عكس تحديث طلب',
          'cancel_online_order': 'إلغاء طلب إنترنت',
          'delivery_failed': 'فشل توصيل',
          'online_order_return': 'إرجاع طلب إنترنت',
          'sale_update': 'تحديث فاتورة',
          'sale_update_revert': 'عكس تحديث فاتورة',
          'cancel_sale_cogs': 'إلغاء تكلفة بيع',
          'undo_cancel_sale_cogs': 'عكس إلغاء تكلفة'
        };
        const refLabel = refTypeMap[m.reference_type] || m.reference_type || 'غير معروف';

        html += `
          <div class="movement-detail">
            <div class="title">
              <span class="badge ${typeClass}">${typeLabel}</span>
              <span>${change > 0 ? '+' : ''}${change}</span>
              <span style="font-weight:400;font-size:0.9rem;color:var(--muted);margin-right:10px;">
                ${m.old_quantity} → ${m.new_quantity}
              </span>
                ${m.supplier_name ? `<span class="badge badge-info" style="font-size:0.7rem;">${escapeHtml(m.supplier_name)}</span>` : ''}
            </div>
            <div class="meta">
              <span><i class="far fa-calendar-alt"></i> ${new Date(m.created_at).toLocaleString('ar-EG')}</span>
              <span><i class="fas fa-tag"></i> ${escapeHtml(refLabel)} ${m.reference_id ? '#'+escapeHtml(m.reference_id) : ''}</span>
              ${m.note ? `<span><i class="fas fa-pencil-alt"></i> ${escapeHtml(m.note)}</span>` : ''}
              ${m.created_by_name ? `<span><i class="fas fa-user"></i> ${escapeHtml(m.created_by_name)}</span>` : ''}
            </div>
          </div>
        `;
      });
      listDiv.innerHTML = html;
    } catch (e) {
      listDiv.innerHTML = `<div class="empty">خطأ: ${e.message}</div>`;
      console.error(e);
    }

    // تمرير إلى القسم
    detailsDiv.scrollIntoView({ behavior: 'smooth' });
  }

  function closeMovementDetails() {
    document.getElementById('movementDetails').style.display = 'none';
    selectedProductId = null;
    // إعادة تحميل الصفحة لإزالة التظليل
    loadProducts(currentPage);
  }

  // البحث الفوري (مع تأخير)
  let searchTimeout = null;
  document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      currentPage = 1;
      loadProducts(1);
    }, 400);
  });

  document.getElementById('categoryFilter').addEventListener('change', function() {
    currentPage = 1;
    loadProducts(1);
  });

  // التهيئة
  window.onload = function() {
    loadCategories();
    loadProducts(1);
  };
</script>
</body>
</html>
