<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#123b72">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تجهيز الطلبات">
<title>تجهيز وتغليف الطلبات - ابن المختار</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Core Architecture Scripts -->
<script src="/api-client.js?v=1.0.4"></script>
<script src="/phone-nav.js"></script>
<script src="/login-helper.js?v=1.0.1"></script>
<script src="/date-utils.js"></script>
<script src="/number-utils.js"></script>
<script src="/permissions.js"></script>
<script src="/document-utils.js?v=20261021-2"></script>
<script src="/offline-sync.js"></script>

<style>
:root {
  --primary: #1d63c6;
  --primary-dark: #123b72;
  --primary-light: #eaf3ff;
  --success: #10b981;
  --success-dark: #059669;
  --success-light: #ecfdf5;
  --danger: #ef4444;
  --danger-light: #fef2f2;
  --warning: #f59e0b;
  --warning-dark: #d97706;
  --warning-light: #fffbeb;
  --bg: #f0f4ff;
  --surface: #ffffff;
  --surface-secondary: #f8fafc;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 30px rgba(18,59,114,0.12);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --transition: 0.2s ease;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  overflow-x: hidden;
}

body {
  padding-bottom: calc(75px + var(--safe-bottom));
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; outline: 0; }

.app-container {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--surface-secondary);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Header & Topbar */
.nav-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: linear-gradient(135deg, var(--primary-dark) 0%, #174a8b 50%, var(--primary) 100%);
  color: #fff;
  padding: calc(12px + var(--safe-top)) 16px 14px;
  box-shadow: 0 4px 20px rgba(18,59,114,0.25);
}

.nav-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(255,255,255,0.18);
  display: grid;
  place-items: center;
  font-size: 1.3rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.brand-text h1 {
  font-size: 1.05rem;
  margin: 0;
  font-weight: 800;
  line-height: 1.2;
}

.brand-text p {
  margin: 2px 0 0;
  font-size: 0.68rem;
  opacity: 0.85;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-btn {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 0.72rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: var(--transition);
}
.header-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.25); }

.user-status-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  padding: 6px 10px;
  background: rgba(255,255,255,0.12);
  border-radius: 10px;
  font-size: 0.72rem;
}

.server-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.server-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 6px #22c55e;
}
.server-dot.offline { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

/* Main Content */
.main-content {
  flex: 1;
  padding: 14px;
}

/* Stats Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 8px;
  text-align: center;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: var(--transition);
}
.stat-card:active { transform: scale(0.97); }
.stat-card.active { border-color: var(--primary); background: #f0f7ff; }

.stat-icon { font-size: 1.2rem; margin-bottom: 3px; display: block; }
.stat-label { font-size: 0.65rem; color: var(--text-secondary); font-weight: 600; }
.stat-value { font-size: 1.15rem; font-weight: 800; color: var(--text-primary); margin-top: 2px; }
.stat-card.pending .stat-value { color: var(--warning-dark); }
.stat-card.ready .stat-value { color: var(--success); }
.stat-card.total .stat-value { color: var(--primary); }

/* Filter & Search Bar */
.filter-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.search-box {
  position: relative;
  margin-bottom: 8px;
}
.search-input {
  width: 100%;
  height: 42px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 8px 36px 8px 12px;
  font-size: 0.82rem;
  background: var(--surface-secondary);
  color: var(--text-primary);
  outline: none;
  transition: var(--transition);
}
.search-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(29,99,198,0.12); }
.search-icon {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.85rem;
  pointer-events: none;
}

.filter-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.filter-select {
  flex: 1;
  height: 38px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 0.75rem;
  background: var(--surface-secondary);
  color: var(--text-primary);
  outline: none;
  cursor: pointer;
}

/* Orders List */
.orders-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Order Card - Same style as Driver Card with Prep Enhancements */
.prep-order-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  transition: var(--transition);
  position: relative;
  border-right: 5px solid var(--warning);
}

.prep-order-card.ready {
  border-right: 5px solid var(--success);
  background: linear-gradient(to left, rgba(236,253,245,0.4), var(--surface) 35%);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 6px;
}

.order-badge-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.order-number {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text-primary);
}

.order-time {
  font-size: 0.7rem;
  color: var(--primary);
  font-weight: 600;
  background: #eff6ff;
  padding: 3px 8px;
  border-radius: 8px;
}

.status-tag {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
}
.status-tag.pending { background: #fef3c7; color: #92400e; }
.status-tag.ready { background: #dcfce7; color: #166534; }
.status-tag.delivered { background: #e0f2fe; color: #075985; }

/* Customer & Delivery Info */
.order-customer-box {
  background: var(--surface-secondary);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 10px;
  font-size: 0.78rem;
}

.customer-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.customer-row:last-child { margin-bottom: 0; }
.customer-row i { width: 16px; color: var(--primary); font-size: 0.8rem; text-align: center; }

.customer-phone-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.phone-action-btn {
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 0.68rem;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.phone-action-btn.call { background: #e0f2fe; color: #0369a1; }
.phone-action-btn.wa { background: #dcfce7; color: #15803d; }

/* Order Images Section (الصور المطلوبة لتأكيد الأشكال والألوان) */
.order-images-panel {
  background: #eff6ff;
  border: 1.5px solid #bfdbfe;
  border-radius: 12px;
  padding: 9px 12px;
  margin-bottom: 12px;
}

.images-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.images-panel-title {
  font-size: 0.75rem;
  font-weight: 800;
  color: #1e40af;
  display: flex;
  align-items: center;
  gap: 5px;
}
.images-count-badge {
  background: #dbeafe;
  color: #1e3a8a;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 0.65rem;
  font-weight: 800;
}
.images-zoom-hint {
  font-size: 0.65rem;
  color: #2563eb;
  font-weight: 700;
}

.images-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.images-strip img {
  width: 58px;
  height: 58px;
  border-radius: 10px;
  object-fit: cover;
  border: 1.5px solid #93c5fd;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s ease;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.images-strip img:active { transform: scale(0.95); }

/* Checklist / Items Table */
.prep-checklist-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: #fff;
  margin-bottom: 12px;
  overflow: hidden;
}

.checklist-header {
  background: #f1f5f9;
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-secondary);
}

.prep-progress-bar {
  height: 4px;
  background: #e2e8f0;
  width: 100%;
}
.prep-progress-fill {
  height: 100%;
  background: var(--success);
  transition: width 0.3s ease;
}

.checklist-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid #f1f5f9;
  transition: background 0.15s ease;
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item.is-checked { background: #f0fdf4; }

.prep-checkbox-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 2px solid #cbd5e1;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  color: transparent;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.prep-checkbox-btn.checked {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
  transform: scale(1.05);
  box-shadow: 0 2px 6px rgba(16,185,129,0.3);
}

.item-details {
  flex: 1;
  min-width: 0;
}
.item-name {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.3;
}
.checklist-item.is-checked .item-name {
  text-decoration: line-through;
  opacity: 0.65;
}

.item-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.72rem;
  color: var(--text-secondary);
  margin-top: 3px;
  flex-wrap: wrap;
}
.item-qty-badge {
  background: #e0e7ff;
  color: #3730a3;
  padding: 1px 7px;
  border-radius: 6px;
  font-weight: 800;
  font-size: 0.72rem;
}
.item-note-tag {
  background: #fffbeb;
  color: #b45309;
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 0.68rem;
}

/* Card Actions */
.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}

.btn-complete-prep {
  flex: 2;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--success), var(--success-dark));
  color: #fff;
  font-weight: 800;
  font-size: 0.82rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 4px 14px rgba(16,185,129,0.25);
  transition: var(--transition);
}
.btn-complete-prep:active { transform: scale(0.97); }

.btn-print-prep {
  flex: 1;
  height: 44px;
  border-radius: 12px;
  background: #fff;
  border: 1.5px solid var(--border);
  color: var(--text-secondary);
  font-weight: 700;
  font-size: 0.78rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.btn-print-prep:active { background: #f8fafc; }

/* Empty State */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.6; display: block; }

/* Bottom Nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  max-width: 520px;
  width: 100%;
  background: var(--surface);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 0 calc(8px + var(--safe-bottom));
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
  border-top: 1px solid var(--border);
  z-index: 100;
}
.nav-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 0.65rem;
  color: var(--text-muted);
  cursor: pointer;
  padding: 5px 12px;
  gap: 3px;
  font-weight: 600;
  transition: var(--transition);
  position: relative;
}
.nav-tab i { font-size: 1.15rem; }
.nav-tab.active { color: var(--primary); font-weight: 800; }
.nav-tab.active::before {
  content: '';
  position: absolute;
  top: -8px;
  width: 24px;
  height: 3px;
  background: var(--primary);
  border-radius: 0 0 4px 4px;
}

/* Lightbox Modal */
.prep-lightbox {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.prep-lightbox img {
  max-width: 95vw;
  max-height: 85vh;
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  object-fit: contain;
}
.prep-lightbox-close {
  position: absolute;
  top: 16px;
  left: 16px;
  background: rgba(255,255,255,0.25);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  font-size: 1.3rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* --- تنبيهات وإشعارات الطلبات الجديدة والمعدلة --- */
@keyframes orderPulseGreen {
  0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}
@keyframes orderPulseBlue {
  0% { box-shadow: 0 0 0 0 rgba(29, 99, 198, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(29, 99, 198, 0); }
  100% { box-shadow: 0 0 0 0 rgba(29, 99, 198, 0); }
}
.order-card-new-alert {
  animation: orderPulseGreen 2s infinite;
  border: 2px solid #10b981 !important;
}
.order-card-modified-alert {
  animation: orderPulseBlue 2s infinite;
  border: 2px solid #1d63c6 !important;
}
.order-alert-pill {
  font-size: 0.65rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.order-alert-pill.new { background: #dcfce7; color: #15803d; }
.order-alert-pill.modified { background: #dbeafe; color: #1e40af; }

/* Styling for Modified Orders in Preparation */
.prep-order-card.is-modified {
  border-right: 5px solid #f59e0b !important;
}
.prep-mod-alert-box {
  background: #fffbeb;
  border: 1px solid #fcd34d;
  border-radius: 10px;
  padding: 8px 12px;
  margin: 8px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.prep-mod-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.prep-mod-title {
  color: #b45309;
  font-weight: 800;
  font-size: 0.82rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.prep-mod-time {
  font-size: 0.7rem;
  color: #92400e;
}
.prep-mod-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pmod-chip {
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 0.72rem;
  font-weight: 700;
}
.pmod-add { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
.pmod-inc { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
.pmod-dec { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
.pmod-rem { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

/* Checklist Item Modification Highlights */
.checklist-item.is-mod-added {
  background: #f0fdf4 !important;
  border-right: 5px solid #22c55e !important;
}
.checklist-item.is-mod-increased {
  background: #eff6ff !important;
  border-right: 5px solid #3b82f6 !important;
}
.checklist-item.is-mod-decreased {
  background: #fffbeb !important;
  border-right: 5px solid #f59e0b !important;
}
.mod-item-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 0.72rem;
  font-weight: 700;
  margin-top: 3px;
  width: fit-content;
}
.mod-item-tag.tag-added {
  background: #dcfce7;
  color: #166534;
  border: 1px solid #bbf7d0;
}
.mod-item-tag.tag-increased {
  background: #dbeafe;
  color: #1e40af;
  border: 1px solid #bfdbfe;
}
.mod-item-tag.tag-decreased {
  background: #fef3c7;
  color: #92400e;
  border: 1px solid #fde68a;
}

/* Removed Items Box */
.prep-removed-items-block {
  background: #fff1f2;
  border: 1.5px dashed #f43f5e;
  border-radius: 10px;
  padding: 10px;
  margin-top: 10px;
}
.prep-removed-title {
  color: #be123c;
  font-size: 0.8rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.prep-removed-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.prep-removed-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #ffffff;
  border: 1px solid #fecdd3;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
}
.prep-removed-name {
  font-weight: 700;
  color: #9f1239;
  text-decoration: line-through;
}
.prep-removed-qty {
  color: #e11d48;
  font-weight: 800;
  background: #ffe4e6;
  padding: 1px 6px;
  border-radius: 4px;
}

.prep-notif-toast-container {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 999999;

@media print {
  @page {
    size: A4 portrait;
    margin: 4mm 5mm;
  }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #ffffff !important;
    height: auto !important;

  body.a4-printing-mode > *:not(#batchA4PrintSection) {

    margin: 0 !important;

    background: #ffffff !important;

  .a4-sheet-page {

    page-break-after: always;
    break-after: page;

  .a4-slip-card {

  .slip-watermark {

<script>
// ==================== APP STATE ====================
let allOrders = [];
let filteredOrders = [];
let currentFilterStatus = 'pending'; // 'pending' | 'ready' | 'all'
let currentSearchQuery = '';
let isRefreshing = false;
let audioCtx = null;

// Store identity cache (fast local retrieval & background sync)
let currentShopName = localStorage.getItem('prep_shop_name')
  || (window.POSDocs?.getIdentity()?.shop_name)
  || 'لمسات منزلية ابن المختار';

let currentShopLogo = localStorage.getItem('prep_shop_logo_base64')
  || localStorage.getItem('prep_shop_logo')
  || (window.POSDocs?.getIdentity()?.shop_logo)
  || 'https://pos.ibnalmukhtar.com/icon-512x512.png';

async function cacheLogoAsBase64(url) {
  if (!url || url.startsWith('data:')) return url;
  try {
    const res = await fetch(url, { mode: 'cors' }).catch(() => null);
    if (!res || !res.ok) return url;
    const blob = await res.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64data = reader.result;
        if (base64data && typeof base64data === 'string' && base64data.startsWith('data:image')) {
          try { localStorage.setItem('prep_shop_logo_base64', base64data); } catch(_) {}
          currentShopLogo = base64data;
          resolve(base64data);
        } else {
          resolve(url);
        }
      };
      reader.onerror = () => resolve(url);
      reader.readAsDataURL(blob);
    });
  } catch(e) {
    return url;
  }
}

async function loadStoreSettings() {
  try {
    const token = getAuthToken();
    const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
    let res;
    if (window.apiClient && typeof window.apiClient.fetchWithFailover === 'function') {
      res = await window.apiClient.fetchWithFailover('/settings', { headers });
    } else {
      const base = (window.apiClient?.baseUrl || localStorage.getItem('posApiBase') || 'https://api.ibnalmukhtar.com').replace(/\/$/, '');
      res = await fetch(`${base}/settings`, { headers });
    }
    if (res && res.ok) {
      const data = await res.json().catch(() => ({}));
      if (data && data.settings) {
        if (data.settings.shop_name && typeof data.settings.shop_name === 'string' && data.settings.shop_name.trim()) {
          currentShopName = data.settings.shop_name.trim();
          localStorage.setItem('prep_shop_name', currentShopName);
        }
        if (data.settings.shop_logo && typeof data.settings.shop_logo === 'string' && data.settings.shop_logo.trim()) {
          const logoUrl = data.settings.shop_logo.trim();
          localStorage.setItem('prep_shop_logo', logoUrl);
          currentShopLogo = logoUrl;
          await cacheLogoAsBase64(logoUrl);
        }
      }
    }
    // If not cached as base64 yet, cache current logo in background
    if (!localStorage.getItem('prep_shop_logo_base64') && currentShopLogo && !currentShopLogo.startsWith('data:')) {
      cacheLogoAsBase64(currentShopLogo);
    }
  } catch (e) {
    console.warn('Failed to load store settings:', e);
  }
}

// Sound Feedback
function playCheckSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); // A5
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } catch (e) {}
}

function playCompleteSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now); // C5
    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(now + 0.35);
  } catch (e) {}
}

// Authentication
function getAuthToken() {
  return localStorage.getItem('pos_token') || localStorage.getItem('token') || '';
}

function checkAuth() {
  const token = getAuthToken();
  if (!token) {
    location.href = '/phone/index.html?next=' + encodeURIComponent(location.pathname + location.search);
    return false;
  }
  const user = JSON.parse(localStorage.getItem('pos_user') || '{}');
  if ($('currentUserLabel') && user) {
    $('currentUserLabel').textContent = user.name || user.username || 'موظف التجهيز';
  }
  return true;
}

function logoutPrep() {
  localStorage.removeItem('pos_token');
  localStorage.removeItem('pos_user');
  location.href = '/phone/index.html?next=/prep.html';
}

function $(id) { return document.getElementById(id); }

// Server status & Badge
function updateServerBadgeUi() {
  const dot = $('serverDot');
  const label = $('serverNameLabel');
  if (!dot || !label) return;
  const current = (window.apiClient?.baseUrl || localStorage.getItem('posApiBase') || '').toLowerCase();
  if (current.includes('api2')) {
    dot.style.background = '#1d63c6';
    label.textContent = 'الاحتياطي (api2)';
  } else {
    dot.style.background = '#22c55e';
    label.textContent = 'الأساسي (api)';
  }
}

function switchServerManual() {
  if (window.apiClient && typeof window.apiClient.toggleEndpoint === 'function') {
    window.apiClient.toggleEndpoint();
    updateServerBadgeUi();
    refreshPrepOrders();
  }
}

// Load Drivers for Filter
async function loadDrivers() {
  try {
    const res = await (window.apiClient?.fetchWithFailover ? window.apiClient.fetchWithFailover('/drivers') : fetch('/drivers'));
    const data = await res.json().catch(() => ({}));
    const list = data.drivers || [];
    const select = $('driverFilter');
    if (!select) return;
    select.innerHTML = '<option value="">🛵 جميع المندوبين</option>' + list.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    try {
      const savedDriver = localStorage.getItem('prep_driver_filter');
      if (savedDriver && select.querySelector(`option[value="${savedDriver}"]`)) {
        select.value = savedDriver;
      }
    } catch(e) {}
  } catch (e) {}
}

// Tracking & Notification State
let knownOrdersMap = new Map();
let isInitialPrepLoad = true;
let newAlertOrderIds = new Set();
let modifiedAlertOrderIds = new Set();

function playNotificationChime(type = 'new') {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const now = ctx.currentTime;

    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(type === 'modified' ? 523.25 : 587.33, now); // C5 or D5
    gain1.gain.setValueAtTime(0.25, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.start(now);
    osc1.stop(now + 0.3);

    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(type === 'modified' ? 783.99 : 880, now + 0.12); // G5 or A5
    gain2.gain.setValueAtTime(0.3, now + 0.12);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.start(now + 0.12);
    osc2.stop(now + 0.5);
  } catch (e) {}
}

function showPrepToast(title, body, type = 'new', targetOrderId = null) {
  const container = $('prepNotifToastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = 'prep-notif-toast ' + (type === 'modified' ? 'modified' : '');
  toast.innerHTML = `
    <div style="display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="scrollToOrderCard(${targetOrderId})">
      <span style="font-size:1.3rem;">${type === 'modified' ? '✏️' : '🔔'}</span>
      <div>
        <strong style="display:block; font-size:0.85rem;">${title}</strong>
        <span style="font-size:0.72rem; opacity:0.85;">${body}</span>
      </div>
    </div>
    <button type="button" onclick="this.parentElement.remove()" style="background:transparent; border:none; color:#94a3b8; font-size:1rem; cursor:pointer;">✕</button>
  `;

  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 7000);
}

function scrollToOrderCard(orderId) {
  if (!orderId) return;
  const el = $(`order-card-${orderId}`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    newAlertOrderIds.delete(orderId);
    modifiedAlertOrderIds.delete(orderId);
    el.classList.remove('order-card-new-alert', 'order-card-modified-alert');
  }
}

async function requestPrepNotificationPermission() {
  if (!('Notification' in window)) {
    alert('متصفحك لا يدعم إشعارات النظام، لكن الإشعارات الصوتية والمباشرة تعمل داخل التطبيق.');
    return;
  }
  try {
    const res = await Notification.requestPermission();
    updateNotifBellIcon();
    if (res === 'granted') {
      showPrepToast('تم تفعيل الإشعارات بنجاح', 'ستصلك تنبيهات لحظية فور إضافة أو تعديل أي طلب', 'new');
      playNotificationChime('new');
    }
  } catch (e) {}
}

function updateNotifBellIcon() {
  const btn = $('prepNotifBellBtn');
  if (!btn) return;
  if ('Notification' in window && Notification.permission === 'granted') {
    btn.classList.add('notif-active');
    btn.title = 'الإشعارات مفعلة ✅';
  } else {
    btn.classList.remove('notif-active');
  }
}

function triggerBrowserNotification(title, body) {
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    try {
      new Notification(title, {
        body,
        icon: '/icon-192x192.png',
        badge: '/icon-192x192.png',
        tag: 'prep-order-alert',
        renotify: true
      });
    } catch (e) {}
  }
}

function getOrderModifications(order) {
  if (!order || !order.order_modifications) return null;
  if (typeof order.order_modifications === 'object') return order.order_modifications;
  try {
    return JSON.parse(order.order_modifications);
  } catch(e) {
    return null;
  }
}

function getItemModification(mod, item) {
  if (!mod || !mod.has_changes) return null;
  const pId = item.product_id ? Number(item.product_id) : null;
  const pName = (item.product_name || item.catalog_name || '').trim();

  // 1. فحص المضاف
  if (Array.isArray(mod.added)) {
    const found = mod.added.find(m => (pId && Number(m.product_id) === pId) || (pName && m.product_name && m.product_name.trim() === pName));
    if (found) return { type: 'added', ...found };
  }
  // 2. فحص الزيادة
  if (Array.isArray(mod.increased)) {
    const found = mod.increased.find(m => (pId && Number(m.product_id) === pId) || (pName && m.product_name && m.product_name.trim() === pName));
    if (found) return { type: 'increased', ...found };
  }
  // 3. فحص الإنقاص
  if (Array.isArray(mod.decreased)) {
    const found = mod.decreased.find(m => (pId && Number(m.product_id) === pId) || (pName && m.product_name && m.product_name.trim() === pName));
    if (found) return { type: 'decreased', ...found };
  }
  return null;
}

function isOrderReadyPrep(order) {
  if (!order) return false;
  const s = String(order.prep_status || '').toLowerCase().trim();
  const mainStatus = String(order.status || '').trim();
  if (s === 'pending') return false;
  const localStatus = localStorage.getItem(`prep_status_${order.id}`) || '';
  if (s === 'ready' || s === 'تم التجهيز' || mainStatus === 'جاهز للتوصيل' || mainStatus === 'جاهز' || localStatus === 'ready') {
    return true;
  }
  const items = order.items || [];
  if (items.length > 0) {
    let prepMap = null;
    try {
      prepMap = typeof order.prepared_items === 'string' ? JSON.parse(order.prepared_items) : order.prepared_items;
    } catch(e) {}
    if (!prepMap) {
      try {
        const cached = localStorage.getItem(`prep_items_${order.id}`);
        if (cached) prepMap = JSON.parse(cached);
      } catch(e) {}
    }
    if (prepMap && typeof prepMap === 'object') {
      const allChecked = items.every(it => prepMap[it.id] === true);
      if (allChecked) return true;
    }
  }
  return false;
}

function isOrderPendingPrep(order) {
  const mainStatus = String(order.status || '');
  if (['تم التسليم', 'ملغي', 'فشل التسليم', 'مرتجع كلي'].includes(mainStatus)) return false;
  return !isOrderReadyPrep(order);
}

// Fetch Orders
async function loadPrepOrders(isSilent = false) {
  if (!checkAuth()) return;
  const listEl = $('prepOrdersList');
  if (listEl && allOrders.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><span class="empty-icon"><i class="fas fa-spinner fa-spin"></i></span><span>جاري تحميل طلبات التجهيز...</span></div>';
  }

  const period = $('periodFilter')?.value || 'today';
  let dateQuery = '';
  const now = new Date();
  if (period === 'today') {
    const todayStr = now.toISOString().split('T')[0];
    dateQuery = `&date_from=${todayStr}`;
  } else if (period === 'last2days') {
    const d = new Date(now);
    d.setDate(now.getDate() - 2);
    dateQuery = `&date_from=${d.toISOString().split('T')[0]}`;
  } else if (period === 'week') {
    const d = new Date(now);
    d.setDate(now.getDate() - 7);
    dateQuery = `&date_from=${d.toISOString().split('T')[0]}`;
  }

  try {
    const endpoint = `/online-orders?limit=50&include_items=1${dateQuery}`;
    let res;
    if (window.apiClient && typeof window.apiClient.fetchWithFailover === 'function') {
      res = await window.apiClient.fetchWithFailover(endpoint, {
        headers: { 'Authorization': 'Bearer ' + getAuthToken() }
      });
    } else {
      res = await fetch((window.apiClient?.baseUrl || '') + endpoint, {
        headers: { 'Authorization': 'Bearer ' + getAuthToken() }
      });
    }
    const data = await res.json().catch(() => ({}));
    if (data.orders) {
      const incoming = data.orders;

      if (!isInitialPrepLoad) {
        let hasNew = false;
        let hasModified = false;
        let lastNotifTitle = '';
        let lastNotifBody = '';
        let targetId = null;

        for (const order of incoming) {
          const prev = knownOrdersMap.get(order.id);
          if (!prev) {
            hasNew = true;
            targetId = order.id;
            lastNotifTitle = `📦 طلب جديد بانتظار التجهيز #${order.id}`;
            lastNotifBody = `العميل: ${order.customer_name || 'عام'} (${(order.items||[]).length} أصناف)`;
            newAlertOrderIds.add(order.id);
          } else {
            const prevImgs = String(prev.order_images || '');
            const newImgs = String(order.order_images || '');
            const prevNotes = String(prev.notes || '');
            const newNotes = String(order.notes || '');
            const prevItemsCount = (prev.items || []).length;
            const newItemsCount = (order.items || []).length;
            const prevTotal = Number(prev.total_amount) || 0;
            const newTotal = Number(order.total_amount) || 0;

            if (prevImgs !== newImgs || prevNotes !== newNotes || prevItemsCount !== newItemsCount || prevTotal !== newTotal) {
              hasModified = true;
              targetId = order.id;
              lastNotifTitle = `✏️ تم تعديل الطلب #${order.id}`;
              lastNotifBody = `تم تحديث الموديلات أو الأصناف من قِبل الإدارة`;
              modifiedAlertOrderIds.add(order.id);
            }
          }
        }

        if (hasNew) {
          playNotificationChime('new');
          showPrepToast(lastNotifTitle, lastNotifBody, 'new', targetId);
          triggerBrowserNotification(lastNotifTitle, lastNotifBody);
        } else if (hasModified) {
          playNotificationChime('modified');
          showPrepToast(lastNotifTitle, lastNotifBody, 'modified', targetId);
          triggerBrowserNotification(lastNotifTitle, lastNotifBody);
        }
      }

      knownOrdersMap.clear();
      incoming.forEach(o => knownOrdersMap.set(o.id, JSON.parse(JSON.stringify(o))));
      isInitialPrepLoad = false;

      allOrders = incoming;
      updateStats();
      applyFilters();
    }
  } catch (err) {
    console.error('Failed to load orders:', err);
    if (listEl && allOrders.length === 0) {
      listEl.innerHTML = `<div class="empty-state text-danger"><span class="empty-icon">⚠️</span><span>تعذر جلب الطلبات: ${err.message || 'خطأ في الاتصال'}</span></div>`;
    }
  } finally {
    updateServerBadgeUi();
  }
}

async function refreshPrepOrders() {
  if (isRefreshing) return;
  isRefreshing = true;
  await loadPrepOrders();
  isRefreshing = false;
}

// Stats Calculation
function updateStats() {
  const pending = allOrders.filter(o => isOrderPendingPrep(o)).length;
  const ready = allOrders.filter(o => isOrderReadyPrep(o)).length;
  const total = allOrders.length;

  if ($('statPendingCount')) $('statPendingCount').textContent = pending;
  if ($('statReadyCount')) $('statReadyCount').textContent = ready;
  if ($('statTotalCount')) $('statTotalCount').textContent = total;
}

function isOrderPendingPrep(order) {
  const s = String(order.prep_status || '').toLowerCase();
  const mainStatus = String(order.status || '');
  if (['تم التسليم', 'ملغي', 'فشل التسليم', 'مرتجع كلي'].includes(mainStatus)) return false;
  return s !== 'ready' && s !== 'تم التجهيز';
}

function isOrderReadyPrep(order) {
  const s = String(order.prep_status || '').toLowerCase();
  return s === 'ready' || s === 'تم التجهيز';
}

// Filtering
function setFilterStatus(status) {
  currentFilterStatus = status;
  try { localStorage.setItem('prep_filter_status', status); } catch(e) {}
  $('statPendingCard')?.classList.toggle('active', status === 'pending');
  $('statReadyCard')?.classList.toggle('active', status === 'ready');
  $('statTotalCard')?.classList.toggle('active', status === 'all');

  $('tabPending')?.classList.toggle('active', status === 'pending');
  $('tabReady')?.classList.toggle('active', status === 'ready');
  $('tabAll')?.classList.toggle('active', status === 'all');

  applyFilters();
}

function handlePeriodFilterChange() {
  const val = $('periodFilter')?.value || 'today';
  try { localStorage.setItem('prep_period_filter', val); } catch(e) {}
  loadPrepOrders();
}

function handleDriverFilterChange() {
  const val = $('driverFilter')?.value || '';
  try { localStorage.setItem('prep_driver_filter', val); } catch(e) {}
  applyFilters();
}

function restoreSavedPrepFilters() {
  try {
    const savedPeriod = localStorage.getItem('prep_period_filter');
    if (savedPeriod && $('periodFilter')) {
      $('periodFilter').value = savedPeriod;
    }
    const savedStatus = localStorage.getItem('prep_filter_status');
    if (savedStatus && ['pending', 'ready', 'all'].includes(savedStatus)) {
      currentFilterStatus = savedStatus;
      $('statPendingCard')?.classList.toggle('active', savedStatus === 'pending');
      $('statReadyCard')?.classList.toggle('active', savedStatus === 'ready');
      $('statTotalCard')?.classList.toggle('active', savedStatus === 'all');

      $('tabPending')?.classList.toggle('active', savedStatus === 'pending');
      $('tabReady')?.classList.toggle('active', savedStatus === 'ready');
      $('tabAll')?.classList.toggle('active', savedStatus === 'all');
    }
  } catch(e) {}
}

function handleSearchInput() {
  currentSearchQuery = ($('prepSearchInput')?.value || '').trim().toLowerCase();
  applyFilters();
}

function applyFilters() {
  const driverId = $('driverFilter')?.value || '';
  
  filteredOrders = allOrders.filter(order => {
    // Status Filter
    if (currentFilterStatus === 'pending' && !isOrderPendingPrep(order)) return false;
    if (currentFilterStatus === 'ready' && !isOrderReadyPrep(order)) return false;

    // Driver Filter
    if (driverId && String(order.assigned_driver_id) !== String(driverId)) return false;

    // Search Query
    if (currentSearchQuery) {
      const matchId = String(order.id).includes(currentSearchQuery);
      const matchCust = (order.customer_name || '').toLowerCase().includes(currentSearchQuery);
      const matchPhone = (order.customer_phone || '').includes(currentSearchQuery);
      const matchAddress = (order.customer_address || '').toLowerCase().includes(currentSearchQuery);
      const matchItems = (order.items || []).some(i => (i.product_name || i.catalog_name || '').toLowerCase().includes(currentSearchQuery));
      if (!matchId && !matchCust && !matchPhone && !matchAddress && !matchItems) return false;
    }
    return true;
  });

  renderOrders();
}

// Rendering
function renderOrders() {
  const container = $('prepOrdersList');
  if (!container) return;

  if (filteredOrders.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <span class="empty-icon">📦</span>
        <strong>لا توجد طلبات تطابق الفلتر الحالي</strong>
        <p style="font-size:0.75rem; margin-top:4px;">يمكنك تغيير الفلتر أو البحث عن طلب آخر</p>
      </div>`;
    return;
  }

  container.innerHTML = filteredOrders.map(order => renderOrderCardHtml(order)).join('');
}

function renderOrderCardHtml(order) {
  const isReady = isOrderReadyPrep(order);
  const items = order.items || [];
  
  // Format Date
  let dateDisplay = 'اليوم';
  if (order.order_date || order.created_at) {
    try {
      const d = new Date((order.order_date || order.created_at).replace(' ', 'T'));
      dateDisplay = d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', hour12: true });
    } catch(e) {}
  }

  // Modification awareness
  const mod = getOrderModifications(order);
  const hasMod = mod && mod.has_changes;

  // If order was modified or pending on server, remove stale local cache
  if (hasMod && (!order.prepared_items || order.prep_status === 'pending')) {
    try {
      localStorage.removeItem(`prep_status_${order.id}`);
      if (!order.prepared_items) {
        localStorage.removeItem(`prep_items_${order.id}`);
      }
    } catch(e) {}
  }

  // Parse Prepared Items with local fallback
  let preparedMap = {};
  try {
    preparedMap = typeof order.prepared_items === 'string' ? JSON.parse(order.prepared_items) : (order.prepared_items || {});
  } catch(e) { preparedMap = {}; }

  if (!preparedMap || Object.keys(preparedMap).length === 0) {
    try {
      const cached = localStorage.getItem(`prep_items_${order.id}`);
      if (cached) preparedMap = JSON.parse(cached);
    } catch(e) {}
  }

  const totalItemsCount = items.length;
  const checkedItemsCount = items.filter(it => preparedMap[it.id] === true).length;
  const progressPercent = totalItemsCount > 0 ? Math.round((checkedItemsCount / totalItemsCount) * 100) : 0;

  // Order Images
  let imgs = [];
  try {
    imgs = typeof order.order_images === 'string' ? JSON.parse(order.order_images) : (order.order_images || []);
  } catch(e) { imgs = []; }

  let imagesHtml = '';
  if (Array.isArray(imgs) && imgs.length > 0) {
    imagesHtml = `
      <div class="order-images-panel">
        <div class="images-panel-header">
          <div class="images-panel-title">
            <i class="fas fa-camera"></i>
            <span>صور الأشكال والموديلات المطلوبة</span>
            <span class="images-count-badge">${imgs.length} صور</span>
          </div>
          <span class="images-zoom-hint">انقر للتكبير 🔍</span>
        </div>
        <div class="images-strip">
          ${imgs.map(img => `<img src="${img}" onclick="openPrepLightbox('${img}')" title="انقر لتكبير صورة الموديل" />`).join('')}
        </div>
      </div>
    `;
  }

  // Items Checklist (مع تمييز الأصناف المضافة والزيادة والنقصان)
  const itemsChecklistRows = items.map(item => {
    const isChecked = !!preparedMap[item.id];
    const itemName = item.product_name || item.catalog_name || `صنف #${item.product_id}`;
    const variantTag = item.variant_label ? `<span class="item-note-tag">${item.variant_label}</span>` : '';
    const noteTag = item.note || item.notes ? `<span class="item-note-tag">📌 ${item.note || item.notes}</span>` : '';

    const itemMod = getItemModification(mod, item);
    let modTag = '';
    let itemModClass = '';
    if (itemMod) {
      if (itemMod.type === 'added') {
        itemModClass = 'is-mod-added';
        modTag = `<span class="mod-item-tag tag-added"><i class="fas fa-plus-circle"></i> 🆕 صنف مضاف جديد (+${item.quantity})</span>`;
      } else if (itemMod.type === 'increased') {
        itemModClass = 'is-mod-increased';
        modTag = `<span class="mod-item-tag tag-increased"><i class="fas fa-arrow-up"></i> ⬆️ زادت الكمية من ${itemMod.old_quantity} إلى ${itemMod.new_quantity} (+${itemMod.diff})</span>`;
      } else if (itemMod.type === 'decreased') {
        itemModClass = 'is-mod-decreased';
        modTag = `<span class="mod-item-tag tag-decreased"><i class="fas fa-arrow-down"></i> ⬇️ نَقَصت الكمية من ${itemMod.old_quantity} إلى ${itemMod.new_quantity} (-${itemMod.diff})</span>`;
      }
    }

    return `
      <div class="checklist-item ${itemModClass} ${isChecked ? 'is-checked' : ''}" id="item-row-${order.id}-${item.id}">
        <button type="button" class="prep-checkbox-btn ${isChecked ? 'checked' : ''}" 
                onclick="toggleItemCheck(${order.id}, ${item.id}, event)" title="تعليم الصنف">
          ✓
        </button>
        <div class="item-details">
          <div class="item-name">${itemName}</div>
          <div class="item-meta">
            <span class="item-qty-badge">الكمية: ${item.quantity}</span>
            ${variantTag}
            ${noteTag}
          </div>
          ${modTag}
        </div>
      </div>
    `;
  });

  let itemsChecklistHtml = '';
  if (itemsChecklistRows.length === 0) {
    itemsChecklistHtml = '<div style="padding:10px;text-align:center;font-size:0.75rem;color:#94a3b8;">لا توجد أصناف</div>';
  } else if (itemsChecklistRows.length <= 3) {
    itemsChecklistHtml = itemsChecklistRows.join('');
  } else {
    const first3Html = itemsChecklistRows.slice(0, 3).join('');
    const extraHtml = itemsChecklistRows.slice(3).join('');
    const remainingCount = itemsChecklistRows.length - 3;
    itemsChecklistHtml = `
      ${first3Html}
      <div id="extra-items-${order.id}" class="extra-prep-items" style="display:none;">
        ${extraHtml}
      </div>
      <button type="button" class="btn-more-items-prep" id="toggle-items-btn-${order.id}" onclick="event.stopPropagation(); togglePrepExtraItems(${order.id}, ${remainingCount})">
        <span>▼ إظهار باقي الأصناف (${remainingCount} أصناف إضافية)</span>
      </button>
    `;
  }

  // تنبيه تعديل الطلب الذكي (Alert Banner)
  let modAlertHtml = '';
  if (hasMod) {
    const addedCount = (mod.added || []).length;
    const increasedCount = (mod.increased || []).length;
    const decreasedCount = (mod.decreased || []).length;
    const removedCount = (mod.removed || []).length;

    let timeText = '';
    if (mod.modified_at) {
      try {
        const md = new Date(mod.modified_at);
        timeText = md.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
      } catch(e) {}
    }

    modAlertHtml = `
      <div class="prep-mod-alert-box">
        <div class="prep-mod-header">
          <div class="prep-mod-title">
            <i class="fas fa-exclamation-triangle"></i>
            <span>⚠️ تنبيه ذكي: تم تعديل هذا الطلب</span>
          </div>
          ${timeText ? `<span class="prep-mod-time"><i class="fas fa-history"></i> تم التعديل: ${timeText}</span>` : ''}
        </div>
        <div class="prep-mod-badges">
          ${addedCount > 0 ? `<span class="pmod-chip pmod-add">🆕 مضاف جديد (${addedCount})</span>` : ''}
          ${increasedCount > 0 ? `<span class="pmod-chip pmod-inc">⬆️ زيادة كمية (${increasedCount})</span>` : ''}
          ${decreasedCount > 0 ? `<span class="pmod-chip pmod-dec">⬇️ إنقاص كمية (${decreasedCount})</span>` : ''}
          ${removedCount > 0 ? `<span class="pmod-chip pmod-rem">❌ صنف ملغي (${removedCount})</span>` : ''}
        </div>
      </div>
    `;
  }

  // أصناف تم حذفها (قائمة حمراء خاصة للمجهّز كي يُخرجها من الصندوق إن وُجدت)
  let removedItemsHtml = '';
  if (hasMod && Array.isArray(mod.removed) && mod.removed.length > 0) {
    removedItemsHtml = `
      <div class="prep-removed-items-block">
        <div class="prep-removed-title">
          <i class="fas fa-trash-alt"></i>
          <span>❌ أصناف تم حذفها وإلغاؤها من الطلب (أعدها إلى الرف):</span>
        </div>
        <div class="prep-removed-list">
          ${mod.removed.map(rem => `
            <div class="prep-removed-row">
              <span class="prep-removed-name">🗑️ ${rem.product_name || `صنف #${rem.product_id}`}</span>
              <span class="prep-removed-qty">الكمية الملغاة: <strong>${rem.quantity}</strong></span>
              ${rem.variant_label ? `<span class="prep-removed-variant">${rem.variant_label}</span>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  return `
    <article class="prep-order-card ${isReady ? 'ready' : ''} ${hasMod ? 'is-modified' : ''} ${newAlertOrderIds.has(order.id) ? 'order-card-new-alert' : ''} ${modifiedAlertOrderIds.has(order.id) ? 'order-card-modified-alert' : ''}" id="order-card-${order.id}" onclick="newAlertOrderIds.delete(${order.id}); modifiedAlertOrderIds.delete(${order.id}); this.classList.remove('order-card-new-alert', 'order-card-modified-alert');">
      <div class="card-header">
        <div class="order-badge-row">
          <span class="order-number">📦 طلب #${order.id}</span>
          ${hasMod ? '<span class="order-alert-pill modified"><i class="fas fa-edit"></i> معدل</span>' : ''}
          <span class="order-time"><i class="fas fa-clock"></i> ${dateDisplay}</span>
          ${order.driver_name ? `<span style="font-size:0.7rem; color:#4338ca; background:#e0e7ff; padding:2px 8px; border-radius:8px; font-weight:700;">🛵 ${order.driver_name}</span>` : '<span style="font-size:0.7rem; color:#64748b; background:#f1f5f9; padding:2px 8px; border-radius:8px;">بدون مندوب</span>'}
        </div>
        <span class="status-tag ${isReady ? 'ready' : 'pending'}">
          ${isReady ? '✅ مُجهز بالكامل' : '⏳ قيد التجهيز'}
        </span>
      </div>

      <!-- تنبيه تعديل أصناف الطلب الذكي -->
      ${modAlertHtml}

      <!-- بيانات العميل والتوصيل -->
      <div class="order-customer-box">
        <div class="customer-row">
          <i class="fas fa-user"></i>
          <strong>${order.customer_name || 'عميل عام'}</strong>
        </div>
        <div class="customer-row">
          <i class="fas fa-map-marker-alt"></i>
          <span>${order.customer_address || 'عنوان غير محدد'}</span>
        </div>
        ${order.notes ? `<div class="customer-row" style="color:#b45309;"><i class="fas fa-sticky-note"></i> <span>ملاحظات: ${order.notes}</span></div>` : ''}
        ${order.customer_phone ? `
          <div class="customer-phone-actions">
            <a href="tel:${order.customer_phone}" class="phone-action-btn call"><i class="fas fa-phone"></i> ${order.customer_phone}</a>

      <div class="prep-checklist-card">

          </span>

        </div>
        ${removedItemsHtml}
      </div>

      <!-- أزرار الإجراءات -->
      <div class="card-actions">
        <button type="button" class="btn-complete-prep" onclick="completeOrderPackaging(${order.id})">
          <i class="fas fa-box"></i>
          <span>${isReady ? 'تحديث الاعتماد والتجهيز' : '✅ تم التجهيز والتغليف بالكامل'}</span>

        <button type="button" class="btn-print-prep" onclick="printPrepSlip(${order.id})">
          <i class="fas fa-print"></i>
          <span>طباعة</span>

    </article>
  `;
}

// Item Check Toggle
async function toggleItemCheck(orderId, itemId, event) {
  event?.stopPropagation();
  const order = allOrders.find(o => o.id === orderId);
  if (!order) return;

  let preparedMap = {};
  try {
    preparedMap = typeof order.prepared_items === 'string' ? JSON.parse(order.prepared_items) : (order.prepared_items || {});
  } catch(e) { preparedMap = {}; }
  if (!preparedMap || Object.keys(preparedMap).length === 0) {
    try {
      const cached = localStorage.getItem(`prep_items_${orderId}`);
      if (cached) preparedMap = JSON.parse(cached);
    } catch(e) {}
  }

  preparedMap[itemId] = !preparedMap[itemId];
  order.prepared_items = preparedMap;

  // Persist locally immediately
  try {
    localStorage.setItem(`prep_items_${orderId}`, JSON.stringify(preparedMap));
  } catch(e) {}

  if (preparedMap[itemId]) playCheckSound();

  // Update UI row directly
  const row = $(`item-row-${orderId}-${itemId}`);
  const btn = row?.querySelector('.prep-checkbox-btn');
  if (row && btn) {
    row.classList.toggle('is-checked', preparedMap[itemId]);
    btn.classList.toggle('checked', preparedMap[itemId]);
  }

  // Update Progress Bar & Ratio
  const items = order.items || [];
  const checkedCount = items.filter(it => preparedMap[it.id] === true).length;
  const percent = items.length > 0 ? Math.round((checkedCount / items.length) * 100) : 0;
  
  const bar = $(`prep-bar-${orderId}`);
  if (bar) bar.style.width = percent + '%';
  const ratio = $(`prep-ratio-${orderId}`);
  if (ratio) ratio.textContent = `مُجهز ${checkedCount} من ${items.length}`;

  // Sync to backend
  syncOrderPrepState(orderId, preparedMap);
}

async function syncOrderPrepState(orderId, preparedMap, newPrepStatus = null) {
  try {
    // 1. Persist locally first so reload never loses changes
    try {
      localStorage.setItem(`prep_items_${orderId}`, JSON.stringify(preparedMap));
      if (newPrepStatus) localStorage.setItem(`prep_status_${orderId}`, newPrepStatus);
    } catch(e) {}

    const payload = {
      order_id: orderId,
      prepared_items: preparedMap
    };
    if (newPrepStatus) {
      payload.prep_status = newPrepStatus;
      payload.new_status = 'جاهز للتوصيل';
    }

    const token = getAuthToken();
    const headers = {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };

    let res;
    if (window.apiClient && typeof window.apiClient.fetch === 'function') {
      res = await window.apiClient.fetch('/online-orders/update-status', {
        method: 'POST',
        headers,
        body: JSON.stringify(payload)
      });
    } else if (window.apiClient && typeof window.apiClient.fetchWithFailover === 'function') {
      res = await window.apiClient.fetchWithFailover('/online-orders/update-status', {
        method: 'POST',
        headers,
        body: JSON.stringify(payload)
      });
    } else {
      const base = (window.apiClient?.baseUrl || localStorage.getItem('posApiBase') || 'https://api.ibnalmukhtar.com').replace(/\/$/, '');
      res = await fetch(`${base}/online-orders/update-status`, {
        method: 'POST',
        headers,
        body: JSON.stringify(payload)
      });
    }
    const data = await res.json().catch(() => ({}));
    if (data.success) {
      console.log('✅ تم حفظ حالة التجهيز في الخادم بنجاح للطلب #' + orderId);
    }
  } catch(e) {
    console.warn('Sync prep failed, saved to local cache:', e);
  }
}

// Complete Packaging
async function completeOrderPackaging(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  if (!order) return;

  const items = order.items || [];
  let preparedMap = {};
  items.forEach(it => { preparedMap[it.id] = true; });

  order.prepared_items = preparedMap;
  order.prep_status = 'ready';
  order.status = 'جاهز للتوصيل';

  try {
    localStorage.setItem(`prep_items_${orderId}`, JSON.stringify(preparedMap));
    localStorage.setItem(`prep_status_${orderId}`, 'ready');
  } catch(e) {}

  playCompleteSound();

  // Re-render card
  const card = $(`order-card-${orderId}`);
  if (card) {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = renderOrderCardHtml(order);
    const newCard = tempDiv.firstElementChild;
    card.replaceWith(newCard);
  }

  updateStats();
  await syncOrderPrepState(orderId, preparedMap, 'ready');
}

function togglePrepExtraItems(orderId, remainingCount) {
  const container = document.getElementById(`extra-items-${orderId}`);
  const btn = document.getElementById(`toggle-items-btn-${orderId}`);
  if (!container || !btn) return;
  const isHidden = container.style.display === 'none';
  if (isHidden) {
    container.style.display = 'block';
    btn.innerHTML = `<span>▲ إخفاء باقي الأصناف</span>`;
    btn.classList.add('expanded');
  } else {
    container.style.display = 'none';
    btn.innerHTML = `<span>▼ إظهار باقي الأصناف (${remainingCount} أصناف إضافية)</span>`;
    btn.classList.remove('expanded');
  }
}

// طباعة كل بوالص الطلبات الحالية (المجهزة وغير المجهزة) - مقاس A4 مقسم 8 بوالص بالورقة بدون صفحات فارغة
async function printAllSlipsA4() {
  const driverId = $('driverFilter')?.value || '';
  
  // تصفية الطلبات المطبوعة حسب الفترة والمندوب والبحث إن وجد (تشمل المجهز وغير المجهز حسب طلب المستخدم)
  const ordersToPrint = allOrders.filter(order => {
    if (driverId && String(order.assigned_driver_id) !== String(driverId)) return false;
    if (['ملغي', 'تم التسليم', 'فشل التسليم', 'مرتجع كلي'].includes(order.status)) return false;
    if (currentSearchQuery) {
      const matchId = String(order.id).includes(currentSearchQuery);
      const matchCust = (order.customer_name || '').toLowerCase().includes(currentSearchQuery);
      const matchPhone = (order.customer_phone || '').includes(currentSearchQuery);
      const matchAddress = (order.customer_address || '').toLowerCase().includes(currentSearchQuery);
      if (!matchId && !matchCust && !matchPhone && !matchAddress) return false;
    }
    return true;
  });

  if (ordersToPrint.length === 0) {
    showPrepToast('لا توجد طلبات للطباعة', 'لا توجد طلبات تطابق الفلترة الحالية لطباعتها', 'modified');
    return;
  }

  // دالة توليد بطاقة البوليصة المفردة
  const renderSingleSlipHtml = (order) => {
    const itemsCount = (order.items || []).length;
    const customerName = order.customer_name || 'عميل عام';
    const customerPhone = order.customer_phone || 'لا يوجد';
    const address = order.customer_address || 'غير محدد';
    const driverName = order.driver_name || 'بدون مندوب';
    const paymentMethod = order.payment_method || 'عند الاستلام';
    const deliveryFee = Number(order.delivery_fee || 0);
    const deliveryFeeDisplay = deliveryFee > 0 ? `${deliveryFee.toLocaleString('en-US')} ريال` : 'مجاناً';
    const totalAmount = Number(order.total_amount || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const isReady = isOrderReadyPrep(order);
    const statusDisplay = isReady ? 'جاهز للتوصيل' : (order.status || 'قيد التجهيز');

    let orderTimeDisplay = '';
    if (order.order_date || order.created_at) {
      try {
        const d = new Date((order.order_date || order.created_at).replace(' ', 'T'));
        orderTimeDisplay = d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', hour12: true });
      } catch(e) {}
    }

    const storeName = currentShopName || 'لمسات منزلية ابن المختار';
    const storeLogo = currentShopLogo || 'https://pos.ibnalmukhtar.com/icon-512x512.png';

    return `
      <div class="a4-slip-card">
        ${storeLogo ? `<img src="${storeLogo}" class="slip-watermark" alt="" onerror="this.style.opacity='0'" />` : ''}
        <div class="slip-store-title">${storeName}</div>
        
        <div class="slip-header">
          <div class="slip-id">📦 طلب #${order.id}</div>
          <div class="slip-badge">${orderTimeDisplay || statusDisplay}</div>
        </div>
        
        <div class="slip-grid">
          <div class="slip-row">
            <span class="slip-lbl">👤 العميل:</span>
            <strong class="slip-val">${customerName}</strong>
          </div>
          <div class="slip-row">
            <span class="slip-lbl">📞 الهاتف:</span>
            <span class="slip-val dir-ltr" style="font-family:monospace; font-weight:700;">${customerPhone}</span>
          </div>
          <div class="slip-row-address">
            <span class="slip-lbl">📍 العنوان:</span>
            <span class="slip-address-val" title="${address}">${address}</span>
          </div>
          <div class="slip-row">
            <span class="slip-lbl">🛵 المندوب:</span>
            <strong class="slip-val" style="color:#123b72;">${driverName}</strong>
          </div>
          <div class="slip-row">
            <span class="slip-lbl">💳 طريقة الدفع:</span>
            <strong class="slip-val">${paymentMethod}</strong>
          </div>
          <div class="slip-row">
            <span class="slip-lbl">🚚 رسوم التوصيل:</span>
            <strong class="slip-val">${deliveryFeeDisplay}</strong>
          </div>
          <div class="slip-row">
            <span class="slip-lbl">💵 الإجمالي:</span>
            <strong class="slip-val" style="color:#16a34a;">${totalAmount} ريال</strong>
          </div>
        </div>

        <div class="slip-count-banner">
          <span>📦 عدد المنتجات في الطرد:</span>
          <strong>${itemsCount} أصناف</strong>
        </div>
      </div>
    `;
  };

  // تقسيم الطلبات إلى مجموعات كل مجموعة 8 بوالص بالضبط في كل ورقة A4
  const chunks = [];
  for (let i = 0; i < ordersToPrint.length; i += 8) {
    chunks.push(ordersToPrint.slice(i, i + 8));
  }

  const pagesHtml = chunks.map(chunk => `
    <div class="a4-sheet-page">
      ${chunk.map(renderSingleSlipHtml).join('')}
    </div>
  `).join('');

  const printContainer = document.createElement('div');
  printContainer.id = 'batchA4PrintSection';
  printContainer.innerHTML = pagesHtml;

  document.body.classList.add('a4-printing-mode');
  document.body.appendChild(printContainer);

  // Pre-decode and ensure all watermark images are fully loaded before opening print preview
  const imgs = Array.from(printContainer.querySelectorAll('img'));
  await Promise.all(imgs.map(img => {
    if (img.complete && img.naturalWidth > 0) return Promise.resolve();
    if (typeof img.decode === 'function') {
      return img.decode().catch(() => {});
    }
    return new Promise(resolve => {
      img.onload = resolve;
      img.onerror = resolve;
      setTimeout(resolve, 800);
    });
  }));

  // Settle time for rendering engine
  await new Promise(r => setTimeout(r, 200));

  const cleanup = () => {
    document.body.classList.remove('a4-printing-mode');
    if (printContainer.parentNode) printContainer.remove();
    window.removeEventListener('afterprint', cleanup);
  };

  window.addEventListener('afterprint', cleanup);
  window.print();
  setTimeout(cleanup, 5000);
}

// دالة بديلة للتوافق
window.printAllReadySlipsA4 = printAllSlipsA4;

// Print Slip
async function printPrepSlip(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  if (!order) return;

  const items = order.items || [];
  const storeName = currentShopName || 'لمسات منزلية ابن المختار';
  const storeLogo = currentShopLogo || 'https://pos.ibnalmukhtar.com/icon-512x512.png';

  let slipHtml = `
    <div dir="rtl" style="position:relative; font-family:'Cairo',Arial,sans-serif; padding:15px; max-width:320px; margin:auto; border:1px dashed #000; overflow:hidden;">
      ${storeLogo ? `<img src="${storeLogo}" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:140px; height:140px; object-fit:contain; opacity:0.18; pointer-events:none; z-index:0; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;" alt="" onerror="this.style.opacity='0'" />` : ''}
      <div style="position:relative; z-index:1;">
        <div style="text-align:center; border-bottom:1px dashed #000; padding-bottom:8px; margin-bottom:8px;">
          ${storeLogo ? `<img src="${storeLogo}" style="max-height:44px; max-width:130px; object-fit:contain; display:block; margin:0 auto 4px; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;" alt="" onerror="this.style.display='none'" />` : ''}
          <h3 style="margin:0; font-size:16px;">${storeName}</h3>
          <p style="margin:4px 0 0; font-size:12px; font-weight:700;">بوليصة تجهيز طلب #${order.id}</p>
        </div>
        <div style="font-size:12px; margin-bottom:8px;">
          <div><strong>العميل:</strong> ${order.customer_name || 'عميل'}</div>
          <div><strong>العنوان:</strong> ${order.customer_address || '-'}</div>
          <div><strong>الهاتف:</strong> ${order.customer_phone || '-'}</div>
          <div><strong>المندوب:</strong> ${order.driver_name || 'غير مسند'}</div>
          ${order.notes ? `<div><strong>ملاحظات:</strong> ${order.notes}</div>` : ''}
        </div>
        <table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:8px;">
          <thead>
            <tr style="border-bottom:1px solid #000;">
              <th style="text-align:right;">الصنف</th>
              <th style="text-align:center;">الكمية</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(it => `
              <tr style="border-bottom:0.5px dashed #ccc;">
                <td style="padding:4px 0;">${it.product_name || it.catalog_name}${it.variant_label ? ` (${it.variant_label})` : ''}</td>
                <td style="text-align:center; font-weight:bold;">${it.quantity}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div style="text-align:center; font-size:11px; border-top:1px dashed #000; padding-top:6px;">
          تم التجهيز والمطابقة بواسطة: ${$('currentUserLabel')?.textContent || 'الموظف'}
        </div>
      </div>
    </div>
  `;

  const printWin = window.open('', '_blank');
  if (printWin) {
    const sTag = '<' + 'script>';
    const eTag = '<' + '/script>';
    printWin.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>بوليصة #${order.id}</title><style>@page{size:80mm auto;margin:2mm;}body{margin:0;padding:4px;}img{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}</style></head><body>${slipHtml}` + sTag + `window.onload=function(){setTimeout(function(){window.print();},250);};` + eTag + `</body></html>`);
    printWin.document.close();
  }
}

  updateNotifBellIcon();

  setInterval(() => {
    if (!document.hidden && navigator.onLine) {
