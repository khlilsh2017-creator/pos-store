                        <div style="background:#f0f4ff; padding:8px 12px; border-radius:var(--radius-xs); margin:8px 0;">
                            <div style="display:flex; justify-content:space-between; font-size:0.85rem; flex-wrap:wrap; gap:6px;">
                                <span><strong>💰 إجمالي المرتجع:</strong> ${totalRefund.toFixed(2)} ريال</span>
                                <span><strong>🚚 رسوم التوصيل:</strong> ${deliveryFee.toFixed(2)} ريال ${feeDescription}</span>
                                <span><strong>💵 المسترد للعميل:</strong> ${customerRefund.toFixed(2)} ريال</span>
                            </div>
                            ${deliveryFee > 0 && deliveryFeeType === 'customer' ? `<div style="font-size:0.75rem; color:var(--danger); margin-top:4px;">⛔ سيتم خصم ${deliveryFee.toFixed(2)} ريال من مبلغ العميل</div>` : ''}
                            ${deliveryFee > 0 && deliveryFeeType === 'shop' ? `<div style="font-size:0.75rem; color:var(--success); margin-top:4px;">✅ سيتم إضافة ${deliveryFee.toFixed(2)} ريال إلى رصيد المندوب (أجرة التوصيل)</div>` : ''}
                        </div>
                        <div class="return-actions">
                            <button class="btn btn-success" onclick="confirmReturnAction(${req.return_id || req.id})">✅ تأكيد الإرجاع</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('pageTitle').textContent = '🔄 طلبات الإرجاع';
            updateSyncCounter();
        }

        // =============================================================
        // 7. تحميل البيانات الأساسي
        // =============================================================
        async function loadInitialData() {
            try {
                if (navigator.onLine && getToken()) {
                    apiCall('/auth/me').then(meData => {
                        if (meData && meData.user && meData.user.name && !isTechnicalUsername(meData.user.name)) {
                            setDriverName(meData.user.username, meData.user.name);
                            const driverNameEl = document.getElementById('driverNameDisplay');
                            if (driverNameEl) driverNameEl.textContent = meData.user.name;
                        }
                    }).catch(() => {});
                }
                if (currencies.length === 0) { const currData = await fetchCurrencies();
                    currencies = currData.currencies || []; }
                if (wallets.length === 0) { const walletData = await fetchWallets();
                    wallets = walletData.wallets || []; }
            } catch (e) { console.warn('فشل تحميل البيانات الإضافية:', e.message); }
        }

        async function loadDashboard() {
            const driverId = getDriverId();
            if (!driverId) { showLoginScreen(); return; }

            showLoading();

            if (navigator.onLine) {
                try {
                    await loadInitialData();
                    const filteredData = await fetchDriverOrders(driverId, 1, currentStatusFilter, currentPeriod, 50);
                    const newOrders = await applyPendingOperationsToOrders(filteredData.orders || []);
                    const account = filteredData.account || {};

                    // استخراج اسم الموصل الحقيقي من الطلبات
                    if (newOrders && newOrders.length > 0) {
                        const foundDriver = newOrders.find(o => o.driver_name && o.driver_name.trim());
                        if (foundDriver && foundDriver.driver_name && !isTechnicalUsername(foundDriver.driver_name)) {
                            setDriverName(getDriverName(), foundDriver.driver_name.trim());
                        }
                    }

                    // تحديث IndexedDB باستخدام معاملة واحدة آمنة
                    await bulkPutOrders(newOrders, driverId);

                    currentOrders = newOrders;
                    totalBalance = account.balance ?? 0;
                    localStorage.setItem('driverBalance', totalBalance.toString());
                    lastAccountData = account;
                    if (account && Object.keys(account).length > 0) {
                        localStorage.setItem('lastAccountData', JSON.stringify(account));
                    }

                    const filteredFinal = filterOrdersByPeriod(currentOrders, currentPeriod)
                        .filter(o => currentStatusFilter ? o.status === currentStatusFilter : true);
                    renderDashboard(account, totalBalance, filteredFinal, filteredFinal.length);
                    await loadPeriodSummary(driverId, currentPeriod);
                    hideOfflineNotice();
                } catch (err) {
                    console.warn('فشل جلب البيانات، نعرض المخزون المحلي', err);
                    useLocalOrdersForDashboard();
                }
            } else {
                useLocalOrdersForDashboard();
            }

            const name = getDriverName();
            const driverNameEl = document.getElementById('driverNameDisplay');
            if (name && driverNameEl) driverNameEl.textContent = name;
            await updateSyncCounter();
        }

        function useLocalOrdersForDashboard() {
            const driverId = getDriverId();
            if (!driverId) return;
            getAll(STORES.ORDERS).then(localOrders => {
                const driverOrders = localOrders.filter(o => o.driver_id == driverId);
                if (driverOrders.length === 0) {
                    // لا توجد بيانات محلية، اعرض رسالة واضحة
                    document.getElementById('mainContent').innerHTML = `
                        <div id="syncStatus" class="sync-status hidden">
                            <span>🔄 جاري المزامنة...</span>
                            <span class="sync-count" id="syncCount">0</span>
                            <span>عملية معلقة</span>
                        </div>
                        <div class="empty-state">
                            <span class="empty-icon">📴</span>
                            <span>لا توجد طلبات مخزنة محلياً. يرجى الاتصال بالإنترنت لتحميل الطلبات.</span>
                            <br><br>
                            <button class="btn btn-primary" onclick="loadDashboard()">🔄 إعادة المحاولة</button>
                        </div>
                    `;
                    document.getElementById('pageTitle').textContent = '📦 طلباتي';
                    updateSyncCounter();
                    return;
                }
                currentOrders = driverOrders;
                const savedBalance = parseFloat(localStorage.getItem('driverBalance')) || 0;
                totalBalance = savedBalance;
                const cachedAccount = (lastAccountData && Object.keys(lastAccountData).length > 0)
                    ? lastAccountData
                    : JSON.parse(localStorage.getItem('lastAccountData') || '{}');
                const filteredFinal = filterOrdersByPeriod(currentOrders, currentPeriod)
                    .filter(o => currentStatusFilter ? o.status === currentStatusFilter : true);
                renderDashboard(cachedAccount, savedBalance, filteredFinal, filteredFinal.length);
                showOfflineNotice();
            });
        }
        async function loadPeriodSummary(driverId, period) {
            try {
                const data = await fetchDriverSummary(driverId, period === 'all' ? 'week' : period);
                const summaryValue = document.getElementById('periodSummaryValue');
                const ordersCount = document.getElementById('periodOrdersCount');
                if (summaryValue) summaryValue.textContent = data.total_fees.toFixed(2) + ' ريال';
                if (ordersCount) ordersCount.textContent = `(${data.orders_count || 0} طلب)`;
            } catch (e) {
                // تجاهل
            }
        }

        async function loadReturnRequests() {
            const driverId = getDriverId();
            if (!driverId) { showLoginScreen(); return; }
            if (!navigator.onLine) {
                document.getElementById('mainContent').innerHTML = `
                    <div id="syncStatus" class="sync-status hidden">
                        <span class="sync-spinner"></span><span id="syncStatusText">جاري المزامنة...</span>
                        <span class="sync-count" id="syncCount">0</span>
                        <span>عملية معلقة</span>
                    </div>
                    <div class="empty-state"><span class="empty-icon">📴</span><span>غير متصل بالإنترنت، لا يمكن تحميل طلبات الإرجاع</span></div>`;
                updateSyncCounter();
                return;
            }
            document.getElementById('mainContent').innerHTML = `
                <div id="syncStatus" class="sync-status hidden">
                    <span>🔄 جاري المزامنة...</span>
                    <span class="sync-count" id="syncCount">0</span>
                    <span>عملية معلقة</span>
                </div>
                <div class="loading-state">⏳ جاري تحميل طلبات الإرجاع...</div>`;
            updateSyncCounter();
            try {
                const data = await fetchReturnRequests(driverId);
                const requests = data.return_requests || [];
                returnRequests = requests;
                renderReturnRequests(requests);
            } catch (err) {
                document.getElementById('mainContent').innerHTML = `
                    <div id="syncStatus" class="sync-status hidden">
                        <span class="sync-spinner"></span><span id="syncStatusText">جاري المزامنة...</span>
                        <span class="sync-count" id="syncCount">0</span>
                        <span>عملية معلقة</span>
                    </div>
                    <div class="empty-state"><span class="empty-icon">⚠️</span><span>فشل تحميل طلبات الإرجاع: ${err.message}</span>
                    <button class="btn btn-primary" style="margin-top:12px;" onclick="loadReturnRequests()">إعادة المحاولة</button></div>`;
                updateSyncCounter();
            }
        }

        async function confirmReturnAction(returnId) {
            if (!confirm('هل أنت متأكد من تأكيد هذا الإرجاع؟ سيتم تنفيذ الإرجاع وتحديث المخزون والمحاسبة.')) return;
            if (!navigator.onLine) {
                showToast('❌ لا يمكن التأكيد دون اتصال بالإنترنت');
                return;
            }
            try {
                const result = await confirmReturn(returnId);
                if (result.success) {
                    showToast('✅ تم تأكيد الإرجاع بنجاح');
                    returnRequests = returnRequests.filter(r => (r.return_id || r.id) !== returnId);
                    renderReturnRequests(returnRequests);
                    refreshOrders();
                } else {
                    showToast('❌ فشل تأكيد الإرجاع: ' + (result.error || 'خطأ غير معروف'));
                }
            } catch (err) {
                showToast('❌ فشل تأكيد الإرجاع: ' + err.message);
            }
        }

        // =============================================================
        // 8. الفلاتر والتنقل
        // =============================================================
        function applyFilters() {
            currentStatusFilter = document.getElementById('statusFilter').value;
            currentPeriod = document.getElementById('periodFilter').value;
            saveFilterSettings();
            refreshOrders();
        }

        function resetFilters() {
            document.getElementById('statusFilter').value = '';
            document.getElementById('periodFilter').value = 'all';
            applyFilters();
        }

        function updateNavSelection(page) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
                if (item.getAttribute('data-page') === page) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function navigateTo(page, element) {
            currentView = page;
            localStorage.setItem('driverActiveView', page);
            if (element) {
                document.querySelectorAll('.bottom-nav .nav-item').forEach(item => item.classList.remove('active'));
                element.classList.add('active');
            } else {
                updateNavSelection(page);
            }
            switch (page) {
                case 'orders':
                    document.getElementById('pageTitle').textContent = '📦 طلباتي';
                    if (document.getElementById('ordersList')) {
                        applyFiltersAndRender();
                        if (navigator.onLine) refreshOrders().catch(console.warn);
                    } else {
                        if (currentOrders && currentOrders.length > 0) {
                            const savedBalance = parseFloat(localStorage.getItem('driverBalance')) || totalBalance;
                            const cachedAccount = (lastAccountData && Object.keys(lastAccountData).length > 0)
                                ? lastAccountData
                                : JSON.parse(localStorage.getItem('lastAccountData') || '{}');
                            const filteredFinal = filterOrdersByPeriod(currentOrders, currentPeriod)
                                .filter(o => currentStatusFilter ? o.status === currentStatusFilter : true);
                            renderDashboard(cachedAccount, savedBalance, filteredFinal, filteredFinal.length);
                            if (navigator.onLine) refreshOrders().catch(console.warn);
                        } else {
                            loadDashboard();
                        }
                    }
                    break;
                case 'returns':
                    loadReturnRequests();
                    break;
                case 'search':
                    showSearchPage();
                    break;
                case 'stats':
                    showStatsPage();
                    break;
                case 'profile':
                    showProfilePage();
                    break;
            }
        }

        function showSearchPage() {
            document.getElementById('pageTitle').textContent = '🔍 بحث';
            document.getElementById('mainContent').innerHTML = `
                <div id="syncStatus" class="sync-status hidden">
                    <span>🔄 جاري المزامنة...</span>
                    <span class="sync-count" id="syncCount">0</span>
                    <span>عملية معلقة</span>
                </div>
                <div class="filter-section">
                    <input type="text" id="globalSearch" placeholder="ابحث برقم الطلب أو اسم العميل..." style="width:100%; padding:12px; border:2px solid var(--border); border-radius:var(--radius-sm); font-size:0.9rem;" oninput="debouncedGlobalSearch()">
                </div>
                <div id="searchResults"><div class="empty-state"><span class="empty-icon">🔍</span><span>اكتب للبحث...</span></div></div>`;
            updateSyncCounter();
        }

        let searchDebounceTimeout = null;
        function debouncedGlobalSearch() {
            clearTimeout(searchDebounceTimeout);
            searchDebounceTimeout = setTimeout(performGlobalSearch, 250);
        }

        function performGlobalSearch() {
            const query = document.getElementById('globalSearch')?.value?.trim().toLowerCase() || '';
            const container = document.getElementById('searchResults');
            if (!container) return;
            if (query === '') { container.innerHTML =
                '<div class="empty-state"><span class="empty-icon">🔍</span><span>اكتب للبحث...</span></div>'; return; }
            const filtered = currentOrders.filter(o =>
                o.id.toString().includes(query) ||
                (o.customer_name || '').toLowerCase().includes(query) ||
                (o.customer_phone || '').includes(query)
            );
            if (filtered.length === 0) { container.innerHTML =
                `<div class="empty-state"><span class="empty-icon">📭</span><span>لا توجد نتائج لـ "${query}"</span></div>`; return; }
            const tempDiv = document.createElement('div');
            tempDiv.id = 'ordersList';
            container.innerHTML = '';
            container.appendChild(tempDiv);
            const orig = currentOrders;
            currentOrders = filtered;
            renderOrders(filtered);
            currentOrders = orig;
        }

        // =============================================================
        // 9. صفحة الإحصائيات
        // =============================================================
        function showStatsPage() {
            document.getElementById('pageTitle').textContent = '📊 إحصائيات';

            const now = new Date();
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - now.getDay());
            startOfWeek.setHours(0, 0, 0, 0);
            const startOfLastWeek = new Date(startOfWeek);
            startOfLastWeek.setDate(startOfLastWeek.getDate() - 7);
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const startOfLastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const endOfLastMonth = new Date(now.getFullYear(), now.getMonth(), 0);

            function isInPeriod(dateStr, start, end) {
                if (!dateStr) return false;
                const d = new Date(dateStr);
                return d >= start && d <= end;
            }

            let ordersThisWeek = 0,
                feesThisWeek = 0;
            let ordersLastWeek = 0,
                feesLastWeek = 0;
            let ordersThisMonth = 0,
                feesThisMonth = 0;
            let ordersLastMonth = 0,
                feesLastMonth = 0;

            currentOrders.forEach(order => {
                const created = order.created_at || order.createdAt;
                const fee = parseFloat(order.delivery_fee) || 0;
                const count = 1;
                if (isInPeriod(created, startOfWeek, now)) {
                    ordersThisWeek += count;
                    feesThisWeek += fee;
                }
                if (isInPeriod(created, startOfLastWeek, startOfWeek)) {
                    ordersLastWeek += count;
                    feesLastWeek += fee;
                }
                if (isInPeriod(created, startOfMonth, now)) {
                    ordersThisMonth += count;
                    feesThisMonth += fee;
                }
                if (isInPeriod(created, startOfLastMonth, endOfLastMonth)) {
                    ordersLastMonth += count;
                    feesLastMonth += fee;
                }
            });

            const weekChangeOrders = ordersLastWeek === 0 ? 0 : ((ordersThisWeek - ordersLastWeek) / ordersLastWeek * 100);
            const weekChangeFees = feesLastWeek === 0 ? 0 : ((feesThisWeek - feesLastWeek) / feesLastWeek * 100);
            const monthChangeOrders = ordersLastMonth === 0 ? 0 : ((ordersThisMonth - ordersLastMonth) / ordersLastMonth * 100);
            const monthChangeFees = feesLastMonth === 0 ? 0 : ((feesThisMonth - feesLastMonth) / feesLastMonth * 100);

            const html = `
                <div id="syncStatus" class="sync-status hidden">
                    <span>🔄 جاري المزامنة...</span>
                    <span class="sync-count" id="syncCount">0</span>
                    <span>عملية معلقة</span>
                </div>
                <div style="margin-bottom:16px;">
                    <div class="balance-card" style="background:linear-gradient(135deg,#1a1f2e,#0f1419);">
                        <div style="display:flex; justify-content:space-between; align-items:center; color:white;">
                            <span>💰 الرصيد الكلي</span>
                            <span style="font-size:1.8rem; font-weight:800;">${totalBalance.toFixed(2)} ريال</span>
                        </div>
                    </div>
                </div>
                <h4 style="color:var(--text-primary); margin-bottom:10px;">📈 مقارنة الأسبوع الحالي مع السابق</h4>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-icon">📦</span>
                        <div class="stat-label">الطلبات</div>
                        <div class="stat-value">${ordersThisWeek}</div>
                        <span class="period-badge">الأسبوع الماضي: ${ordersLastWeek}</span>
                        <span style="font-size:0.75rem; font-weight:600; color:${weekChangeOrders >= 0 ? 'var(--success)' : 'var(--danger)'}">${weekChangeOrders >= 0 ? '▲' : '▼'} ${Math.abs(weekChangeOrders).toFixed(1)}%</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">💵</span>
                        <div class="stat-label">رسوم التوصيل</div>
                        <div class="stat-value positive">${feesThisWeek.toFixed(2)}</div>
                        <span class="period-badge">الأسبوع الماضي: ${feesLastWeek.toFixed(2)}</span>
                        <span style="font-size:0.75rem; font-weight:600; color:${weekChangeFees >= 0 ? 'var(--success)' : 'var(--danger)'}">${weekChangeFees >= 0 ? '▲' : '▼'} ${Math.abs(weekChangeFees).toFixed(1)}%</span>
                    </div>
                </div>
                <h4 style="color:var(--text-primary); margin:20px 0 10px;">📊 مقارنة الشهر الحالي مع السابق</h4>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-icon">📦</span>
                        <div class="stat-label">الطلبات</div>
                        <div class="stat-value">${ordersThisMonth}</div>
                        <span class="period-badge">الشهر الماضي: ${ordersLastMonth}</span>
                        <span style="font-size:0.75rem; font-weight:600; color:${monthChangeOrders >= 0 ? 'var(--success)' : 'var(--danger)'}">${monthChangeOrders >= 0 ? '▲' : '▼'} ${Math.abs(monthChangeOrders).toFixed(1)}%</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">💵</span>
                        <div class="stat-label">رسوم التوصيل</div>
                        <div class="stat-value positive">${feesThisMonth.toFixed(2)}</div>
                        <span class="period-badge">الشهر الماضي: ${feesLastMonth.toFixed(2)}</span>
                        <span style="font-size:0.75rem; font-weight:600; color:${monthChangeFees >= 0 ? 'var(--success)' : 'var(--danger)'}">${monthChangeFees >= 0 ? '▲' : '▼'} ${Math.abs(monthChangeFees).toFixed(1)}%</span>
                    </div>
                </div>
                <div style="background:var(--surface); border-radius:var(--radius); padding:16px; border:1px solid var(--border); margin-top:12px;">
                    <p style="font-size:0.8rem; color:var(--text-secondary);">📌 الإحصائيات مبنية على الطلبات المخزنة محلياً (آخر تحديث: ${new Date().toLocaleString('ar-EG')})</p>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            updateSyncCounter();
        }

        // =============================================================
        // 10. صفحة حسابي
        // =============================================================
        function showProfilePage() {

            const returned = currentOrders.filter(o => o.status === 'مرتجع جزئي' || o.status === 'مرتجع كلي').length;
            const totalFees = currentOrders.reduce((sum, o) => sum + (parseFloat(o.delivery_fee) || 0), 0);

            const lastSettlement = lastAccountData?.last_settlement_date ? new Date(lastAccountData.last_settlement_date).toLocaleDateString('ar-EG') : '--';

            const html = `
                <div id="syncStatus" class="sync-status hidden">

                    <span>عملية معلقة</span>

        function toggleModalPaymentSection() {

            const dueEl = document.getElementById('modalTotalDue');
            const infoEl = document.getElementById('modalPaymentInfo');
            const groupEl = document.getElementById('modalPaymentGroup');

            if (status === 'تم التوصيل') {

                    if (groupEl) groupEl.style.display = 'block';
                    if (dueEl) dueEl.style.display = 'flex';

                    toggleModalPaymentFields();
                    updateModalAmounts(due);

                    if (groupEl) groupEl.style.display = 'none';
                    if (dueEl) dueEl.style.display = 'none';
                    if (infoEl) infoEl.style.display = 'block';
                }
            } else {
                if (groupEl) groupEl.style.display = 'none';
                if (dueEl) dueEl.style.display = 'none';
                if (infoEl) infoEl.style.display = 'none';
            }
        }

        function toggleModalPaymentFields() {
            const method = document.getElementById('modalPaymentMethod')?.value || 'نقدي';
            const cashField = document.getElementById('modalCashField');
            const walletField = document.getElementById('modalWalletField');
            const walletSelect = document.getElementById('modalWalletSelectGroup');
            if (method === 'نقدي') { if (cashField) cashField.style.display = 'block'; if (walletField) walletField.style
                    .display = 'none'; if (walletSelect) walletSelect.style.display = 'none'; } else if (method === 'محفظة') {
                if (cashField) cashField.style.display = 'none'; if (walletField) walletField.style.display = 'block'; if (
                    walletSelect) walletSelect.style.display = 'block'; } else { if (cashField) cashField.style.display =
                    'block'; if (walletField) walletField.style.display = 'block'; if (walletSelect) walletSelect.style
                    .display = 'block'; }
            updateModalAmounts();
        }

        let activeModalOrderId = null;

        function updateModalAmounts(dueParam) {
            const dueEl = document.getElementById('modalTotalDue');
            let due = dueParam;
            if (due === undefined || due === null) {
                due = dueEl && dueEl.dataset.due !== undefined ? parseFloat(dueEl.dataset.due) : 0;
                if ((!due || isNaN(due)) && dueEl) {
                    const dueMatch = dueEl.innerText.match(/[\d.]+/);
                    if (dueMatch) due = parseFloat(dueMatch[0]) || 0;
                }
            }
            if (!due || isNaN(due) || due <= 0) return;

            const method = document.getElementById('modalPaymentMethod')?.value || 'نقدي';
            const cashInput = document.getElementById('modalCashCollected');
            const walletInput = document.getElementById('modalWalletCollected');
            if (!cashInput || !walletInput) return;

            if (method === 'نقدي') {
                cashInput.value = due.toFixed(2);
                walletInput.value = '0';
            } else if (method === 'محفظة') {
                cashInput.value = '0';
                walletInput.value = due.toFixed(2);
            } else if (method === 'مختلط') {
                cashInput.value = due.toFixed(2);
                walletInput.value = '0';

                const walletField = document.getElementById('modalWalletField');
                if (walletField) {
                    const hint = walletField.querySelector('.currency-hint');
                    if (hint) hint.innerHTML = '💳 المبلغ المدفوع عبر المحفظة مسبقاً (0)';
                }
            }
        }

        // =============================================================
        // 12. تحديث التسليم (مع التحديث الفوري ودعم عدم الاتصال)
        // =============================================================
        async function submitDeliveryUpdate(orderId) {
            if (isUpdatingDeliveryStatus) return;
            isUpdatingDeliveryStatus = true;
            if (isSubmitting) {
                showToast('⚠️ جاري معالجة طلب سابق، انتظر قليلاً');
                isUpdatingDeliveryStatus = false;
                return;
            }
            isSubmitting = true;
            setOrderButtonsDisabled(orderId, true);

            try {
                const status = document.getElementById('modalStatus')?.value || 'تم التوصيل';
                const notes = document.getElementById('modalNotes')?.value?.trim() || '';
                const order = currentOrders.find(o => String(o.id) === String(orderId));
                if (!order) {
                    showToast('الطلب غير موجود');
                    return;
                }

                const finalStatuses = ['تم التسليم', 'فشل التسليم', 'مرتجع جزئي', 'مرتجع كلي', 'ملغي'];
                const originalOrder = typeof structuredClone === 'function' ? structuredClone(order) : JSON.parse(JSON.stringify(order));
                if (finalStatuses.includes(order.status)) {
                    showToast('❌ هذا الطلب قد انتهى، لا يمكن تعديله');
                    return;
                }

                const due = getOrderDueAmount(order);

                let paymentData = null;
                if (status === 'تم التوصيل') {
                    const curList = (currencies && currencies.length > 0)
                        ? currencies
                        : [{ id: 1, code: 'YER', name: 'ريال يمني', is_base: 1, rate_to_base: 1 }];
                    const baseCurrency = curList.find(c => c.is_base) || curList[0];
                    const baseCurrencyId = baseCurrency ? baseCurrency.id : 1;

                    if (due > 0) {
                        const method = document.getElementById('modalPaymentMethod')?.value || 'نقدي';
                        let cashCollected = parseFloat(document.getElementById('modalCashCollected')?.value) || 0;
                        let walletCollected = parseFloat(document.getElementById('modalWalletCollected')?.value) || 0;
                        const walletSelect = document.getElementById('modalWalletSelect');
                        const cashCurrencyId = document.getElementById('modalCashCurrency')?.value;
                        const walletCurrencyId = document.getElementById('modalWalletCurrency')?.value;

                        // التحقق من تطابق المبلغ المحصل مع due (مع مراعاة العملات)
                        const cashCurrency = curList.find(c => String(c.id) === String(cashCurrencyId)) || baseCurrency;
                        const walletCurrency = curList.find(c => String(c.id) === String(walletCurrencyId)) || baseCurrency;
                        const cashRate = cashCurrency ? (parseFloat(cashCurrency.rate_to_base) || 1) : 1;
                        const walletRate = walletCurrency ? (parseFloat(walletCurrency.rate_to_base) || 1) : 1;
                        const baseRate = baseCurrency ? (parseFloat(baseCurrency.rate_to_base) || 1) : 1;

                        const cashBase = cashCollected * cashRate;
                        const walletBase = walletCollected * walletRate;
                        const totalBaseCollected = cashBase + walletBase;
                        const dueBase = due * baseRate;

                        if (Math.abs(totalBaseCollected - dueBase) > 0.01) {
                            if (totalBaseCollected === 0) {
                                showToast('⚠️ يجب إدخال مبلغ');
                                return;
                            }
                            const ratio = dueBase / totalBaseCollected;
                            cashCollected = cashCollected * ratio;
                            walletCollected = walletCollected * ratio;
                            showToast('⚠️ تم تعديل المبالغ تلقائياً');
                        }

                        if ((method === 'محفظة' || method === 'مختلط') && walletCollected > 0 && !walletSelect?.value) {
                            const errEl = document.getElementById('modalPaymentError');
                            if (errEl) errEl.textContent = 'يجب اختيار المحفظة';
                            return;
                        }

                        paymentData = {
                            payment_method: method,
                            cash_collected: cashCollected,
                            wallet_collected: walletCollected,
                            wallet_id: walletSelect?.value ? parseInt(walletSelect.value) : null,
                            cash_currency_id: cashCurrencyId ? parseInt(cashCurrencyId) : baseCurrencyId,
                            wallet_currency_id: walletCurrencyId ? parseInt(walletCurrencyId) : baseCurrencyId
                        };
                    } else {
                        paymentData = {
                            payment_method: order.payment_method || 'نقدي',
                            cash_collected: 0,
                            wallet_collected: 0,
                            wallet_id: null,
                            cash_currency_id: baseCurrencyId,
                            wallet_currency_id: baseCurrencyId
                        };
                        const cashInput = document.getElementById('modalCashCollected');
                        const walletInput = document.getElementById('modalWalletCollected');
                        if (cashInput) cashInput.value = 0;
                        if (walletInput) walletInput.value = 0;
                    }
                }

                let newStatus = status;
                if (status === 'فشل') newStatus = 'فشل التسليم';
                else if (status === 'تم التوصيل') newStatus = 'تم التسليم';

                // 1. تحديث محلي فوري
                const updatedOrder = { ...order, status: newStatus, notes };
                if (paymentData) {
                    updatedOrder.payment_method = paymentData.payment_method;
                    updatedOrder.cash_collected = paymentData.cash_collected;
                    updatedOrder.wallet_collected = paymentData.wallet_collected;
                }
                const index = currentOrders.findIndex(o => String(o.id) === String(orderId));
                if (index !== -1) {
                    currentOrders[index] = updatedOrder;
                } else {
                    currentOrders.push(updatedOrder);
                }
                await updateOrderLocally(updatedOrder);

                // إغلاق المودال وعرض التحديث فوراً مع الحفاظ على الفلاتر
                closeModalSheet();
                applyFiltersAndRender();

                // 2. المزامنة مع الخادم
                const operationId = generateOperationId();
                const operationData = {
                    operation_id: operationId,
                    order_id: orderId,
                    delivery_status: status,
                    ...(paymentData || {}),
                    notes: notes || ''
                };

                if (navigator.onLine) {
                    try {
                        const response = await apiCall('/driver/update-delivery', 'POST', operationData);

                        if (response.order) {
                            const serverOrder = response.order;
                            const idx = currentOrders.findIndex(o => String(o.id) === String(orderId));
                            const confirmedOrder = { ...serverOrder, _pendingSync: false };
                            if (idx !== -1) currentOrders[idx] = confirmedOrder;
                            else currentOrders.push(confirmedOrder);
                            await updateOrderLocally(confirmedOrder);
                        }

                        const serverBalance = response.account?.balance !== undefined ? response.account.balance : response.balance;
                        if (serverBalance !== undefined) {
                            totalBalance = serverBalance;
                            localStorage.setItem('driverBalance', totalBalance.toString());
                            updateBalanceDisplay();
                        } else if (status === 'تم التوصيل' && paymentData && paymentData.cash_collected > 0) {
                            totalBalance += paymentData.cash_collected;
                            localStorage.setItem('driverBalance', totalBalance.toString());
                            updateBalanceDisplay();
                        }

                        if (response.account) {
                            lastAccountData = { ...lastAccountData, ...response.account };
                            localStorage.setItem('lastAccountData', JSON.stringify(lastAccountData));
                        }

                        applyFiltersAndRender();
                        showToast(`✅ تم تسجيل التحديث بنجاح للطلب #${orderId}`);
                        refreshOrders().catch(console.warn);
                    } catch (err) {
                        const errMsg = (err.message || '').toLowerCase();
                        const isClientError = errMsg.includes('400') || errMsg.includes('403') || errMsg.includes('422');
                        if (isClientError) {
                            await rollbackLocalOrderUpdate(orderId, originalOrder);
                            let errorText = err.message || '';
                            try {
                                const errorObj = JSON.parse(err.message);
                                if (errorObj && errorObj.error) errorText = errorObj.error;
                            } catch (e) {}
                            showToast('❌ تعذر إتمام التحديث: ' + (errorText || err.message));
                        } else {
                            await addOperation({
                                store: STORES.ORDERS,
                                type: 'update',
                                operation_id: operationId,
                                data: operationData
                            });
                            updatedOrder._pendingSync = true;
                            markOrderAsPending(orderId);
                            await updateSyncCounter();
                            registerBackgroundSync();
                            if (status === 'تم التوصيل' && paymentData && paymentData.cash_collected > 0) {
                                totalBalance += paymentData.cash_collected;
                                localStorage.setItem('driverBalance', totalBalance.toString());
                                updateBalanceDisplay();
                            }
                            showToast('📴 تم حفظ التحديث محلياً، ستتم المزامنة تلقائياً عند عودة الاتصال');
                        }
                    }
                } else {
                    await addOperation({
                        store: STORES.ORDERS,
                        type: 'update',
                        operation_id: operationId,
                        data: operationData
                    });
                    updatedOrder._pendingSync = true;
                    markOrderAsPending(orderId);
                    await updateSyncCounter();
                    registerBackgroundSync();
                    if (status === 'تم التوصيل' && paymentData && paymentData.cash_collected > 0) {
                        totalBalance += paymentData.cash_collected;
                        localStorage.setItem('driverBalance', totalBalance.toString());
                        updateBalanceDisplay();
                    }
                    showToast('📴 تم حفظ التحديث دون اتصال، ستتم المزامنة تلقائياً عند عودة الإنترنت');
                }
            } catch (err) {
                console.error('خطأ غير متوقع في submitDeliveryUpdate:', err);
                showToast('❌ حدث خطأ أثناء التحديث');
            } finally {
                setOrderButtonsDisabled(orderId, false);
                isSubmitting = false;
                isUpdatingDeliveryStatus = false;
            }
        }

        function closeModalSheet(updateHistory = true) {
            document.getElementById('modalSheet')?.classList.remove('active');
            document.getElementById('modalOverlay')?.classList.remove('active');
            if (activeModalOrderId) {
                setOrderButtonsDisabled(activeModalOrderId, false);
                activeModalOrderId = null;
            }
            isSubmitting = false;
            if (updateHistory && history.state && history.state.modal === 'delivery') {
                setIgnoreNextPopState();
                try { history.back(); } catch (e) { ignoreNextPopState = false; }
            }
        }

            document.getElementById('mainContent').innerHTML = `

                        <label style="font-weight:600;">👤 اسم المستخدم</label>
                        <input id="loginUsername" placeholder="اسم المستخدم" style="width:100%; padding:14px; border:2px solid var(--border); border-radius:var(--radius-sm); margin:8px 0; background:var(--surface-secondary);">
                        <label style="font-weight:600;">🔒 كلمة المرور</label>
                        <input id="loginPassword" type="password" placeholder="كلمة المرور" style="width:100%; padding:14px; border:2px solid var(--border); border-radius:var(--radius-sm); margin:8px 0; background:var(--surface-secondary);">

                        <div id="loginError" style="color:var(--danger); font-size:0.8rem; margin:8px 0; display:none;"></div>

                    </div>
                </div>`;
            updateSyncCounter();

            window.driverLoginHelper = window.LoginHelper?.init({
                pageType: 'driver',
                usernameInputId: 'loginUsername',
                passwordInputId: 'loginPassword',
                savedAccountsContainerId: 'driverSavedAccountsBox',
                rememberContainerId: 'driverRememberMeBox'
            });
        }

        async function handleLogin() {
            if (isDriverLoggingIn) return;
            isDriverLoggingIn = true;
            try {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                const errorDiv = document.getElementById('loginError');
                if (!username || !password) {
                    errorDiv.textContent = 'يرجى إدخال البيانات';
                    errorDiv.style.display = 'block';
                    return;
                }
                errorDiv.style.display = 'none';
                try {
                    const data = await login(username, password);
                    if (data.token && data.user) {
                        setToken(data.token);
                        setDriverId(data.user.id);
                        const driverRealName = data.user.name || data.user.driver_name || data.user.full_name;
                        setDriverName(data.user.username, driverRealName);

                        if (window.driverLoginHelper?.isRememberChecked()) {
                            window.LoginHelper?.saveAccount({
                                username,
                                password,
                                name: driverRealName || username,
                                role: 'مندوب توصيل'
                            }, 'driver');
                            window.driverLoginHelper?.renderSavedAccounts();
                        }

                        loadFilterSettings();
                        await loadDashboard();
                        if (navigator.onLine) await syncAllOperations();

                        const pushEnabled = localStorage.getItem('pushEnabled') === 'true';
                        if ('Notification' in window && Notification.permission === 'granted') {
                            if (pushEnabled) {
                                await registerForPushNotifications();
                            } else {
                                updateNotificationUI(false);
                            }
                        } else {
                            updateNotificationUI(false);
                            await registerForPushNotifications();
                        }

                        showToast('✅ تم الدخول بنجاح');
                        sessionStorage.removeItem('driverWelcomeShown');
                        checkAndShowWelcomePrompt();
                    } else {
                        errorDiv.textContent = 'بيانات غير صالحة';
                        errorDiv.style.display = 'block';
                    }
                } catch (err) {
                    errorDiv.textContent = err.message;
                    errorDiv.style.display = 'block';
                }
            } finally {
                isDriverLoggingIn = false;
            }
        }

        async function logout() {
            clearAllPreparedItems();
            clearToken();
            clearDriverId();
            clearDriverName();
            currentOrders = [];
            returnRequests = [];
            totalBalance = 0;
            localStorage.removeItem('driverBalance');
            localStorage.removeItem('lastAccountData');
            sessionStorage.removeItem('driverWelcomeShown');
            // مسح سجل الأصناف المُجهزة لهذا المندوب
            clearAllPreparedItems();

            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction([STORES.ORDERS, STORES.OPERATIONS], 'readwrite');
                    tx.objectStore(STORES.ORDERS).clear();
                    tx.objectStore(STORES.OPERATIONS).clear();
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error);
                });
            } catch (err) {
                console.warn('فشل مسح IndexedDB أثناء تسجيل الخروج:', err);
            }

            showLoginScreen();
            showToast('👋 تم تسجيل الخروج');
        }

        function updateConnectionStatus() {

        async function syncAllOperations() {
            if (isSyncing) return;
            isSyncing = true;

            const token = getToken();
            if (!token) {
                isSyncing = false;
                return;
            }

            const operations = await getPendingOperations();
            if (operations.length === 0) {
                await updateSyncCounter();
                isSyncing = false;
                return;
            }

            const statusEl = document.getElementById('syncStatus');
            if (statusEl) {
                statusEl.classList.remove('hidden');
                document.getElementById('syncCount').textContent = operations.length;
            }

            let syncedCount = 0;
            let failedCount = 0;
            let cancelledCount = 0;
            const MAX_ATTEMPTS = 3;

            for (const op of operations) {
                const { store, type, data } = op;
                const opKey = op.id !== undefined ? op.id : op.operation_id;
                if (store === STORES.ORDERS && type === 'update') {
                    // منع المحاولات المتتالية السريعة لنفس العملية في حال ضعف الإنترنت (فاصل زمني 15 ثانية)
                    const nowMs = Date.now();
                    if (op.last_attempt_at && (nowMs - op.last_attempt_at) < 15000) {
                        continue;
                    }
                    op.attempts = (op.attempts || 0) + 1;
                    op.last_attempt_at = nowMs;
                    const opId = String(data?.operation_id || op.operation_id || opKey);
                    try {
                        const response = await fetch(`${API_BASE}/driver/update-delivery`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json',
                                'X-Offline-Operation-Id': opId
                            },
                            body: JSON.stringify({ ...data, operation_id: opId })
                        });

                        if (response.ok) {
                            await deleteOperation(opKey);
                            syncedCount++;
                            const result = await response.json().catch(() => ({}));
                            if (result.order) await updateOrderLocally(result.order);
                        } else if (response.status >= 400 && response.status < 500 && response.status !== 408) {
                            await deleteOperation(opKey);
                            failedCount++;
                            console.warn(`العملية ${opKey} رُفضت من الخادم برمز ${response.status} وتم حذفها لمنع التكرار.`);
                        } else {
                            if (op.attempts >= MAX_ATTEMPTS) {
                                await deleteOperation(opKey);
                                cancelledCount++;
                                console.warn(`تم إلغاء العملية ${opKey} بعد فشل ${MAX_ATTEMPTS} محاولات.`);
                            } else {
                                await put(STORES.OPERATIONS, op);
                                failedCount++;
                            }
                        }
                    } catch (err) {
                        console.error(`انقطاع اتصال للعملية ${opKey}:`, err);
                        if (op.attempts >= MAX_ATTEMPTS) {
                            await deleteOperation(opKey);
                            cancelledCount++;
                        } else {
                            await put(STORES.OPERATIONS, op);
                            failedCount++;
                        }
                    }
                }

                const remaining = operations.length - syncedCount - failedCount - cancelledCount;
                const syncCountEl = document.getElementById('syncCount');
                if (syncCountEl) {
                    syncCountEl.textContent = Math.max(0, remaining);
                }
            }

            await updateSyncCounter();

            if (syncedCount > 0) {
                await refreshOrders();
                showToast(`✅ تمت مزامنة ${syncedCount} عملية`);
            } else {
                applyFiltersAndRender();
            }

            if (cancelledCount > 0) {
                showToast(`⚠️ تم إلغاء ${cancelledCount} عملية بعد تجاوز الحد الأقصى للمحاولات`);
            }

            isSyncing = false;
        }

        // 15. تهيئة وبدء التطبيق الفوري (Instant Bootstrap & Offline-First)
        // =============================================================
        async function instantRenderFromCache() {
            const driverId = getDriverId();
            if (!driverId) return false;
            try {
                const localOrders = await getAll(STORES.ORDERS);
                const driverOrders = (localOrders || []).filter(o => o.driver_id == driverId);
                if (driverOrders && driverOrders.length > 0) {
                    currentOrders = driverOrders;
                    const savedBalance = parseFloat(localStorage.getItem('driverBalance')) || totalBalance || 0;
                    totalBalance = savedBalance;
                    const cachedAccount = (lastAccountData && Object.keys(lastAccountData).length > 0)
                        ? lastAccountData
                        : JSON.parse(localStorage.getItem('lastAccountData') || '{}');
                    const filteredFinal = filterOrdersByPeriod(currentOrders, currentPeriod)
                        .filter(o => currentStatusFilter ? o.status === currentStatusFilter : true);
                    renderDashboard(cachedAccount, savedBalance, filteredFinal, filteredFinal.length);
                    const name = getDriverName();
                    const driverNameEl = document.getElementById('driverNameDisplay');
                    if (name && driverNameEl) driverNameEl.textContent = name;
                    return true;
                }
            } catch (e) {
                console.warn('تعذر العرض الفوري من الكاش المحلي:', e);
            }
            return false;
        }

:"لا تنعطف في منعطف حاد وأنت تضغط بقوة على الفرامل؛ السرعة المناسبة تؤخذ قبل الدخول في المنعطف، ثم يتم المحافظة على ثبات الغيار."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"تجنب السير خلف شاحنات نقل الرمل أو الحصى أو الشاحنات المفتوحة، فالأحجار الصغيرة المتطايرة قد تصيب عينيك أو تكسر زجاج الخوذة."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"احرص دائماً على ارتداء نظارات حماية أو خوذة بواقية زجاجية شفافة ونظيفة لحماية عينيك من الأتربة والحشرات المتطايرة نهاراً وليلاً."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"تجنب السواقة بيد واحدة مهما كنت واثقاً من مهاراتك؛ التحكم الكامل في ميزانية المتر والتعامل مع الطوارئ يتطلب قبضتي يديك على المقود."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"احذر من مطبات الطرق غير المدهونة في الليل؛ خفف سرعتك في الشوارع غير المضاءة جيداً واعتمد على قوة النور المنخفض."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"لا تتسابق مع سائقي السيارات أو الدراجات الأخرى في الطريق؛ السلامة والوصول السالم إلى أهلك ورزقك أهم من أي استعراض."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"احذر من قيادة المتر في أوقات الغبار الشديد أو العواصف؛ الرؤية تنخفض بشكل حاد والرياح الجانبية قد تدفع المتر خارج مساره."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"تجنب المرور في برك وتجمعات مياه الأمطار العميقة؛ فقد تخفي تحتها حفرة عميقة أو حافة حديدية حادة تمزق الإطار وتسقط المتر."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"استخدم إشارات الانعطاف دائماً قبل تغيير مسارك أو الانعطاف بوقت كافٍ لتنبيه السائقين خلفك بنيتك، ولا تعتمد على حركة يدك وحدها."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"احذر من الوقوف المفاجئ وسط الشارع عند البحث عن موقع عميل؛ خذ أقصى اليمين في مكان آمن ثم تفقد العنوان في هاتفك."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"تأكد من عدم ارتداء ملابس فضفاضة أو وشاح طويل قد يتدلى ويشتبك بجنزير المتر أو العجلة الخلفية فيسبب حادثاً خطيراً."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"عند تحميل صندوق الطلبات بأوزان ثقيلة، تذكر أن مسافة الفرملة ستزيد وأن استجابة المقود ستصبح أثقل؛ ارفع مستوى حذرك."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"لا تقم بتغيير المسار بشكل متعرج وسريع بين السيارات في الزحام (الغرز)؛ أي حركة بسيطة من سيارة قد تنهي مسارك بالاصطدام."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"حافظ على هدوء أعصابك عند مواجهة سائق غير منتبه أو متعنت؛ سلامتك وصحتك أهم من الدخول في مشاحنات تشتت انتباهك."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"إذا أحسست بأي اهتزاز غريب في المقود أو العجلة أثناء السير، خفف سرعتك بهدوء وتوقف على جانب الطريق فوراً لفحص الإطار."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"انتبه لمخارج الكراجات والمواقف والمحطات؛ السيارات تخرج منها أحياناً دون أن ينظر سائقوها إلى مسار الدراجات النارية."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"تجنب السير بمحاذاة الشاحنات الكبيرة في المنعطفات؛ الشاحنات تنحرف للداخل وتحتاج مساحة دوران واسعة قد تضغط المتر نحو الرصيف."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"القيادة الدفاعية تعني: افترض دائماً أن السائق الآخر قد يخطئ، وجهز خطة بديلة للهروب والتوقف في كل ثانية."},{"cat":"safety","icon":"🛡️","badge":"سلامة السواقة","text":"لا تعتمد على صوت بوري المتر فقط لتنبيه الآخرين؛ استخدم الفرامل وخفف السرعة في نفس اللحظة التي تطلق فيها المنبه."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تغيير زيت محرك المتر كل 1000 إلى 1500 كم يحافظ على عزم المحرك ويمنع تآكل تروس البستم والكرنك الداخلية."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"افحص ضغط هواء الإطارات أسبوعياً؛ الضغط الموصى به (غالباً 28-32 PSI) يوفر استهلاك البنزين ويحمي الجنوط من الكسر."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"احرص على تنظيف وتشحيم جنزير المتر دورياً بزيت مخصص أو شحم خفيف لتفادي جفافه وتآكل أسنان التروس (الترس الصغير والكبير)."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"افحص وزنية شد جنزير المتر؛ الفضاوة الطبيعية للجنزير يجب أن تكون بين 2 إلى 3 سم، والشد الزائد يكسر رمانات المحور."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"افحص فحمات (أقمشة) الفرامل الأمامية والخلفية ولا تؤجل تغييرها إذا اقترب سُمكها من الانتهاء لحماية الهوب وضمان الفرملة."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"نظف فلتر الهواء من الأتربة والغبار كل أسبوعين، فالفلتر النظيف يمنح المتر سحباً قوياً واحتراقاً متكاملاً ويوفر الوقود."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تفقد شمعة الاحتراق (البوجيه) بانتظام؛ اللون البني الفاتح يدل على احتراق سليم، بينما السواد أو الزيت يدل على مشاكل كربنة."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"احتفظ دائماً في صندوق المتر ببوجيه جديد ومفتاح بوجيه وفيوز كهرباء احتياطي ومفك مزدوج؛ هذه العدة منقذة في الأوقات الصعبة."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"لا تترك تانكي البنزين يصل للصفر تماماً حتى لا تسحب المصفاة الأوساخ والرواسب المترسبة في قاع الخزان إلى الكربريتر."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"افحص أسلاك الكلتش ودعسة البنزين وضع قطرات زيت خفيف في جِراب السلك لمنع تجمد حركته وحمايته من التقطع المفاجئ."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تأكد من نظافة أقطاب بطارية المتر وإحكام ربط مساميرها لمنع تفريغ الشحن أو ضعف سحب السلف عند التشغيل في الصباح."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"احذر من غسيل المتر والمحرك ساخن جداً بالماء البارد لأن الصدمة الحرارية المفاجئة قد تسبب شروخاً دقيقة في رأس السلندر."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تفقد مسامير المساعدات الأمامية والخلفية والشاسيه وشدها دورياً؛ اهتزازات الطرق والحفر المتكررة تسبب ارتخاءها تدريجياً."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"افحص مستوى زيت المحرك دائماً والمتر متوقف على أرض مستوية ومثبت على الستاند المزدوج (النص)، واحرص على ألا ينقص عن الخط."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"اختر لزوجة الزيت المناسبة لمترك (مثل 20W-50 في الصيف الحار و 10W-40 في الأجواء المعتدلة) لضمان حماية قصوى للتروس."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"افحص رمانات (بلي) العجلات برفع المتر وهز الإطار جانبياً؛ أي حركة أو خشونة في الدوران تعني ضرورة تبديل الرمان فوراً."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تأكد من سلامة دبة الشكمان وعدم وجود ثقوب أو تنفيس غازات يضعف عزم السحب ويصدر ضجيجاً مزعجاً وغير لائق."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تفقد عمل لمبة الستوب الخلفية عند الضغط على فرامل اليد وفرامل الرجل؛ انقطاعها يعرضك لخطر الصدم من السيارات خلفك."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"احرص على ضبط زوايا المرايا الجانبية بإحكام بحيث تكشف المسار الخلفي دون الحاجة لتحريك جسمك أو الالتفات للخلف."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"لا توجه مضخة الماء ذات الضغط العالي مباشرة إلى فتحات الكربريتر أو لوحة المفاتيح الكهربائية أثناء غسيل المتر."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"شحّم مفاصل الستاند الجانبي والأوسط ورجّاعة الفرامل بانتظام لتعمل بسلاسة دون تعليق أو صوت صرير."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"افحص جنوط المتر وتأكد من خلوها من أي طعجات ناتجة عن صدمات الحفر والمطبات، فالطعجة تسبب رفة في التوازن وتنسيم الهواء."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"إذا شعرت بثقل في تبديل نمر القير، افحص وزنية سلك الكلتش وتأكد من جودة ولزوجة زيت المحرك؛ الزيت القديم يثقل التروس."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"نظف مصفاة البنزين الصغيرة (فلتر الوقود) أو استبدلها كل شهرين لضمان تدفق بنزين صافٍ ونقي إلى المحرك."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"في الصباح، دع المتر يعمل لمدة 30 إلى 60 ثانية قبل التحرك ليصعد الزيت إلى رأس المحرك وصمامات التبخير بسلاسة."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تجنب زيادة دورات المحرك (الدعس القوي) والمتر في وضع الوقوف أو المحرك بارد؛ التدرج الهادئ يحافظ على عمر السلندر."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"افحص سلامة جلدات الشكمان وقواعد المحرك المطاطية؛ تلفها ينقل اهتزازات المحرك مباشرة إلى الشاسيه والمقود."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تأكد من رجوع مقبض البنزين تلقائياً إلى وضعه الطبيعي فور تركه؛ أي تعليق في سلك البنزين خطر بالغ يجب حله فوراً."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"استبدل الإطارات فور مسح نقشتها؛ الإطار الأملس يفقد تماسكه مع الأسفلت ويزلق بسهولة عند أول فرملة أو بقعة مياه."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"احرص على فحص زيت المساعدات الأمامية (صوفة المساعد) وتأكد من جفاف السيقان من أي تسريب زيتي يجمع الأتربة."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تفقد عمل بوري (منبه) المتر يومياً؛ صوته الواضح وسيلة أمان رئيسية لتنبيه المشاة وسائقي السيارات في التقاطعات والزحام."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تأكد من وجود غطاء محكم لحلمة (بلف) هواء الإطارات لمنع تسرب الهواء ودخول الأتربة والرمال إلى داخل البلف."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"افحص سلك عداد السرعة والكيلومتر؛ ثبات العداد يساعدك في الالتزام بمواعيد تغيير الزيت والتشحيم الدقيق."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"تجنب التحميل الزائد على مقود المتر أو تعليق أكياس ثقيلة على الأذرع؛ ثقل المقود يعيق سرعة توجيه المتر في الطوارئ."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"احرص على فحص بطارية المتر والتأكد من تثبيت حزام البطارية بإحكام لمنع ارتجاجها وتلف ألواح الرصاص الداخلية."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"إذا كان مترك بنظام الفرامل الباكمل (زيت باكم)، راقب مستوى الزيت في العلبة الشفافة واستخدم زيت فرامل أصلي DOT3 أو DOT4."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"احرص على شراء قطع الغيار الاستهلاكية الأصلية (البواجي، التيل، السيور، الفلاتر)؛ القطع التجارية الرخيصة تتلف سريعاً وتكلفك أكثر."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"احمِ مقعد المتر والعداد من الشمس الحارقة بتغطيته بقطعة قماش خفيفة عند الوقوف الطويل لحماية الجلد والشاشة من التلف."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"نظف أذرع المساعدات والجنوط بانتظام من الطين والأتربة الجافة التي قد تتسبب في احتكاك وتآكل الصوف المانعة للتسريب."},{"cat":"moto","icon":"🛵","badge":"عناية وصيانة المتر","text":"احرص دائماً على صيانة مترك بيدك وتعرف على أجزائه؛ معرفة صوت المتر الطبيعي تمكنك من اكتشاف أي عطل في بدايته قبل أن يتفاقم."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"كل مشوار تقطعه ساعياً في طلب الرزق الحلال لأهلك هو عبادة وأجر وشرف عظيم؛ بارك الله في خطاك وجهدك يا بطل."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"ابتسامتك الصادقة وكلمتك الطيبة عند تسليم الطلب تفتح أبواب القبول والرضا عند العميل وتترك أثراً جميلاً لا ينسى."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"الرزق مقسوم ومكتوب عند رب العالمين؛ لا تستعجل بتهور وتعريض حياتك للخطر، فما كُتب لك سيصلك حتماً في وقته المقدر."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"أشرقت شمس يوم جديد مليء بالفرص والأرزاق؛ توكل على الله الحي القيوم واستبشر خيراً تجد التيسير حليفك في كل طريق."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"الأمانة والإخلاص في العمل هما سر البركة في المال وحفظ النفس والولد؛ كن أميناً في مواعيدك وحفظك لطلبات الناس."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"التعب والجهد يزول مع نهاية اليوم ويبقى الأجر وفرحة الكسب الحلال؛ أنت تبني مستقبلك بعرق جبينك وهذا أعظم فخر."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"الصبر على زحمة السير وتقلبات الطريق يصنع منك إنساناً حليماً وصبوراً؛ تعامل مع الزحام بهدوء فالغضب لا يختصر المسافة."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"لا شيء يضيع عند الله سبحانه؛ كل قطرة عرق تبذلها في سبيل كفاية نفسك وأسرتك مكتوبة لك في ميزان الحسنات والرفعة."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"تفاءل بالخير دائماً ونوِّ النية الطيبة في خروجك؛ صاحب النية الطيبة والقلب السليم تفتح له الأبواب المغلقة وتتسع أرزاقه."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"القناعة كنز لا يفنى، والرضا بما قسم الله لك في يومك يجلب الطمأنينة وبركة مضاعفة؛ الحمد لله على نعمة الصحة والعمل."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"كن هادئ النفس مبتسماً مهما واجهت من ضغوط؛ الكلمة اللطيفة تطفئ غضب العميل المتوتر وتكسبك احترامه وتقديره الدائم."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"البركة ليست في كثرة المال فقط، بل في حفظ الصحة والسلامة في الطريق وراحة البال والعودة سالماً إلى بيتك وأحبابك."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"عامل الناس كما تحب أن يعاملوك؛ دقة موعدك وأمانتك في إرجاع باقي النقود تصنع لك سمعة ذهبية وثقة كبيرة في متجرك."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"إذا تأخر عليك طلب في المطعم أو واجهت عائقاً في الطريق، قل: 'قدّر الله وما شاء فعل والحمد لله على كل حال'، واحتسب الأجر."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"أنت لست مجرد موصل طلبات، أنت شريان الحياة الذي يربط الناس باحتياجاتهم ويدخل البهجة والسرور على بيوتهم كل يوم."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"ابدأ كل انطلاقة ببسم الله وتوكل على الله؛ من توكل على الله كفاه وأصلح شأنه وأحاطه بعنايته ورعايته في كل منعطف."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"اجعل أوقات الانتظار في المطاعم أو الإشارات فرصة للاستغفار وذكر الله، فالاستغفار مفتاح عظيم لزيادة الرزق وتفريج الكروب."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"لا تقارن رزقك برزق غيرك؛ لكل إنسان مساره وتوقيته المكتوب، ورزقك يسعى إليك كما يسعى إليك أجلك، فاطمئن وتوكل."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"من أتقن عمله أحبه الله والناس؛ اتقانك في ترتيب الطلبات وحفظها سيعود عليك بالخير والسمعة الطيبة ودوام التوفيق."},{"cat":"wisdom","icon":"🌟","badge":"تفاؤل وهمة","text":"تذكر دائماً أن هناك عيوناً تنتظر عودتك سالماً معافى في نهاية اليوم؛ سلامتك الشخصية هي رأس مالك الأغلى بلا منازع."},{"cat":"delivery","icon":"📦","badge":"احترافية التوصيل","text":"ثبّت صندوق وحقيبة التوصيل خلف المتر بإحكام متين؛ اهتزاز الصندوق قد يقلب المأكولات أو يفسد ترتيب الوجبات داخل الأكياس."},{"cat":"d         function getRandomDriverTip() {
            if (!Array.isArray(DRIVER_TIPS_DATABASE) || DRIVER_TIPS_DATABASE.length === 0) {
                return { cat: 'safety', icon: '🛡️', badge: 'سلامة السواقة', text: 'الخوذة هي درعك الوحيد الذي يحمي حياتك؛ ارتدها دائماً وقد بحذر وسلامة.' };
            }
            const idx = Math.floor(Math.random() * DRIVER_TIPS_DATABASE.length);
            return DRIVER_TIPS_DATABASE[idx];
        }

        function shuffleWelcomeTip() {
            const tip = getRandomDriverTip();
            const badgeEl = document.getElementById('welcomeTipBadge');
            const textEl = document.getElementById('welcomeTipText');
            const cardEl = document.getElementById('welcomeTipCard');
            if (!badgeEl || !textEl || !tip) return;

            if (cardEl) {
                cardEl.style.opacity = '0.35';
                cardEl.style.transform = 'scale(0.98)';
                cardEl.style.transition = 'all 0.18s ease';
            }
            setTimeout(() => {
                badgeEl.innerHTML = '<span>' + tip.icon + '</span> <span>' + tip.badge + '</span>';
                textEl.textContent = tip.text;
                if (cardEl) {
                    cardEl.style.opacity = '1';
                    cardEl.style.transform = 'scale(1)';
                }
            }, 180);
        }

        function checkAndShowWelcomePrompt() {
            const token = getToken();
            const driverId = getDriverId();
            if (!token || !driverId) return;

            const alreadyShown = sessionStorage.getItem('driverWelcomeShown');
            if (alreadyShown) return;

            // التأكد من جاهزية الطلبات محلياً قبل فتح النافذة لضمان دقة العدد 100%
            if (!currentOrders || currentOrders.length === 0) {
                getAll(STORES.ORDERS).then(localOrders => {
                    const driverOrders = (localOrders || []).filter(o => o.driver_id == driverId);
                    if (driverOrders && driverOrders.length > 0) {
                        currentOrders = driverOrders;
                    }
                    setTimeout(() => {
                        showWelcomeEncouragementModal();
                        sessionStorage.setItem('driverWelcomeShown', 'true');
                    }, 300);
                }).catch(() => {
                    setTimeout(() => {
                        showWelcomeEncouragementModal();
                        sessionStorage.setItem('driverWelcomeShown', 'true');
                    }, 300);
                });
            } else {
                setTimeout(() => {
                    showWelcomeEncouragementModal();
                    sessionStorage.setItem('driverWelcomeShown', 'true');
                }, 300);
            }
        }

        function showWelcomeEncouragementModal() {
            const driverName = getDriverName() || 'كابتن';
            const now = new Date();
            const hour = now.getHours();
            const isDayTime = hour >= 5 && hour < 17; // فترة النهار من 5 فجراً حتى 5 مساءً

            const tip = getRandomDriverTip();

            const timeIcon = isDayTime ? '☀️' : '🌙';
            const themeClass = isDayTime ? 'day-theme' : 'night-theme';
            const periodTitle = isDayTime ? 'صباح الخير والهمّة والبركة' : 'مساء الخير والسلامة والتيسير';

            // تحديد الفترة النشطة ومسماها
            const activePeriod = currentPeriod || localStorage.getItem('driverPeriod') || 'all';
            const periodLabel = getPeriodLabel(activePeriod);

            // تصفية الطلبات بحسب الفترة النشطة المحددة بدقة
            const periodOrders = filterOrdersByPeriod(currentOrders || [], activePeriod);
            
            // حساب الطلبات التي لم تُسلّم بعد خلال هذه الفترة

        function detectActiveCardIndex() {
            const track = document.getElementById('swipeCardsTrack');
            if (!track || !track.children || track.children.length === 0) return 0;
            const trackRect = track.getBoundingClientRect();
            const trackCenter = trackRect.left + trackRect.width / 2;

            let closestIndex = 0;
            let minDistance = Infinity;

            for (let i = 0; i < track.children.length; i++) {
                const card = track.children[i];
                const cardRect = card.getBoundingClientRect();
                const cardCenter = cardRect.left + cardRect.width / 2;
                const dist = Math.abs(trackCenter - cardCenter);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestIndex = i;
                }
            }
            return closestIndex;
        }
