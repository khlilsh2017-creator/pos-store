        async function quickSubmitSwipeDelivery(orderId, status, btnEl) {
            if (isUpdatingDeliveryStatus || isSubmitting) {
                showToast('⚠️ جاري معالجة طلب سابق، انتظر قليلاً');
                return;
            }
            const order = currentOrders.find(o => String(o.id) === String(orderId));
            if (!order) {
                showToast('❌ الطلب غير موجود');
                return;
            }

            const finalStatuses = ['تم التسليم', 'فشل التسليم', 'مرتجع جزئي', 'مرتجع كلي', 'ملغي'];
            if (finalStatuses.includes(order.status)) {
                showToast('❌ هذا الطلب قد انتهى، لا يمكن تعديله');
                return;
            }

            isUpdatingDeliveryStatus = true;
            isSubmitting = true;
            setOrderButtonsDisabled(orderId, true);

            const slideEl = document.querySelector(`.swipe-card-slide[data-order-id="${orderId}"]`);
            const actionsContainer = slideEl ? slideEl.querySelector('.action-buttons') : null;
            const originalActionsHtml = actionsContainer ? actionsContainer.innerHTML : '';
            if (actionsContainer) {
                actionsContainer.querySelectorAll('.btn').forEach(b => {
                    b.disabled = true;
                    b.style.opacity = '0.6';
                });
            }

            try {
                const originalOrder = typeof structuredClone === 'function' ? structuredClone(order) : JSON.parse(JSON.stringify(order));
                const due = getOrderDueAmount(order);

                let paymentData = null;
                if (status === 'تم التوصيل') {
                    const curList = (currencies && currencies.length > 0)
                        ? currencies
                        : [{ id: 1, code: 'YER', name: 'ريال يمني', is_base: 1, rate_to_base: 1 }];
                    const baseCurrency = curList.find(c => c.is_base) || curList[0];
                    const baseCurrencyId = baseCurrency ? baseCurrency.id : 1;

                    if (due > 0) {
                        let method = 'نقدي';
                        if (order.payment_method && order.payment_method.includes('مختلط')) {
                            method = 'مختلط';
                        }
                        paymentData = {
                            payment_method: method,
                            cash_collected: due,
                            wallet_collected: 0,
                            wallet_id: order.wallet_id ? parseInt(order.wallet_id) : null,
                            cash_currency_id: baseCurrencyId,
                            wallet_currency_id: baseCurrencyId
                        };
                    } else {
                        paymentData = {
                            payment_method: order.payment_method || 'نقدي',
                            cash_collected: 0,
                            wallet_collected: 0,
                            wallet_id: null,
                            cash_currency_id: baseCurrencyId,
                            wallet_currency_id: baseCurrencyId
                        };
                    }
                }

                let newStatus = status;
                if (status === 'فشل') newStatus = 'فشل التسليم';
                else if (status === 'تم التوصيل') newStatus = 'تم التسليم';

                // 1. تحديث محلي فوري
                const updatedOrder = { ...order, status: newStatus };
                if (paymentData) {
                    updatedOrder.payment_method = paymentData.payment_method;
                    updatedOrder.cash_collected = paymentData.cash_collected;
                    updatedOrder.wallet_collected = paymentData.wallet_collected;
                }
                const index = currentOrders.findIndex(o => String(o.id) === String(orderId));
                if (index !== -1) currentOrders[index] = updatedOrder;
                else currentOrders.push(updatedOrder);

                const swipeIdx = swipeCardsList.findIndex(o => String(o.id) === String(orderId));
                if (swipeIdx !== -1) swipeCardsList[swipeIdx] = updatedOrder;

                await updateOrderLocally(updatedOrder);
                applyFiltersAndRender();

                // تحديث بطاقة السوايب فوراً بدون إغلاقها
                if (slideEl) {
                    const badgeEl = slideEl.querySelector('.order-status-badge');
                    if (badgeEl) {
                        badgeEl.className = `order-status-badge ${newStatus === 'تم التسليم' ? 'badge-delivered' : 'badge-failed'}`;
                        badgeEl.textContent = newStatus;
                    }
                    if (actionsContainer) {
                        actionsContainer.outerHTML = `<div class="swipe-done-msg" style="text-align:center; color:${newStatus === 'تم التسليم' ? '#15803d' : '#991b1b'}; background:${newStatus === 'تم التسليم' ? '#dcfce7' : '#fee2e2'}; font-size:0.8rem; font-weight:700; padding:9px; border-radius:12px; margin-top:8px;">${newStatus === 'تم التسليم' ? '✅ تم تسليم الطلب بنجاح' : '❌ تم تسجيل فشل التسليم'}</div>`;
                    }
                }

                if ('vibrate' in navigator) {
                    try { navigator.vibrate(40); } catch (e) {}
                }

                // الانتقال التلقائي السلس للبطاقة التالية إن وجدت
                if (currentSwipeIndex < swipeCardsList.length - 1) {
                    setTimeout(() => {
                        swipeNextCard();
                    }, 350);
                }

                // 2. المزامنة مع الخادم
                const operationId = generateOperationId();
                const operationData = {
                    operation_id: operationId,
                    order_id: orderId,
                    delivery_status: status,
                    ...(paymentData || {}),
                    notes: order.notes || order.note || ''
                };

                if (navigator.onLine) {
                    try {
                        const response = await apiCall('/driver/update-delivery', 'POST', operationData);
                        if (response.order) {
                            const serverOrder = response.order;
                            const idx = currentOrders.findIndex(o => String(o.id) === String(orderId));
                            const confirmedOrder = { ...serverOrder, _pendingSync: false };
                            if (idx !== -1) currentOrders[idx] = confirmedOrder;
                            else currentOrders.push(confirmedOrder);
                            await updateOrderLocally(confirmedOrder);
                        }

                        const serverBalance = response.account?.balance !== undefined ? response.account.balance : response.balance;
                        if (serverBalance !== undefined) {
                            totalBalance = serverBalance;
                            localStorage.setItem('driverBalance', totalBalance.toString());
                            updateBalanceDisplay();
                        } else if (status === 'تم التوصيل' && paymentData && paymentData.cash_collected > 0) {
                            totalBalance += paymentData.cash_collected;
                            localStorage.setItem('driverBalance', totalBalance.toString());
                            updateBalanceDisplay();
                        }

                        if (response.account) {
                            lastAccountData = { ...lastAccountData, ...response.account };
                            localStorage.setItem('lastAccountData', JSON.stringify(lastAccountData));
                        }

                        applyFiltersAndRender();
                        showToast(`✅ تم تحديث الطلب #${orderId} (${newStatus})`);
                        refreshOrders().catch(console.warn);
                    } catch (err) {
                        const errMsg = (err.message || '').toLowerCase();
                        const isClientError = errMsg.includes('400') || errMsg.includes('403') || errMsg.includes('422');
                        if (isClientError) {
                            await rollbackLocalOrderUpdate(orderId, originalOrder);
                            if (slideEl) {
                                const badgeEl = slideEl.querySelector('.order-status-badge');
                                if (badgeEl) {
                                    badgeEl.className = 'order-status-badge badge-progress';
                                    badgeEl.textContent = originalOrder.status || 'جديد';
                                }
                                const doneMsgEl = slideEl.querySelector('.swipe-done-msg');
                                if (doneMsgEl && originalActionsHtml) {
                                    doneMsgEl.outerHTML = `<div class="action-buttons" style="margin-top:8px;">${originalActionsHtml}</div>`;
                                }
                            }
                            let errorText = err.message || '';
                            try {
                                const errorObj = JSON.parse(err.message);
                                if (errorObj && errorObj.error) errorText = errorObj.error;
                            } catch (e) {}
                            showToast('❌ تعذر إتمام التحديث: ' + (errorText || err.message));
                        } else {
                            await addOperation({
                                store: STORES.ORDERS,
                                type: 'update',
                                operation_id: operationId,
                                data: operationData
                            });
                            updatedOrder._pendingSync = true;
                            markOrderAsPending(orderId);
                            await updateSyncCounter();
                            registerBackgroundSync();
                            if (status === 'تم التوصيل' && paymentData && paymentData.cash_collected > 0) {
                                totalBalance += paymentData.cash_collected;
                                localStorage.setItem('driverBalance', totalBalance.toString());
                                updateBalanceDisplay();
                            }
                            showToast('📴 تم حفظ التحديث محلياً، ستتم المزامنة تلقائياً');
                        }
                    }
                } else {
                    await addOperation({
                        store: STORES.ORDERS,
                        type: 'update',
                        operation_id: operationId,
                        data: operationData
                    });
                    updatedOrder._pendingSync = true;
                    markOrderAsPending(orderId);
                    await updateSyncCounter();
                    registerBackgroundSync();
                    if (status === 'تم التوصيل' && paymentData && paymentData.cash_collected > 0) {
                        totalBalance += paymentData.cash_collected;
                        localStorage.setItem('driverBalance', totalBalance.toString());
                        updateBalanceDisplay();
                    }
                    showToast('📴 تم حفظ التحديث دون اتصال، ستتم المزامنة تلقائياً');
                }
            } catch (err) {
                console.error('خطأ غير متوقع في quickSubmitSwipeDelivery:', err);
                showToast('❌ حدث خطأ أثناء التحديث السريع');
            } finally {
                setOrderButtonsDisabled(orderId, false);
                isSubmitting = false;
                isUpdatingDeliveryStatus = false;
            }
        }

        function updateSwipeUI() {
            const activePeriod = currentPeriod || localStorage.getItem('driverPeriod') || 'all';
            const periodLabel = getPeriodLabel(activePeriod);

            const counter = document.getElementById('swipeCardsCounter');
            if (counter && swipeCardsList.length > 0) {
                counter.textContent = `طلب ${currentSwipeIndex + 1} من ${swipeCardsList.length} (${periodLabel})`;
            }

            const prevBtn = document.getElementById('swipePrevBtn');
            const nextBtn = document.getElementById('swipeNextBtn');
            if (prevBtn) prevBtn.disabled = currentSwipeIndex <= 0;
            if (nextBtn) nextBtn.disabled = currentSwipeIndex >= swipeCardsList.length - 1;

            const dots = document.querySelectorAll('.swipe-dot');
            dots.forEach((dot, idx) => {
                if (idx === currentSwipeIndex) dot.classList.add('active');
                else dot.classList.remove('active');
            });

            const compactCounter = document.getElementById('swipeDotsCompactCounter');
            if (compactCounter) {
                compactCounter.textContent = `${currentSwipeIndex + 1} / ${swipeCardsList.length}`;
            }
        }

        function goToSwipeCard(index) {
            if (index < 0 || index >= swipeCardsList.length) return;
            currentSwipeIndex = index;
            const track = document.getElementById('swipeCardsTrack');
            const slide = track ? track.children[index] : null;
            if (slide) {
                isProgrammaticScrolling = true;
                slide.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                clearTimeout(track._scrollResetTimer);
                track._scrollResetTimer = setTimeout(() => {
                    isProgrammaticScrolling = false;
                }, 400);
            }
            updateSwipeUI();
        }

        function swipeNextCard() {
            if (currentSwipeIndex < swipeCardsList.length - 1) {
                goToSwipeCard(currentSwipeIndex + 1);
            }
        }

        function swipePrevCard() {
            if (currentSwipeIndex > 0) {
                goToSwipeCard(currentSwipeIndex - 1);
            }
        }

        function closeSwipeableCardsModal(updateHistory = true) {
            const modal = document.getElementById('swipeCardsModal');
            const overlay = document.getElementById('swipeCardsOverlay');
            if (modal) modal.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
            if (updateHistory && history.state && history.state.modal === 'swipeCards') {
                setIgnoreNextPopState();
                try { history.back(); } catch (e) { ignoreNextPopState = false; }
            }
        }

        // معالجة الرجوع لإغلاق النوافذ المفتوحة أولاً بسلاسة دون اعتراض الخروج من التطبيق
        window.addEventListener('popstate', (e) => {
            if (ignoreNextPopState) {
                ignoreNextPopState = false;
                clearTimeout(ignorePopStateTimer);
                return;
            }

            // 1. إذا كان عارض البطاقات مفتوحاً -> إغلاقه بسلاسة والرجوع للشاشة الرئيسية
            const swipeModal = document.getElementById('swipeCardsModal');
            if (swipeModal && swipeModal.classList.contains('active')) {
                closeSwipeableCardsModal(false);
                return;
            }

            // 2. إذا كانت نافذة الترحيب مفتوحة -> إغلاقها بسلاسة والرجوع للشاشة الرئيسية
            const welcomeModal = document.getElementById('welcomeModal');
            if (welcomeModal && welcomeModal.classList.contains('active')) {
                closeWelcomeModal(false);
                return;
            }

            // 3. إذا كانت الفاتورة مفتوحة -> إغلاقها
            const invoiceSheet = document.getElementById('invoiceSheet');
            if (invoiceSheet && invoiceSheet.classList.contains('active')) {
                closeInvoiceModal(false);
                return;
            }

            // 4. إذا كان مودال التوصيل مفتوحاً -> إغلاقه
            const modalSheet = document.getElementById('modalSheet');
            if (modalSheet && modalSheet.classList.contains('active')) {
                closeModalSheet(false);
                return;
            }

            // 5. إذا كانت لوحة الاتصال مفتوحة -> إغلاقها
            const connPanel = document.getElementById('connectionPanel');
            if (connPanel && connPanel.classList.contains('show')) {
                connPanel.classList.remove('show');
                return;
            }

            // السماح للمتصفح بالرجوع الطبيعي دون أي حظر أو نوافذ تأكيد خروج
        });

        async function initApp() {
            updateEnhancedConnectionStatus();
            loadFilterSettings();

            const token = getToken();
            const driverId = getDriverId();
            if (!token || !driverId) {
                showLoginScreen();
                return;
            }

            const name = getDriverName();
            const driverNameEl = document.getElementById('driverNameDisplay');
            if (name && driverNameEl) driverNameEl.textContent = name;

            const savedView = localStorage.getItem('driverActiveView') || 'orders';
            currentView = savedView;
            updateNavSelection(currentView);

            // 1. العرض الفوري دون أي شاشة بيضاء أو تأخير
            if (currentView === 'orders') {
                document.getElementById('pageTitle').textContent = '📦 طلباتي';
                const hasCache = await instantRenderFromCache();
                if (!hasCache) {
                    renderDashboardSkeleton();
                    loadDashboard().catch(console.warn);
                } else {
                    if (navigator.onLine) {
                        refreshOrders().catch(console.warn);
                    }
                }
            } else {
                navigateTo(currentView);
            }

            // 2. تشغيل مهام الخلفية بشكل مستقل دون حظر الواجهة إطلاقاً
            runBackgroundStartupTasks();

            // 3. عرض رسالة الترحيب والتشجيع اليومية للمندوب مع إحصائية الطلبات
            checkAndShowWelcomePrompt();
        }

        function runBackgroundStartupTasks() {
            setTimeout(async () => {
                try {
                    installEnhancedSyncIntegration();
                    updateSyncCounter().catch(console.warn);

                    // تفعيل الفحص اللحظي للطلبات في الخلفية
                    startRealtimeOrdersPolling();

                    if ('serviceWorker' in navigator) {
                        initializePushNotifications().catch(e => console.warn('Push init error:', e));
                    }

                    prepareDatabaseUpgradeSafely().catch(e => console.warn('DB upgrade error:', e));

                    if (navigator.onLine && getToken()) {
                        loadInitialData().catch(console.warn);
                        sendTokenToServiceWorker().catch(console.warn);
                        registerBackgroundSync().catch(console.warn);
                        syncAllOperations().catch(console.warn);
                    }
                } catch (e) {
                    console.warn('خطأ في مهام الخلفية:', e);
                }
            }, 60);
        }

        let appInitialized = false;
        function bootstrapApp() {
            if (appInitialized) return;
            appInitialized = true;
            initApp().catch(err => {
                console.error('خطأ عند بدء التطبيق:', err);
                loadDashboard().catch(console.error);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootstrapApp);
        } else {
            bootstrapApp();
        }
        window.addEventListener('load', bootstrapApp);

        window.addEventListener('online', async () => {
            updateEnhancedConnectionStatus();
            if (getToken()) {
                showToast('🔄 تم العودة للاتصال، جاري المزامنة...');
                await sendTokenToServiceWorker();
                await registerBackgroundSync();
                await syncAllOperations();
                if (currentView === 'orders') await refreshOrders();
                else if (currentView === 'returns') await loadReturnRequests();
            }
        });

        window.addEventListener('offline', () => {
            updateConnectionStatus();
            showToast('📴 تم قطع الاتصال');
        });

        // تصدير الدوال
        window.loadDashboard = loadDashboard;
        window.applyFilters = applyFilters;
        window.resetFilters = resetFilters;
        window.applyFiltersAndRender = applyFiltersAndRender;
        window.openDeliveryModal = openDeliveryModal;
        window.closeModalSheet = closeModalSheet;
        window.submitDeliveryUpdate = submitDeliveryUpdate;
        window.toggleModalPaymentSection = toggleModalPaymentSection;
        window.toggleModalPaymentFields = toggleModalPaymentFields;
        window.updateModalAmounts = updateModalAmounts;
        window.showInvoice = showInvoice;
        window.closeInvoiceModal = closeInvoiceModal;
        window.navigateTo = navigateTo;
        window.performGlobalSearch = performGlobalSearch;
        window.debouncedGlobalSearch = debouncedGlobalSearch;
        window.handleLogin = handleLogin;
        window.logout = logout;
        window.toggleSideMenu = toggleSideMenu;
        window.updateConnectionStatus = updateConnectionStatus;
        window.loadReturnRequests = loadReturnRequests;
        window.confirmReturnAction = confirmReturnAction;
        window.updateSyncCounter = updateSyncCounter;
        window.countPendingOperations = countPendingOperations;
        window.togglePushSubscription = togglePushSubscription;
        window.refreshOrders = refreshOrders;
        window.viewOrder = viewOrder;
        window.showOrderUpdateDialog = showOrderUpdateDialog;
        window.bulkPutOrders = bulkPutOrders;
        window.setOrderButtonsDisabled = setOrderButtonsDisabled;
        window.renderDashboardSkeleton = renderDashboardSkeleton;
        window.instantRenderFromCache = instantRenderFromCache;
        window.updateNavSelection = updateNavSelection;
        window.initApp = initApp;
        window.showWelcomeEncouragementModal = showWelcomeEncouragementModal;
        window.closeWelcomeModal = closeWelcomeModal;
        window.openSwipeableCardsModal = openSwipeableCardsModal;
        window.closeSwipeableCardsModal = closeSwipeableCardsModal;
        window.quickSubmitSwipeDelivery = quickSubmitSwipeDelivery;
        window.swipeNextCard = swipeNextCard;
        window.swipePrevCard = swipePrevCard;
        window.goToSwipeCard = goToSwipeCard;
        window.updateWelcomeModalIfOpen = updateWelcomeModalIfOpen;
        window.togglePreparedItem = togglePreparedItem;
        window.toggleAllOrderPrepared = toggleAllOrderPrepared;
        window.isItemPrepared = isItemPrepared;
        window.isOrderFullyPrepared = isOrderFullyPrepared;
        window.getPreparedCount = getPreparedCount;
        window.clearAllPreparedItems = clearAllPreparedItems;
        window.updateInvoicePrepProgress = updateInvoicePrepProgress;
        window.syncOrderPreparedState = syncOrderPreparedState;

        const styleEl = document.createElement('style');
        styleEl.textContent = `
            @keyframes slideUp { from { transform: translateX(-50%) translateY(20px); opacity:0; } to { transform: translateX(-50%) translateY(0); opacity:1; } }
            @keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
        `;
        document.head.appendChild(styleEl);
    </script>

<!-- نافذة عرض وتكبير صور الطلب للمندوب (Lightbox) -->
<div id="driverImageLightboxModal" style="position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.88); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:15px;" onclick="closeDriverImageLightbox()">
    <img id="driverLightboxImg" style="max-width:95vw; max-height:85vh; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.6); object-fit:contain;" onclick="event.stopPropagation()" />
    <button type="button" onclick="closeDriverImageLightbox()" style="position:absolute; top:18px; left:18px; background:rgba(255,255,255,0.25); color:#fff; border:none; border-radius:50%; width:44px; height:44px; font-size:1.4rem; cursor:pointer; display:flex; align-items:center; justify-content:center;">✕</button>
</div>

<script>
function renderInvoiceOrderImgs(order) {
    let imgs = [];
    try { imgs = typeof order.order_images === 'string' ? JSON.parse(order.order_images) : (order.order_images || []); } catch(e){}
    if (!Array.isArray(imgs) || !imgs.length) return '';
    return `<div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:8px 10px; margin:10px 0;">
        <div style="font-size:0.75rem; font-weight:800; color:#1e40af; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
            <span>📷 صور الأشكال والموديلات المطلوبة (${imgs.length})</span>
            <span style="font-size:0.65rem; color:#2563eb;">انقر للتكبير 🔍</span>
        </div>
        <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;">
            ${imgs.map(img => `<img src="${img}" style="width:60px; height:60px; border-radius:8px; object-fit:cover; border:1.5px solid #93c5fd; cursor:pointer;" onclick="openDriverImageLightbox('${img}')" />`).join('')}
        </div>
    </div>`;
}

function openDriverImageLightbox(src) {
    const modal = document.getElementById('driverImageLightboxModal');
    const img = document.getElementById('driverLightboxImg');
    if (!modal || !img || !src) return;
    img.src = src;
    modal.style.display = 'flex';
}

function closeDriverImageLightbox() {
    const modal = document.getElementById('driverImageLightboxModal');
    if (modal) modal.style.display = 'none';
}
</script>
