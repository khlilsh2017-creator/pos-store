    <style>
        /* --- جميع الأنماط السابقة (لم تتغير) --- */

        // =============================================================
        // 1. إعدادات API والتخزين المحلي
        // =============================================================
        const API_BASE = (window.API_BASE_URL || (window.apiClient && window.apiClient.baseUrl) || localStorage.getItem('posApiBase') || 'https://api.ibnalmukhtar.com').replace(/\/$/, '');
        let isDriverLoggingIn = false;
        let isUpdatingDeliveryStatus = false;
        let currentOrders = [];
        let totalBalance = 0;
        let currentStatusFilter = '';
        let currentPeriod = 'all';
        let currentView = 'orders';
        let currencies = [];
        let wallets = [];
        let returnRequests = [];
        let isSubmitting = false;
        let isSyncing = false;
        let pushSubscription = null;
        let isPushEnabled = false;
        let swRegistration = null;
        let lastAccountData = {};

        const firebaseConfig = {
            apiKey: "AIzaSyDjMiUhBOF9h1arbea4ZAorD-GdtATQ3Fs",
            authDomain: "ibn-al-mukhtar-pos.firebaseapp.com",
            projectId: "ibn-al-mukhtar-pos",
            storageBucket: "ibn-al-mukhtar-pos.firebasestorage.app",
            messagingSenderId: "953096430757",
            appId: "1:953096430757:web:7c2b60bd719aa70964994c"
        };
        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        // =============================================================
        // 2. IndexedDB
        // =============================================================
        const DB_NAME = 'DriverOrdersDB';
        const DB_VERSION = 10;
        const STORES = {
            ORDERS: 'orders',
            OPERATIONS: 'operations'
        };
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                if (db) { resolve(db); return; }
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORES.ORDERS)) {
                        const store = db.createObjectStore(STORES.ORDERS, { keyPath: 'id' });
                        store.createIndex('status', 'status', { unique: false });
                    }
                    let opStore;
                    if (!db.objectStoreNames.contains(STORES.OPERATIONS)) {
                        opStore = db.createObjectStore(STORES.OPERATIONS, { keyPath: 'id', autoIncrement: true });
                        opStore.createIndex('synced', 'synced', { unique: false });
                    } else {
                        opStore = event.target.transaction.objectStore(STORES.OPERATIONS);
                    }
                    if (!opStore.indexNames.contains('operation_id')) {
                        opStore.createIndex('operation_id', 'operation_id', { unique: false });
                    }
                };
                request.onblocked = () => {
                    console.warn('تحديث قاعدة البيانات متوقف: توجد نسخة قديمة مفتوحة. أعد تحميل الصفحات المفتوحة.');
                };
                request.onsuccess = (event) => {
                    db = event.target.result;
                    db.onversionchange = () => {
                        db.close();
                        db = null;
                        console.warn('تم إغلاق اتصال IndexedDB القديم لإكمال التحديث.');
                    };
                    resolve(db);
                };
                request.onerror = (event) => reject(event.target.error);
            });
        }

        async function getAll(storeName) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result || []);
                request.onerror = () => reject(request.error);
            });
        }

        async function put(storeName, data) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.put(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function updateOrderLocally(order) {
            await put(STORES.ORDERS, order);
        }

        async function bulkPutOrders(orders, driverId) {
            if (!orders || orders.length === 0) return;
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORES.ORDERS, 'readwrite');
                const store = tx.objectStore(STORES.ORDERS);
                for (const order of orders) {
                    if (driverId && !order.driver_id) order.driver_id = Number(driverId);
                    store.put(order);
                }
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        }

        function generateOperationId() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }
            return `op_${Date.now()}_${Math.random().toString(36).slice(2)}_${cryptoRandomPart()}`;
        }

        function cryptoRandomPart() {
            return Math.floor(Math.random() * 1e12).toString(36);
        }

        async function getOperationByOperationId(operationId) {
            if (!operationId) return null;
            const operations = await getAll(STORES.OPERATIONS);
            return operations.find(op => op.operation_id === operationId) || null;
        }

        async function addOperation(operation) {
            const operationId = operation.operation_id || generateOperationId();
            const existing = await getOperationByOperationId(operationId);
            if (existing) return existing;

            // منع تكرار عمليات تحديث نفس الطلب في طابور عدم الاتصال
            if (operation.store === STORES.ORDERS && operation.type === 'update' && operation.data?.order_id !== undefined) {
                const targetOrderId = String(operation.data.order_id);
                const pendingOps = await getPendingOperations();
                const existingOrderOp = pendingOps.find(op =>
                    op.store === STORES.ORDERS &&
                    op.type === 'update' &&
                    String(op.data?.order_id) === targetOrderId
                );
                if (existingOrderOp) {
                    const keepOpId = existingOrderOp.operation_id || operationId;
                    const updatedEntry = {
                        ...existingOrderOp,
                        ...operation,
                        id: existingOrderOp.id,
                        operation_id: keepOpId,
                        data: { ...(operation.data || {}), operation_id: keepOpId },
                        synced: false,
                        updated_at: new Date().toISOString()
                    };
                    await put(STORES.OPERATIONS, updatedEntry);
                    return updatedEntry;
                }
            }

            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORES.OPERATIONS, 'readwrite');
                const store = tx.objectStore(STORES.OPERATIONS);
                const entry = {
                    ...operation,
                    operation_id: operationId,
                    synced: false,
                    created_at: new Date().toISOString()
                };
                const request = store.add(entry);
                request.onsuccess = () => resolve({ ...entry, id: request.result });
                request.onerror = () => reject(request.error);
            });
        }

        async function getPendingOperations() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORES.OPERATIONS, 'readonly');
                const store = tx.objectStore(STORES.OPERATIONS);
                const index = store.index('synced');
                try {
                    const request = index.getAll(IDBKeyRange.only(false));
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                } catch (e) {
                    const request = store.getAll();
                    request.onsuccess = () => {
                        const results = (request.result || []).filter(op => !op.synced);
                        resolve(results);
                    };
                    request.onerror = () => reject(request.error);
                }
            });
        }

        async function applyPendingOperationsToOrders(orders) {
            const result = (orders || []).map(order => ({ ...order }));
            const pending = await getPendingOperations();

            for (const op of pending) {
                if (op.store !== STORES.ORDERS || op.type !== 'update') continue;
                const orderId = String(op.data.order_id);
                const order = result.find(item => String(item.id) === orderId);
                if (!order) continue;

                if (op.data.delivery_status) {
                    order.status = op.data.delivery_status === 'فشل'
                        ? 'فشل التسليم'
                        : op.data.delivery_status === 'تم التوصيل'
                            ? 'تم التسليم'
                            : op.data.delivery_status;
                }
                if (op.data.notes !== undefined) order.notes = op.data.notes;
                if (op.data.payment_method !== undefined) order.payment_method = op.data.payment_method;
                if (op.data.cash_collected !== undefined) order.cash_collected = op.data.cash_collected;
                if (op.data.wallet_collected !== undefined) order.wallet_collected = op.data.wallet_collected;
                order._pendingSync = true;
            }
            return result;
        }

        async function markOperationSynced(opKey) {
            if (opKey === undefined || opKey === null) return;
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORES.OPERATIONS, 'readwrite');
                const store = tx.objectStore(STORES.OPERATIONS);
                const handleOp = (op) => {
                    if (op) { op.synced = true; op.synced_at = new Date().toISOString(); store.put(op); }
                    resolve();
                };
                if (typeof opKey === 'string' && isNaN(Number(opKey))) {
                    try {
                        const index = store.index('operation_id');
                        const req = index.get(opKey);
                        req.onsuccess = () => handleOp(req.result);
                        req.onerror = () => reject(req.error);
                    } catch (e) {
                        const req = store.getAll();
                        req.onsuccess = () => {
                            const found = (req.result || []).find(x => x.operation_id === opKey);
                            handleOp(found);
                        };
                        req.onerror = () => reject(req.error);
                    }
                } else {
                    const req = store.get(Number(opKey) || opKey);
                    req.onsuccess = () => handleOp(req.result);
                    req.onerror = () => reject(req.error);
                }
            });
        }

        async function deleteOperation(opKey) {
            if (opKey === undefined || opKey === null) return;
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORES.OPERATIONS, 'readwrite');
                const store = tx.objectStore(STORES.OPERATIONS);
                if (typeof opKey === 'string' && isNaN(Number(opKey))) {
                    try {
                        const index = store.index('operation_id');
                        const req = index.getKey(opKey);
                        req.onsuccess = () => {
                            if (req.result !== undefined) {
                                store.delete(req.result);
                            }
                            resolve();
                        };
                        req.onerror = () => reject(req.error);
                    } catch (e) {
                        const req = store.getAll();
                        req.onsuccess = () => {
                            const found = (req.result || []).find(x => x.operation_id === opKey);
                            if (found && found.id !== undefined) store.delete(found.id);
                            resolve();
                        };
                        req.onerror = () => reject(req.error);
                    }
                } else {
                    const req = store.delete(Number(opKey) || opKey);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                }
            });
        }

        async function countPendingOperations() {
            const db = await openDB();
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction(STORES.OPERATIONS, 'readonly');
                    const store = tx.objectStore(STORES.OPERATIONS);
                    const index = store.index('synced');
                    const countRequest = index.count(IDBKeyRange.only(false));
                    countRequest.onsuccess = () => resolve(countRequest.result || 0);
                    countRequest.onerror = () => {
                        getPendingOperations().then(ops => resolve(ops.length)).catch(() => resolve(0));
                    };
                } catch (e) {
                    getPendingOperations().then(ops => resolve(ops.length)).catch(() => resolve(0));
                }
            });
        }

        function openCurrentDbForMigration() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME);
                let newDb = false;
                request.onupgradeneeded = () => { newDb = true; };
                request.onsuccess = () => { const oldDb = request.result; if (newDb) { oldDb.close(); resolve(null); } else { oldDb.onversionchange = () => oldDb.close(); resolve(oldDb); } };
                request.onerror = () => reject(request.error);
                request.onblocked = () => reject(new Error('قاعدة البيانات مشغولة في تبويب آخر'));
            });
        }

        async function prepareDatabaseUpgradeSafely() {
            const UPGRADE_KEY = 'db_upgrade_safe_v10_done';
            if (localStorage.getItem(UPGRADE_KEY)) return;
            let oldDb = null;
            try { oldDb = await openCurrentDbForMigration(); } catch (e) { console.warn('تعذر فتح قاعدة البيانات القديمة:', e); return; }
            if (!oldDb || !oldDb.objectStoreNames.contains(STORES.OPERATIONS) || !navigator.onLine || !getToken()) { oldDb?.close(); return; }
            try {
                const pending = await new Promise((resolve, reject) => { const r = oldDb.transaction(STORES.OPERATIONS).objectStore(STORES.OPERATIONS).getAll(); r.onsuccess = () => resolve((r.result || []).filter(x => !x.synced)); r.onerror = () => reject(r.error); });
                for (const op of pending) {
                    try {
                        const response = await fetch(API_BASE + '/driver/update-delivery', { method:'POST', headers:{'Authorization':'Bearer '+getToken(),'Content-Type':'application/json'}, body:JSON.stringify({...op.data, operation_id:op.data?.operation_id || op.operation_id}) });
                        if (response.ok || response.status === 409) await new Promise((resolve,reject) => { const tx=oldDb.transaction(STORES.OPERATIONS,'readwrite'); const store=tx.objectStore(STORES.OPERATIONS); const r=store.get(op.id); r.onsuccess=()=>{if(r.result){r.result.synced=true;r.result.synced_at=new Date().toISOString();store.put(r.result)}}; tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });
                    } catch (e) { console.warn('ستبقى العملية للمزامنة اللاحقة:', op.operation_id); }
                }
                localStorage.setItem(UPGRADE_KEY, 'true');
            } finally { oldDb.close(); }
        }

        let swMessageListenerAttached = false;
        function setupCentralSWMessageListener() {
            if (!navigator.serviceWorker || swMessageListenerAttached) return;
            swMessageListenerAttached = true;

            navigator.serviceWorker.addEventListener('message', event => {
                const data = event.data || {};

                if (data.action === 'reload' || data === 'skipWaiting') {
                    console.log('🔄 إعادة تحميل الصفحة بأمر من Service Worker');
                    window.location.reload(true);
                    return;
                }

                if (data.type === 'TRIGGER_CLIENT_SYNC') {
                    syncAllOperations();
                    return;
                }

                if (data.type === 'SYNC_STATUS') {
                    updateEnhancedSyncIndicator(data.status, data.pending || 0, data.synced || 0);
                    if (data.status === 'completed') {
                        refreshOrders();
                    }
                    return;
                }

                if (data.type === 'NEW_NOTIFICATION') {
                    const payload = data.payload || {};
                    showToast(`📩 ${payload.title || 'إشعار'}: ${payload.body || ''}`);
                    getPendingOperations().then(pending => {
                        const affected = payload.order_id && pending.some(op =>
                            op.store === STORES.ORDERS &&
                            op.type === 'update' &&
                            Number(op.data?.order_id) === Number(payload.order_id)
                        );
                        if (!affected) refreshOrders();
                        else updateSyncCounter();
                    });
                    if (payload.order_id) {
                        showOrderUpdateDialog(payload.order_id);
                    }
                    return;
                }

                if (data.type === 'OPEN_ORDER') {
                    const orderId = parseInt(data.order_id);
                    if (orderId) {
                        showOrderUpdateDialog(orderId);
                    }
                    return;
                }
            });
        }

        async function registerServiceWorker() {
            try {
                if (!('serviceWorker' in navigator)) {

                const currentPath = window.location.pathname;

                let registration = null;
                try {
                    registration = await navigator.serviceWorker.register(swPath, {

                    try {

                            scope: '/driver/',

                        });

        function playNotificationSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctx = new AudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {}
            if ('vibrate' in navigator) {
                try { navigator.vibrate([200, 100, 200]); } catch (e) {}
            }
        }

                        const title = payload.notification?.title || payload.data?.title || '📦 إشعار جديد';
                        const body = payload.notification?.body || payload.data?.body || '';
                        const orderId = payload.data?.order_id || null;

                        playNotificationSound();
                        showToast(`🔔 ${title}: ${body}`);
                        refreshOrders().catch(console.warn);
                        if (orderId) {
                            showOrderUpdateDialog(orderId);
                        }
                    });

                // 2. التحقق من إذن الإشعارات وتحديث توكن FCM لدى السيرفر
                const driverId = getDriverId();
                if (!driverId) return;

                if (Notification.permission === 'granted') {
                    let token = localStorage.getItem('fcmToken');
                    try {
                        if (typeof messaging !== 'undefined' && messaging) {
                            const freshToken = await messaging.getToken({
                                vapidKey: VAPID_PUBLIC_KEY,
                                serviceWorkerRegistration: swRegistration
                            });
                            if (freshToken) token = freshToken;
                        }
                    } catch (te) {
                        console.warn('تعذر استخراج توكن FCM طازج:', te);
                    }

                    if (token) {
                        localStorage.setItem('fcmToken', token);
                        await sendTokenToServer(token, driverId);
                        isPushEnabled = true;
                        updateNotificationUI(true);
                    } else {
                        const enabled = await registerForPushNotifications();
                        isPushEnabled = enabled === true;
                        updateNotificationUI(isPushEnabled);
                    }
                } else {
                    isPushEnabled = false;
                    updateNotificationUI(false);
                }

                console.error('خطأ في تهيئة الإشعارات:', err);
                updateNotificationUI(false);

        let realtimeOrdersInterval = null;
        function startRealtimeOrdersPolling() {
            if (realtimeOrdersInterval) clearInterval(realtimeOrdersInterval);
            // ═══════════════════════════════════════════════════════════
            // Polling احتياطي فقط — FCM هو المصدر الأساسي للإشعارات
            // كل 5 دقائق + عند فتح التطبيق + عند العودة للتطبيق
            // ═══════════════════════════════════════════════════════════
            realtimeOrdersInterval = setInterval(() => {
                if (document.hidden) return;               // لا تفحص في الخلفية
                if (!navigator.onLine) return;             // لا إنترنت
                if (!getToken()) return;                   // لا جلسة
                if (currentView !== 'orders') return;      // لست في صفحة الطلبات
                silentCheckForNewOrders();
            }, 300000);  // 5 دقائق بدلاً من 15 ثانية
        }

        async function silentCheckForNewOrders() {
            const driverId = getDriverId();
            if (!driverId || !navigator.onLine) return;
            try {
                const data = await fetchDriverOrders(driverId, 1, currentStatusFilter, currentPeriod, 50);
                const incomingOrders = data.orders || [];

                let hasNewOrders = false;
                let newestOrder = null;
                if (currentOrders && currentOrders.length > 0) {
                    const currentIds = new Set(currentOrders.map(o => String(o.id)));
                    for (const order of incomingOrders) {
                        if (!currentIds.has(String(order.id))) {
                            hasNewOrders = true;
                            newestOrder = order;
                            break;
                        }
                    }
                }

                const newOrders = await applyPendingOperationsToOrders(incomingOrders);
                currentOrders = newOrders;
                await bulkPutOrders(newOrders, driverId);
                applyFiltersAndRender();

                if (hasNewOrders && newestOrder) {
                    playNotificationSound();
                    showToast(`🔔 وصلك طلب جديد #${newestOrder.id} - ${newestOrder.customer_name || 'عميل'}`);
                }
            } catch (e) {}
        }

        async function apiCall(endpoint, method = 'GET', body = null) {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            if (body && body.operation_id && method && !['GET','HEAD','OPTIONS'].includes(method.toUpperCase())) {
                headers['X-Offline-Operation-Id'] = String(body.operation_id);
            }
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            try {
                const res = await fetch(`${API_BASE}${endpoint}`, options);
                if (res.status === 401) { logout(); throw new Error('انتهت صلاحية الجلسة'); }
                if (!res.ok) { const txt = await res.text(); throw new Error(txt || 'خطأ'); }
                return res.json().catch(() => ({}));
            } catch (err) {
                if (err.message === 'Failed to fetch') throw new Error('تعذر الاتصال بالخادم');
                throw err;
            }
        }

                return res.data;

            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'فشل تسجيل الدخول');
            return data;
        }

        function parseOrderDate(order) {
            if (!order) return null;
            const raw = order.order_date || order.created_at || order.createdAt;
            if (!raw) return null;
            if (raw instanceof Date) return isNaN(raw.getTime()) ? null : raw;
            if (typeof raw === 'number') return new Date(raw);
            try {
                const str = String(raw).trim().replace(' ', 'T');
                const d = new Date(str.includes('Z') || str.includes('+') ? str : str + 'Z');
                if (!isNaN(d.getTime())) return d;
                const dFallback = new Date(str);
                return isNaN(dFallback.getTime()) ? null : dFallback;
            } catch (e) {
                return null;
            }
        }

        function isOrderDelivered(order) {
            if (!order) return false;
            const s = String(order.status || '').trim();
            return s === 'تم التسليم' || s === 'تم التوصيل' || s.toLowerCase() === 'delivered';
        }

        function isOrderActivePending(order) {
            if (!order) return false;
            const s = String(order.status || '').trim();
            const finishedStatuses = [
                'تم التسليم', 'تم التوصيل', 'delivered',
                'فشل التسليم', 'فشل', 'failed',
                'ملغي', 'cancelled',
                'مرتجع جزئي', 'مرتجع كلي', 'returned'
            ];
            return !finishedStatuses.includes(s);
        }

        function filterOrdersByPeriod(orders, period) {
            if (!Array.isArray(orders)) return [];
            if (!period || period === 'all') return orders;
            const now = new Date();
            let startDate = new Date();
            switch (period) {
                case 'today':
                    startDate.setHours(0, 0, 0, 0);
                    break;
                case 'last2days':
                    startDate.setDate(now.getDate() - 2);
                    startDate.setHours(0, 0, 0, 0);
                    break;
                case 'week':
                    startDate.setDate(now.getDate() - 7);
                    startDate.setHours(0, 0, 0, 0);
                    break;
                case 'month':
                    startDate.setDate(now.getDate() - 30);
                    startDate.setHours(0, 0, 0, 0);
                    break;
                default:
                    return orders;
            }
            const startMs = startDate.getTime();
            return orders.filter(order => {
                const d = parseOrderDate(order);
                if (!d) return true;
                return d.getTime() >= startMs;
            });
        }

                function isPrepaidOrder(order) {
            const method = String(order?.payment_method || '');
            return method.includes('مدفوع مسبقاً') && !method.includes('مختلط');
        }

        function isMixedOrder(order) {
            return String(order?.payment_method || '').includes('مختلط');
        }

        function getOrderDueAmount(order) {
            // المدفوع مسبقاً بالكامل لا يُطلب من المندوب تحصيل أي مبلغ.
            if (isPrepaidOrder(order)) return 0;
            const rawDue = order?.expected_cash !== undefined && order?.expected_cash !== null
                ? order.expected_cash
                : (order?.total_amount || 0);
            return Math.max(0, parseFloat(rawDue) || 0);
        }

        // =============================================================
        // نظام تعليم الأصناف كمُجهزة — حفظ محلي لكل مندوب
        // =============================================================
        const PREPARED_STORAGE_PREFIX = 'driverPreparedItems_v2_';

        function getPreparedStorageKey() {
            const driverId = getDriverId();
            return PREPARED_STORAGE_PREFIX + (driverId || 'guest');
        }

        function getPreparedMap() {
            try {
                const raw = localStorage.getItem(getPreparedStorageKey());
                const parsed = raw ? JSON.parse(raw) : {};
                return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
            } catch (e) {
                console.warn('تعذر قراءة حالة التجهيز:', e);
                return {};
            }
        }

        function savePreparedMap(map) {
            try {
                localStorage.setItem(getPreparedStorageKey(), JSON.stringify(map || {}));
            } catch (e) {
                console.warn('تعذر حفظ حالة التجهيز:', e);
            }
        }

        function getOrderPreparedItems(orderId) {
            if (orderId === undefined || orderId === null) return [];
            const map = getPreparedMap();
            const entry = map[String(orderId)];
            return (entry && Array.isArray(entry.items)) ? entry.items : [];
        }

        function getPreparedCount(orderId) {
            return getOrderPreparedItems(orderId).length;
        }

        function isItemPrepared(orderId, itemId) {
            if (itemId === undefined || itemId === null) return false;
            return getOrderPreparedItems(orderId).includes(String(itemId));
        }

        function toggleItemPrepared(orderId, itemId) {
            const key = String(orderId);
            const itemKey = String(itemId);
            const map = getPreparedMap();
            if (!map[key]) map[key] = { items: [], at: new Date().toISOString() };
            if (!Array.isArray(map[key].items)) map[key].items = [];

            const idx = map[key].items.indexOf(itemKey);
            let isNowPrepared;
            if (idx !== -1) {
                map[key].items.splice(idx, 1);
                isNowPrepared = false;
            } else {
                map[key].items.push(itemKey);
                isNowPrepared = true;
            }
            map[key].at = new Date().toISOString();

            // لو ما فيه أصناف مُجهزة، احذف المفتاح كاملاً لتنظيف التخزين
            if (map[key].items.length === 0) delete map[key];

            savePreparedMap(map);
            return isNowPrepared;
        }

        function getOrderItemIds(order) {
            if (!order) return ['__order_all__'];
            const items = order.items || [];
            if (items.length === 0) return ['__order_all__'];
            const sortedItems = [...items].sort((a, b) => (b.id || 0) - (a.id || 0));
            return sortedItems.map(item => String(item.id ?? item.item_id ?? `row_${item.product_id || 'x'}`));
        }

        /**
         * هل الطلب مُجهز كاملاً؟ (كل الأصناف محددة)
         */
        function isOrderFullyPrepared(order) {
            if (!order) return false;
            const items = order.items || [];
            if (items.length === 0) return getPreparedCount(order.id) > 0;
            return getPreparedCount(order.id) >= items.length;
        }

        function clearAllPreparedItems() {
            try { localStorage.removeItem(getPreparedStorageKey()); } catch (e) {}
        }

        /**
         * زر التجهيز السريع فوق البطاقة:
         * عند الضغط على "غير مُجهز" (أو جزئي) -> يحدد الكل ويحوله إلى "جاهز"
         * وعند الضغط على "جاهز" -> يلغي تحديد الكل ويحوله إلى "غير مُجهز"
         */
        function toggleAllOrderPrepared(orderId, evt) {
            if (evt && typeof evt.stopPropagation === 'function') {
                evt.stopPropagation();
            }
            const key = String(orderId);
            const order = currentOrders.find(o => String(o.id) === key);
            const currentlyFull = checkOrderFullyPrepared(key);
            const map = getPreparedMap();

            let isNowFull;
            if (currentlyFull) {
                delete map[key];
                isNowFull = false;
            } else {
                const allItemIds = getOrderItemIds(order);
                map[key] = {
                    items: allItemIds,
                    at: new Date().toISOString()
                };
                isNowFull = true;
            }

            savePreparedMap(map);

            // مزامنة البطاقات (القائمة + السوايب)
            syncOrderPreparedState(key, isNowFull);

            // إذا كانت نافذة الفاتورة مفتوحة لهذا الطلب، حدّث الأزرار والصفوف وشريط التقدم
            const invoiceSheet = document.getElementById('invoiceSheet');
            if (invoiceSheet && invoiceSheet.classList.contains('active')) {
                invoiceSheet.querySelectorAll(`.item-prep-check[data-order-id="${key}"]`).forEach(btn => {
                    btn.classList.toggle('is-prepared', isNowFull);
                    btn.textContent = isNowFull ? '✓' : '';
                    btn.setAttribute('aria-pressed', isNowFull ? 'true' : 'false');
                    const row = btn.closest('tr');
                    if (row) row.classList.toggle('is-prepared', isNowFull);
                });
                updateInvoicePrepProgress(key);
            }

            if ('vibrate' in navigator) {
                try { navigator.vibrate(isNowFull ? 35 : 15); } catch (e) {}
            }
            showToast(isNowFull ? `🎉 تم تحديد كل أصناف الطلب #${key} كـ جاهز` : `↩️ تم إلغاء تجهيز الطلب #${key}`);
        }

        /**
         * الدالة التفاعلية عند الضغط على checkbox الصنف داخل الفاتورة
         */
        function togglePreparedItem(orderId, itemId, btnEl) {
            const isNowPrepared = toggleItemPrepared(orderId, itemId);

            // 1. الزر نفسه
            if (btnEl) {
                btnEl.classList.toggle('is-prepared', isNowPrepared);
                btnEl.textContent = isNowPrepared ? '✓' : '';
                btnEl.setAttribute('aria-pressed', isNowPrepared ? 'true' : 'false');
            }

            // 2. صف الجدول
            const row = btnEl?.closest('tr');
            if (row) row.classList.toggle('is-prepared', isNowPrepared);

            // 3. تحديث شريط التقدّم داخل الفاتورة
            updateInvoicePrepProgress(orderId);

            // 4. مزامنة البطاقات (القائمة + السوايب)
            const fullyPrepared = checkOrderFullyPrepared(orderId);
            syncOrderPreparedState(orderId, fullyPrepared);

            // 5. اهتزاز + إشعار
            if ('vibrate' in navigator) {
                try { navigator.vibrate(isNowPrepared ? 30 : 12); } catch (e) {}
            }
            if (fullyPrepared && isNowPrepared) {
                showToast(`🎉 تم تجهيز الطلب #${orderId} بالكامل`);
            } else {
                showToast(isNowPrepared ? '✅ تم تعليم الصنف كمُجهز' : '↩️ تم إلغاء تعليم الصنف');
            }
        }

        function checkOrderFullyPrepared(orderId) {
            const order = currentOrders.find(o => String(o.id) === String(orderId));
            return isOrderFullyPrepared(order);
        }

        /**
         * تحديث شريط التقدّم داخل الفاتورة
         */
        function updateInvoicePrepProgress(orderId) {
            const order = currentOrders.find(o => String(o.id) === String(orderId));
            if (!order || !order.items) return;
            const total = order.items.length;
            const preparedCount = Math.min(total, getPreparedCount(orderId));
            const percent = total > 0 ? Math.round((preparedCount / total) * 100) : 0;

            const bar = document.getElementById('invoiceProgressBar');
            const text = document.getElementById('invoiceProgressText');
            const wrap = document.getElementById('invoicePrepProgress');

            if (bar) bar.style.width = percent + '%';
            if (text) {
                text.textContent = (preparedCount === total && total > 0)
                    ? `🎉 تم تجهيز كل الأصناف (${total}/${total})`
                    : `تم تجهيز ${preparedCount} من ${total} صنف`;
            }
            if (wrap) wrap.classList.toggle('all-done', preparedCount === total && total > 0);
        }

        /**
         * مزامنة حالة التجهيز مع البطاقات (القائمة + السوايب) بدون إعادة رسم
         */
        function syncOrderPreparedState(orderId, isFullyPrepared) {
            const order = currentOrders.find(o => String(o.id) === String(orderId));
            const total = order?.items?.length || 0;
            const preparedCount = getPreparedCount(orderId);

            const updateCardBadges = (containerEl) => {
                if (!containerEl) return;
                containerEl.classList.toggle('is-fully-prepared', isFullyPrepared);
                const badgeFull = containerEl.querySelector('.prepared-badge.badge-full');
                const badgePartial = containerEl.querySelector('.prepared-badge.badge-partial');
                const badgeNone = containerEl.querySelector('.prepared-badge.badge-none');

                if (badgeFull) badgeFull.style.display = isFullyPrepared ? 'inline-flex' : 'none';
                if (badgePartial) {
                    if (!isFullyPrepared && preparedCount > 0 && total > 0) {
                        badgePartial.style.display = 'inline-flex';
                        const c = badgePartial.querySelector('.partial-count');
                        const t = badgePartial.querySelector('.partial-total');
                        if (c) c.textContent = preparedCount;
                        if (t) t.textContent = total;
                    } else {
                        badgePartial.style.display = 'none';
                    }
                }
                if (badgeNone) {
                    badgeNone.style.display = (!isFullyPrepared && (preparedCount === 0 || total === 0)) ? 'inline-flex' : 'none';
                }
            };

            // بطاقة الطلب في القائمة
            document.querySelectorAll(`.order-card[data-order-id="${orderId}"]`).forEach(updateCardBadges);

            // بطاقة السوايب
            document.querySelectorAll(`.swipe-card-slide[data-order-id="${orderId}"]`).forEach(updateCardBadges);
        }

        function setOrderButtonsDisabled(orderId, disabled) {
            const card = document.querySelector(`.order-card[data-order-id="${orderId}"]`);
            if (!card) return;
            card.querySelectorAll('.action-buttons .btn').forEach(btn => {
                btn.disabled = disabled;
                btn.style.opacity = disabled ? '0.6' : '1';
                btn.style.cursor = disabled ? 'not-allowed' : 'pointer';
            });
        }

        async function rollbackLocalOrderUpdate(orderId, originalOrder) {
            document.getElementById('modalSheet')?.classList.remove('active');
            document.getElementById('modalOverlay')?.classList.remove('active');
            const restoredOrder = typeof structuredClone === 'function' ? structuredClone(originalOrder) : JSON.parse(JSON.stringify(originalOrder));
            const index = currentOrders.findIndex(item => String(item.id) === String(orderId));
            if (index !== -1) currentOrders[index] = restoredOrder;
            await updateOrderLocally(restoredOrder);
            applyFiltersAndRender();
            setOrderButtonsDisabled(orderId, false);
        }

        async function refreshOrderDue(orderId, buttonEl) {
            const order = currentOrders.find(o => String(o.id) === String(orderId));
            if (!order) { showToast('❌ الطلب غير موجود'); return; }
            if (!navigator.onLine) { showToast('📴 لا يمكن تحديث المستحق دون اتصال'); return; }
            if (!isMixedOrder(order)) { showToast('ℹ️ تحديث المستحق متاح للطلبات المختلطة فقط'); return; }

            const originalButtonHtml = buttonEl?.innerHTML || '🔄';
            if (buttonEl) {
                buttonEl.disabled = true;
                buttonEl.innerHTML = '<span class="sync-spinner"></span>';
                buttonEl.title = 'جاري تحديث المستحق';
            }

            try {
                const driverId = getDriverId();
                if (!driverId) throw new Error('لم يتم العثور على حساب المندوب');
                const data = await fetchDriverOrders(driverId, 1, '', 'all', 500);
                const serverOrder = (data.orders || []).find(item => String(item.id) === String(orderId));
                if (!serverOrder) throw new Error('تعذر العثور على الطلب في الخادم');
                const merged = await applyPendingOperationsToOrders([serverOrder]);
                const refreshedOrder = merged[0] || serverOrder;
                const index = currentOrders.findIndex(item => String(item.id) === String(orderId));
                if (index === -1) throw new Error('تعذر تحديث الطلب محلياً');
                currentOrders[index] = refreshedOrder;
                await updateOrderLocally(refreshedOrder);
                applyFiltersAndRender();
                showToast(`✅ تم تحديث المستحق للطلب #${orderId}`);
            } catch (err) {
                if (buttonEl) {
                    buttonEl.disabled = false;
                    buttonEl.innerHTML = originalButtonHtml;
                    buttonEl.title = 'تحديث المبلغ المستحق';
                }
                showToast('⚠️ تعذر تحديث المستحق: ' + (err.message || 'حاول مرة أخرى'));
            }
        }

        // =============================================================
        // دوال استخراج الروابط ومعاينة الملاحظات
        // =============================================================
        function extractAllUrls(text) {
            if (!text) return [];
            const urlPattern = /\b(https?:\/\/[^\s<>"'()]+|www\.[^\s<>"'()]+)/gi;
            const matches = text.match(urlPattern) || [];
            const urls = [];
            for (let u of matches) {
                let clean = u.trim().replace(/[.,;:!?)]+$/, '');
                if (clean.toLowerCase().startsWith('www.')) clean = 'https://' + clean;
                if (!urls.includes(clean)) urls.push(clean);
            }
            return urls;
        }

        function isMapUrl(url) {
            if (!url) return false;
            return /google\.com\/maps|maps\.google|maps\.apple|maps\.app\.goo\.gl|goo\.gl\/maps|waze\.com/i.test(url);
        }

        function detectMapLink(text) {
            if (!text) return null;
            const urls = extractAllUrls(text);
            return urls.find(u => isMapUrl(u)) || null;
        }

        function renderOrderNoteHtml(orderNote) {
            if (!orderNote) return '';
            const urls = extractAllUrls(orderNote);
            let cleanText = orderNote;
            urls.forEach(u => {
                cleanText = cleanText.split(u).join('');
                const withoutProto = u.replace(/^https?:\/\//i, '');
                cleanText = cleanText.split(withoutProto).join('');
            });
            cleanText = cleanText.trim();

            let buttonsHtml = '';
            if (urls.length > 0) {
                buttonsHtml = `
                    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:${cleanText ? '6px' : '0'};">
                        ${urls.map(url => {
                            const isMap = isMapUrl(url);
                            const label = isMap ? '🗺️ فتح رابط الموقع (الخريطة)' : '🔗 فتح الرابط المرفق';
                            const cls = isMap ? 'note-link-btn is-map' : 'note-link-btn';
                            return `
                                <a href="${url}" target="_blank" rel="noopener noreferrer" class="${cls}">
                                    <span>${label}</span> <span style="font-size:0.85em;">↗</span>
                                </a>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            if (!cleanText && urls.length === 0) return '';

            return `
                <div class="order-note">
                    ${cleanText ? `<div>📝 ${cleanText}</div>` : ''}
                    ${buttonsHtml}
                </div>
            `;
        }

function renderOrders(orders) {
    const container = document.getElementById('ordersList');
    if (!container) return;

    const driverId = getDriverId();
    if (driverId) {
        orders = orders.filter(o => o.driver_id == driverId);
    }

    // --- التعديل الذكي: إخفاء طلبات الأيام القادمة ---
    const now = new Date();
    const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999).getTime();

    orders = orders.filter(o => {
        const rawDate = o.order_date || o.created_at;
        if (!rawDate) return true;
        const orderTime = new Date(rawDate.replace(' ', 'T') + 'Z').getTime();
        return orderTime <= endOfToday;
    });
    // ---------------------------------------------

    if (!orders || orders.length === 0) {
        container.innerHTML = `<div class="empty-state"><span class="empty-icon">📭</span><span>لا توجد طلبات اليوم تطابق الفلتر</span></div>`;
        return;
    }

    // ترتيب الطلبات حسب التاريخ والوقت (الأحدث أولاً)
    const sortedOrders = [...orders].sort((a, b) => {
        const dateA = new Date((a.order_date || a.created_at || '').replace(' ', 'T') + 'Z').getTime() || 0;
        const dateB = new Date((b.order_date || b.created_at || '').replace(' ', 'T') + 'Z').getTime() || 0;
        return dateB - dateA;
    });

    let html = '';
    sortedOrders.forEach(order => {
        const isPrepaid = isPrepaidOrder(order);
        const isMixed = isMixedOrder(order);
        const deliveryFeePayment = order.delivery_fee_payment || 'مع الطلب';
        const isCompleted = order.status === 'تم التسليم';
        const isFailed = order.status === 'فشل التسليم';
        const isReturned = order.status === 'مرتجع جزئي' || order.status === 'مرتجع كلي';
        const isCancelled = order.status === 'ملغي';
        const cardClass = isCompleted ? 'completed' : (isFailed ? 'failed' : (isReturned ? 'returned' : ''));
        const statusText = order.status || 'جديد';
        const items = [...(order.items || [])].sort((a, b) => (b.id || 0) - (a.id || 0));
        
        const dueAmount = getOrderDueAmount(order);

        // معالجة وتنسيق تاريخ الطلب لعرضه للمندوب
        let formattedDate = 'تاريخ غير محدد';

        if (rawDate) {
            const dateObj = new Date(rawDate.replace(' ', 'T') + 'Z');
            formattedDate = dateObj.toLocaleString('ar-SA', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hour12: true
            });
        }

        const orderNote = order.notes || order.note || '';
        const addressText = order.customer_address || '';
        const combinedText = addressText + ' ' + orderNote;
        
        // --- استخراج رابط الخريطة وأي روابط مرفقة ---
        const mapUrl = detectMapLink(combinedText);
        const allUrls = extractAllUrls(combinedText);
        let linkButtonsHtml = '';

        // --- معالجة الأرقام المتعددة ---
        let phones = [];

                        <a href="tel:${cleanPhone}" class="call" style="flex:1; text-align:center;">📞 ${p}</a>

        // -------------------------------

        // معالجة الملاحظات وإظهار زر فتح الرابط فوراً إذا وجد أي رابط بالملاحظات
        const noteHtml = renderOrderNoteHtml(orderNote);

                itemsBadgeHtml = `<span class="badge-items-count badge-items-many" title="طلب متعدد الأصناف أكثر من 3">📦 ${items.length} أصناف <span class="remaining-items-pill">متبقي ${remainingCount}</span></span>`;

                            <span>⚠️ متبقي ${remainingCount} أصناف أخرى لم تُعرض (إجمالي ${items.length})</span>
                            <span style="font-size:0.7rem; opacity:0.95;">اضغط هنا لعرض الفاتورة بالكامل 📄</span>
                        </button>
                    </td>

            `;

        } else if (isFinished) {
            actionButtonsHtml = `<div style="text-align:center; color:var(--text-muted); font-size:0.75rem; padding:6px;">✔️ تم الانتهاء</div>`;
        } else {
            actionButtonsHtml = `
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="openDeliveryModal('${order.id}', 'تم التوصيل')">✅ تم</button>
                    <button class="btn btn-danger" onclick="openDeliveryModal('${order.id}', 'فشل')">❌ فشل</button>
                </div>
            `;
        }

        let returnInfoHtml = '';
        if (isReturned) {
            const refundAmount = parseFloat(order.total_refund || 0);
            const deliveryFeeReturn = parseFloat(order.return_fee || 0);
            const feeType = order.return_fee_type || 'shop';
            let customerRefund = refundAmount;
            if (feeType === 'customer') customerRefund = Math.max(0, refundAmount - deliveryFeeReturn);
            returnInfoHtml = `

                    <span>🔄 مرتجع: ${refundAmount.toFixed(2)} ريال</span>

        async function showInvoice(orderId) {
            let order = currentOrders.find(o => String(o.id) === String(orderId));

            try {
                history.pushState({ modal: 'invoice', orderId: String(orderId) }, '');
            } catch (e) {}

            const sheet = document.getElementById('invoiceSheet');
            const overlay = document.getElementById('invoiceOverlay');
            const content = document.getElementById('invoiceContent');
            if (!sheet || !overlay || !content) return;

            content.innerHTML = `<div class="loading-state">⏳ جاري تحميل تفاصيل الفاتورة #${orderId}...</div>`;
            sheet.classList.add('active');
            overlay.classList.add('active');

            if (!order || !order.items || order.items.length === 0) {
                if (navigator.onLine) {
                    try {
                        const data = await apiCall(`/orders/${orderId}`, 'GET');
                        if (data && data.order) {
                            order = data.order;
                            const idx = currentOrders.findIndex(o => String(o.id) === String(orderId));
                            if (idx !== -1) currentOrders[idx] = { ...currentOrders[idx], ...order };
                            else currentOrders.push(order);
                        }
                    } catch (e) {
                        console.warn('تعذر جلب تفاصيل الفاتورة من السيرفر:', e);
                    }
                }
            }

            if (!order) {
                content.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-icon">⚠️</span>
                        <span>تعذر العثور على بيانات الفاتورة #${orderId}</span>
                        <button class="btn btn-primary" style="margin-top:14px; width:100%;" onclick="closeInvoiceModal()">رجوع</button>
                    </div>`;
                return;
            }

            const items = order.items || [];
            const sortedItems = [...items].sort((a, b) => (b.id || 0) - (a.id || 0));

            let rawDate = order.order_date || order.created_at || '';
            let formattedDate = 'غير محدد';
            if (rawDate) {
                const dateObj = new Date(rawDate.replace(' ', 'T') + 'Z');
                formattedDate = dateObj.toLocaleString('ar-SA', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', hour12: true

            const isPrepaid = isPrepaidOrder(order);
            const isMixed = isMixedOrder(order);

            const totalAmount = parseFloat(order.total_amount || 0);

                phones = order.customer_phone.split(/[,-]/).map(p => p.trim()).filter(Boolean);
            }

            let phoneButtonsHtml = '';
            if (phones.length > 0) {

                            <a href="https://wa.me/${cleanPhone}" target="_blank" class="btn whatsapp" style="flex:1; text-align:center; padding:8px 10px; font-size:0.8rem; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:4px; background:#dcfce7; color:#15803d; border-radius:8px;">💬 واتساب</a>

                    }

            }

            const orderNote = order.notes || order.note || '';
            const addressText = order.customer_address || 'لا يوجد عنوان محدد';
            const allUrls = extractAllUrls(addressText + ' ' + orderNote);
            const mapUrl = detectMapLink(addressText + ' ' + orderNote);
            let mapButtonHtml = '';
            if (mapUrl) {
                mapButtonHtml += `<a href="${mapUrl}" target="_blank" class="btn" style="flex:1; text-align:center; padding:8px 10px; font-size:0.8rem; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:4px; background:#fef3c7; color:#b45309; border-radius:8px;">🗺️ فتح الموقع على الخريطة</a>`;

            allUrls.filter(u => u !== mapUrl).forEach(otherUrl => {
                mapButtonHtml += `<a href="${otherUrl}" target="_blank" class="btn" style="flex:1; text-align:center; padding:8px 10px; font-size:0.8rem; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:4px; background:#eff6ff; color:#1d4ed8; border-radius:8px;">🔗 فتح الرابط المرفق</a>`;

            let tableHtml = '';
            const preparedCountInv = getPreparedCount(order.id);
            const totalItemsInv = sortedItems.length;
            const isFullyPreparedInv = totalItemsInv > 0 && preparedCountInv >= totalItemsInv;
            const progressPercent = totalItemsInv > 0 ? Math.round((preparedCountInv / totalItemsInv) * 100) : 0;

            if (sortedItems.length > 0) {
                const rowsHtml = sortedItems.map(item => {

                            <td style="padding:8px; border-bottom:1px solid var(--border); color:var(--text-muted); font-size:0.75rem;">${item.note || item.notes || item.product_note || '-'}</td>
                        </tr>
                    `;
                }).join('');

                tableHtml = `
                    <table class="invoice-items-table" style="width:100%; margin:10px 0;">
                        <thead>
                            <tr style="background:var(--surface-secondary);">
                                <th style="padding:8px; text-align:center; width:44px;">✓</th>
                                <th style="padding:8px; text-align:right;">المنتج</th>
                                <th style="padding:8px; text-align:center;">الكمية</th>
                                <th style="padding:8px; text-align:center;">السعر</th>
                                <th style="padding:8px; text-align:center;">الإجمالي</th>
                                <th style="padding:8px; text-align:right;">ملاحظة</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                `;
            } else {

            }

            let quickActionsHtml = '';
            if (!isFinished) {
                quickActionsHtml = `
                    <div style="display:flex; gap:10px; margin-top:16px;">
                        <button class="btn btn-success" style="flex:1; padding:12px; font-weight:700;" onclick="closeInvoiceModal(false); openDeliveryModal('${order.id}', 'تم التوصيل');">✅ تم التوصيل</button>
                        <button class="btn btn-danger" style="flex:1; padding:12px; font-weight:700;" onclick="closeInvoiceModal(false); openDeliveryModal('${order.id}', 'فشل');">❌ فشل التسليم</button>
                    </div>
                `;
            }

            content.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:14px;">
                    <h3 style="margin:0; font-size:1.15rem; color:var(--text-primary);">📄 فاتورة الطلب #${order.id}</h3>
                    <span class="order-status-badge badge-progress" style="font-size:0.75rem; padding:4px 10px;">${order.status || 'جديد'}</span>
                </div>

                <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:12px; display:flex; align-items:center; gap:6px;">
                    <span>🕒 تاريخ الطلب:</span> <strong>${formattedDate}</strong>
                </div>

                <!-- بطاقة العميل والتوصيل -->

                    <div style="margin-bottom:6px;"><strong>📍 العنوان:</strong> ${addressText}</div>
                    ${renderOrderNoteHtml(orderNote)}
                    ${renderInvoiceOrderImgs(order)}

                        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;">

        let ignoreNextPopState = false;

                ignoreNextPopState = false;
            }, 600);
        }

            document.getElementById('invoiceSheet')?.classList.remove('active');
            document.getElementById('invoiceOverlay')?.classList.remove('active');

                setIgnoreNextPopState();
                try { history.back(); } catch (e) { ignoreNextPopState = false; }

            const overlay = document.getElementById('modalOverlay');

            const content = document.getElementById('modalContent');
            if (!overlay || !sheet || !content) return;

            content.innerHTML = `
                <h3>🔄 تم تحديث طلب</h3>

                    <button class="btn btn-primary" onclick="closeModalSheet(false); viewOrder('${orderId}');">🔍 عرض الطلب</button>
                    <button class="btn btn-outline" onclick="closeModalSheet();">⏳ لاحقاً</button>
                </div>
            `;
            sheet.classList.add('active');
            overlay.classList.add('active');
        }

        function viewOrder(orderId) {
            const order = currentOrders.find(o => String(o.id) === String(orderId));
            if (order) {
                showInvoice(orderId);
            } else {
                loadOrderDetails(orderId);
            }
        }

        async function loadOrderDetails(orderId) {
            try {
                const data = await apiCall(`/orders/${orderId}`, 'GET');
                if (data.order) {
                    const existing = currentOrders.find(o => String(o.id) === String(data.order.id));
                    if (existing) Object.assign(existing, data.order);
                    else currentOrders.push(data.order);
                    showInvoice(data.order.id);
                } else {
                    showToast('❌ لم نجد الطلب');
                }
            } catch (e) {
                showToast('❌ خطأ في تحميل الطلب');
            }
        }

                        <button class="btn btn-sm btn-outline" onclick="loadReturnRequests()">🔄 تحديث</button>
                    </div>
                </div>
            `;
            requests.forEach(req => {
                const items = req.items || [];
                const totalRefund = parseFloat(req.total_refund) || 0;

                const statusText = req.status || 'pending';

                let customerRefund = totalRefund;
                let feeDescription = '';
                if (deliveryFeeType === 'customer') {
                    customerRefund = Math.max(0, totalRefund - deliveryFee);
                    feeDescription = `(تُخصم من العميل: ${deliveryFee.toFixed(2)} ريال)`;
                } else if (deliveryFeeType === 'shop') {
                    feeDescription = `(يتحملها المحل، تُضاف للمندوب)`;
                } else {
                    feeDescription = `(بدون رسوم)`;
                }

                let itemsHtml = '';
                items.forEach(item => {
                    itemsHtml += `<tr><td>${item.product_name || item.product_id}</td><td>${item.quantity}</td><td>${item.unit_price}</td><td>${item.line_total}</td></tr>`;

                html += `
                    <div class="return-card">
                        <div class="return-header">
                            <span class="return-id">🔄 طلب إرجاع #${req.return_id || req.id}</span>

                            <div><strong>📍 العنوان:</strong> ${req.customer_address || 'لا يوجد'}</div>
                            <div><strong>📞 الهاتف:</strong> ${req.customer_phone || ''}</div>
                        </div>
                        <div class="return-items-preview">
                            <table><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead>
                            <tbody>${itemsHtml}</tbody></table>
