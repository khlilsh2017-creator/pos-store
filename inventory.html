<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📦 إدارة المخزون – نظام ابن المختار</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="date-utils.js"></script>
    <script src="document-utils.js"></script>
  <style>
    :root {
      --primary: #1a56db;
      --primary-hover: #1e40af;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --info: #0ea5e9;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      direction: rtl;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      background: white;
      padding: 18px 24px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: white;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--bg); }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }
    .btn-warning { background: var(--warning); color: #1e293b; }
    .btn-warning:hover { background: #d97706; }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    /* شريط المعلومات (الجرد) */
    .info-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 24px 40px;
      background: #f8fafc;
      padding: 14px 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      align-items: center;
      border: 1px solid var(--border);
    }
    .info-bar .field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }
    .info-bar .field i { color: var(--muted); width: 20px; }
    .info-bar .field input,
    .info-bar .field select {
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 14px;
      background: white;
      outline: none;
      transition: 0.15s;
    }
    .info-bar .field input:focus,
    .info-bar .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,86,219,0.15);
    }
    .info-bar .badge {
      background: #e9edf4;
      padding: 4px 16px;
      border-radius: 30px;
      font-size: 13px;
      color: #1e293b;
    }
    .info-bar .badge i { margin-left: 6px; }

    /* شريط البحث والمسح */
    .scan-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: #f1f5f9;
      padding: 14px 20px;
      border-radius: 60px;
      align-items: center;
      border: 1px solid var(--border);
    }
    .scan-bar input {
      flex: 1;
      min-width: 200px;
      border: none;
      background: transparent;
      padding: 8px 4px;
      font-size: 16px;
      outline: none;
    }
    .scan-bar input::placeholder { color: #94a3b8; }
    .scan-bar button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 40px;
      padding: 8px 24px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scan-bar button:hover { background: var(--primary-hover); }
    .scan-bar .barcode-icon { font-size: 24px; color: #475569; }
    .scan-bar .search-hint { font-size: 13px; color: var(--muted); margin-right: auto; }

    /* الجدول */
    .table-wrap {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 900px;
    }
    th {
      background: #f8fafc;
      color: #1e293b;
      font-weight: 600;
      padding: 14px 12px;
      text-align: center;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:hover td { background: #fafcff; }
    .product-name {
      font-weight: 500;
      text-align: right;
      cursor: pointer;
    }
    .product-name .sku { color: var(--muted); font-size: 12px; }
    .qty-input {
      width: 90px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 30px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      background: white;
      transition: 0.15s;
    }
    .qty-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
      outline: none;
    }
    .qty-input.counted { background: #ecfdf5; border-color: var(--success); }
    .status-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.pending { background: #fef9c3; color: #854d0e; }
    .status-badge.done { background: #dcfce7; color: #166534; }
    .status-badge.missing { background: #fee2e2; color: #991b1b; }
    .status-toggle {
      cursor: pointer;
      user-select: none;
      font-size: 20px;
    }
    .status-toggle .fa-circle { color: #cbd5e1; }
    .status-toggle .fa-circle-check { color: var(--success); }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-in { background: #dcfce7; color: #166534; }
    .badge-out { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #dbeafe; color: #1e40af; }

    /* تفاصيل الحركة */
    .movement-detail {
      background: #f8fafc;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      border-right: 4px solid var(--primary);
    }
    .movement-detail .title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .movement-detail .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .movement-detail .meta span i { margin-left: 4px; }

    /* التذيير */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-bar .stats {
      display: flex;
      gap: 28px;
      font-size: 14px;
      color: #334155;
    }
    .footer-bar .stats span { font-weight: 700; color: #0f172a; }

    /* ترقيم الصفحات */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .pagination button {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .pagination button:hover { background: var(--bg); }
    .pagination .active-page {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .empty { text-align: center; padding: 30px; color: var(--muted); font-size: 1.1rem; }
    .text-muted { color: var(--muted); }
    .mt-10 { margin-top: 10px; }
    .mb-10 { margin-bottom: 10px; }
    .flex-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
    .flex-1 { flex: 1; min-width: 150px; }

    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; border-radius: 0; padding: 20px; }
      .header-actions, .scan-bar, .footer-bar .actions, .no-print { display: none !important; }
      .info-bar { background: #f8fafc; border: 1px solid #ccc; }
      table { font-size: 12px; }
      th, td { padding: 6px 10px; }
      .qty-input { border: 1px solid #999; background: white !important; }
      .status-badge { border: 1px solid #ccc; }
      .footer-bar { border-top: 1px solid #ccc; }
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; align-items: stretch; }
      .scan-bar { border-radius: 20px; flex-wrap: wrap; }
      .scan-bar input { min-width: 120px; }
      .info-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bar { flex-direction: column; align-items: stretch; }
      .footer-bar .stats { justify-content: space-around; }
    }

    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
    <script src="permissions.js"></script>
  <script src="number-utils.js"></script>
    <script src="/offline-sync.js"></script>
<link rel="stylesheet" href="sidebar-v4.css" />
</head>
<body>
<div id="sidebar-container"></div>

<div class="container" id="inventoryApp">
  <!-- رأس الصفحة -->
  <div class="header">
    <h1><i class="fas fa-boxes"></i> إدارة المخزون</h1>
    <div class="header-actions no-print">
      <button class="btn-outline btn-sm" onclick="refreshData()"><i class="fas fa-sync-alt"></i> تحديث</button>
      <button class="btn-outline btn-sm" onclick="markAllPending()"><i class="fas fa-flag"></i> تعيين غير مجرد</button>
      <button class="btn-success btn-sm" onclick="saveAdjustment()"><i class="fas fa-save"></i> حفظ الجرد</button>
      <button class="btn-primary btn-sm" onclick="window.POSDocs ? POSDocs.printReport(document.getElementById('inventoryApp'), {title:document.title}).catch(e => alert(e.message)) : window.print()"><i class="fas fa-print"></i> طباعة</button>
      <button class="btn-outline btn-sm" onclick="printManualInventorySheet()"><i class="fas fa-clipboard-list"></i> طباعة ورقة جرد يدوي</button>
    </div>
  </div>

  <!-- شريط معلومات الجرد -->
  <div class="info-bar">
    <div class="field"><i class="fas fa-calendar-day"></i> تاريخ الجرد <input type="date" id="inventoryDate" /></div>
    <div class="field"><i class="fas fa-user-tie"></i> المسؤول <input type="text" id="inventoryOfficer" placeholder="اسم المسؤول" style="min-width:140px;" /></div>
    <div class="field"><i class="fas fa-tag"></i> عدد المنتجات <span class="badge" id="totalProductsBadge">0</span></div>
    <div class="field"><i class="fas fa-check-circle" style="color:#22c55e;"></i> مجرد <span class="badge" id="countedBadge">0</span></div>
    <div class="field"><i class="fas fa-clock" style="color:#eab308;"></i> لم يُجرد <span class="badge" id="pendingBadge">0</span></div>
  </div>

  <!-- شريط البحث والمسح -->
  <div class="scan-bar no-print">
    <i class="fas fa-barcode barcode-icon"></i>
    <input type="text" id="barcodeInput" placeholder="امسح الباركود أو ابحث باسم المنتج..." />
    <button onclick="searchProduct()"><i class="fas fa-search"></i> بحث</button>
    <button onclick="clearSearch()" style="background:#e2e8f0;color:#1e293b;"><i class="fas fa-times"></i> إلغاء</button>
    <span class="search-hint"><i class="fas fa-info-circle"></i> المسح الضوئي يحدد المنتج ويركز على حقل الكمية</span>
  </div>

  <!-- الجدول -->
  <div class="card">
    <div class="table-wrap" id="tableWrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th style="min-width:130px;">المنتج</th>
            <th>الباركود</th>
            <th>المخزون الحالي</th>
            <th>الكمية المجردة</th>
            <th>الفرق</th>
            <th>الحالة</th>
            <th>لم يُجرد</th>
            <th>الحركة</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody">
          <tr><td colspan="9" class="loading">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="paginationControls"></div>
  </div>

  <!-- تفاصيل حركة المنتج -->
  <div id="movementDetails" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h3 id="movementProductTitle"><i class="fas fa-history"></i> سجل حركة المنتج</h3>
      <button class="btn btn-outline btn-sm" onclick="closeMovementDetails()"><i class="fas fa-times"></i> إغلاق</button>
    </div>
    <div id="movementList" class="mt-10"></div>
  </div>

  <!-- تذيير -->
  <div class="footer-bar">
    <div class="stats">
      <div>📦 إجمالي القطع: <span id="totalQtySpan">0</span></div>
      <div>📊 صافي الفرق: <span id="netDiffSpan">0</span></div>
      <div>💰 قيمة الفرق: <span id="netDiffValueSpan">0</span> ريال</div>
    </div>
    <div class="actions no-print">
      <button class="btn-outline btn-sm" onclick="resetAllQuantities()" style="color:#b91c1c;border-color:#fca5a5;"><i class="fas fa-undo-alt"></i> إعادة تعيين</button>
    </div>
  </div>
</div>

<script>
  (function() {
    'use strict';

    const API_BASE = 'https://api.ibnalmukhtar.com'; // فارغ لاستخدام نفس الـ origin
    let token = localStorage.getItem('pos_token') || '';
    if (!token) {
      // يمكن توجيه المستخدم لتسجيل الدخول
      document.body.innerHTML = '<div style="text-align:center;padding:50px;"><h2>الرجاء تسجيل الدخول أولاً</h2><button class="btn" onclick="window.location.href=\'index.html\'">تسجيل الدخول</button></div>';
      return;
    }

    // الحالة العامة
    let products = [];
    let adjustments = {};
    let countedStatus = {};
    let searchTerm = '';
    let currentPage = 1;
    const pageSize = 20;
    let productsTotal = 0;
    let selectedProductId = null;

    // عناصر DOM
    const tbody = document.getElementById('inventoryTableBody');
    const totalProductsBadge = document.getElementById('totalProductsBadge');
    const countedBadge = document.getElementById('countedBadge');
    const pendingBadge = document.getElementById('pendingBadge');
    const totalQtySpan = document.getElementById('totalQtySpan');
    const netDiffSpan = document.getElementById('netDiffSpan');
    const netDiffValueSpan = document.getElementById('netDiffValueSpan');
    const barcodeInput = document.getElementById('barcodeInput');
    const paginationControls = document.getElementById('paginationControls');

    // دوال مساعدة
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    // جلب المنتجات مع الترقيم
    async function fetchProducts(page = 1) {
      const search = searchTerm.trim() || document.getElementById('barcodeInput').value.trim();
      const limit = pageSize;
      const offset = (page - 1) * limit;
      let url = `${API_BASE}/products?limit=${limit}&page=${page}&sort=name`;
      if (search) url += `&search=${encodeURIComponent(search)}`;

      try {
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('فشل جلب المنتجات');
        const data = await res.json();
        products = data.products || [];
        productsTotal = Number(data.total || products.length);

        // تهيئة الحالات المؤقتة للمنتجات الجديدة
        products.forEach(p => {
          if (!(p.id in adjustments)) {
            adjustments[p.id] = parseFloat(p.stock_quantity) || 0;
          }
          if (!(p.id in countedStatus)) {
            countedStatus[p.id] = false;
          }
        });

        renderTable();
        updateStats();
        renderPagination(page, Math.ceil(productsTotal / pageSize) || 1);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted">خطأ في التحميل: ${err.message}</td></tr>`;
        console.error(err);
      }
    }

    // عرض الجدول
    function renderTable() {
      const filtered = products.filter(p => {
        const nameMatch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
        const barcodeMatch = p.barcode && p.barcode.toLowerCase().includes(searchTerm.toLowerCase());
        return nameMatch || barcodeMatch;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="empty">لا توجد منتجات مطابقة للبحث</td></tr>`;
        return;
      }

      let html = '';
      filtered.forEach((p, idx) => {
        const currentQty = parseFloat(p.stock_quantity) || 0;
        const newQty = (adjustments[p.id] !== undefined) ? adjustments[p.id] : currentQty;
        const diff = newQty - currentQty;
        const isCounted = countedStatus[p.id] || false;
        const isPending = !isCounted;
        const isActive = p.id === selectedProductId;

        html += `
          <tr class="fade-in ${isActive ? 'active' : ''}" style="${isActive ? 'background:#e0f2fe;' : ''}">
            <td>${idx + 1}</td>
            <td class="product-name" onclick="selectProduct(${p.id})">
              ${escapeHtml(p.name)}
              <div class="sku">${escapeHtml(p.product_code || '')}</div>
            </td>
            <td>${escapeHtml(p.barcode || '-')}</td>
            <td><strong>${currentQty}</strong></td>
            <td>
              <input type="number" class="qty-input ${isCounted ? 'counted' : ''}"
                     id="qty_${p.id}" value="${newQty}" step="0.01"
                     min="0" onchange="onQtyChange(${p.id}, this.value)"
                     onfocus="this.select()" />
            </td>
            <td style="color:${diff === 0 ? '#64748b' : (diff > 0 ? '#16a34a' : '#dc2626')}; font-weight:600;">
              ${diff === 0 ? '0' : (diff > 0 ? '+' : '') + diff.toFixed(2)}
            </td>
            <td>
              <span class="status-badge ${isPending ? 'pending' : 'done'}">
                ${isPending ? '⏳ لم يُجرد' : '✅ مجرد'}
              </span>
            </td>
            <td>
              <span class="status-toggle" onclick="togglePending(${p.id})" title="تبديل حالة عدم الجرد">
                <i class="fas ${isPending ? 'fa-circle' : 'fa-circle-check'}"></i>
              </span>
            </td>
            <td>
              <button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); viewMovements(${p.id})">
                <i class="fas fa-eye"></i>
              </button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;

      if (barcodeInput.value.trim()) {
        const firstInput = tbody.querySelector('input.qty-input');
        if (firstInput) setTimeout(() => firstInput.focus(), 100);
      }
    }

    // ترقيم الصفحات
    function renderPagination(current, totalPages) {
      if (totalPages <= 1) {
        paginationControls.innerHTML = '';
        return;
      }
      let html = `<button onclick="changePage(${current-1})" ${current<=1?'disabled':''}>السابق</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button onclick="changePage(${i})" class="${i===current?'active-page':''}">${i}</button>`;
      }
      html += `<button onclick="changePage(${current+1})" ${current>=totalPages?'disabled':''}>التالي</button>`;
      paginationControls.innerHTML = html;
    }

    function changePage(page) {
      if (page < 1) return;
      currentPage = page;
      fetchProducts(page);
    }

    // تحديث الإحصائيات
    function updateStats() {
      const total = products.length;
      let counted = 0, pending = 0;
      let totalQty = 0, netDiff = 0, netValue = 0;

      products.forEach(p => {
        const current = parseFloat(p.stock_quantity) || 0;
        const newQty = (adjustments[p.id] !== undefined) ? adjustments[p.id] : current;
        const diff = newQty - current;
        totalQty += current;
        netDiff += diff;
        netValue += diff * (parseFloat(p.cost) || 0);
        if (countedStatus[p.id]) counted++;
        else pending++;
      });

      totalProductsBadge.textContent = total;
      countedBadge.textContent = counted;
      pendingBadge.textContent = pending;
      totalQtySpan.textContent = totalQty.toFixed(2);
      netDiffSpan.textContent = netDiff.toFixed(2);
      netDiffValueSpan.textContent = netValue.toFixed(2);
    }

    // دوال التفاعل
    window.onQtyChange = function(productId, value) {
      const num = parseFloat(value);
      if (!isNaN(num) && num >= 0) {
        adjustments[productId] = num;
        countedStatus[productId] = true;
        renderTable();
      } else {
        const current = parseFloat(products.find(p => p.id === productId)?.stock_quantity) || 0;
        adjustments[productId] = current;
        countedStatus[productId] = false;
        renderTable();
      }
    };

    window.togglePending = function(productId) {
      countedStatus[productId] = !countedStatus[productId];
      if (countedStatus[productId]) {
        const input = document.getElementById(`qty_${productId}`);
        if (input) {
          const val = parseFloat(input.value);
          if (!isNaN(val) && val >= 0) adjustments[productId] = val;
        }
      } else {
        const p = products.find(pr => pr.id === productId);
        if (p) adjustments[productId] = parseFloat(p.stock_quantity) || 0;
      }
      renderTable();
    };

    window.markAllPending = function() {
      products.forEach(p => {
        countedStatus[p.id] = false;
        adjustments[p.id] = parseFloat(p.stock_quantity) || 0;
      });
      renderTable();
    };

    window.resetAllQuantities = function() {
      if (!confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع الكميات إلى المخزون الحالي؟')) return;
      products.forEach(p => {
        adjustments[p.id] = parseFloat(p.stock_quantity) || 0;
        countedStatus[p.id] = false;
      });
      renderTable();
    };

    window.printManualInventorySheet = async function() {
      const pageLimit = 100;
      const allProducts = [];
      let page = 1;
      let total = 0;
      try {
        do {
          const url = `${API_BASE}/products?limit=${pageLimit}&page=${page}&sort=name`;
          const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
          if (!res.ok) throw new Error('فشل تحميل جميع المنتجات للطباعة');
          const data = await res.json();
          const rows = Array.isArray(data.products) ? data.products : [];
          allProducts.push(...rows);
          total = Number(data.total || allProducts.length);
          if (!rows.length) break;
          page += 1;
        } while (allProducts.length < total);
        if (!allProducts.length) return alert('لا توجد منتجات لطباعة ورقة الجرد');
        const sheet = document.createElement('section');
        sheet.innerHTML = `<h2 style="margin:0 0 6px">ورقة الجرد اليدوي</h2><div style="display:flex;justify-content:space-between;gap:20px;margin-bottom:10px"><span>تاريخ الجرد: ${escapeHtml(document.getElementById('inventoryDate').value || new Date().toISOString().slice(0,10))}</span><span>المسؤول: ${escapeHtml(document.getElementById('inventoryOfficer').value || '........................')}</span></div><table><thead><tr><th>#</th><th>المنتج</th><th>الباركود</th><th>الرصيد بالنظام</th><th>الكمية المعدودة</th><th>الفرق</th><th>ملاحظات</th></tr></thead><tbody>${allProducts.map((p, index) => `<tr><td>${index + 1}</td><td>${escapeHtml(p.name || '-')}</td><td dir="ltr">${escapeHtml(p.barcode || p.product_code || '-')}</td><td>${Number(p.stock_quantity || 0)}</td><td style="height:30px"></td><td></td><td></td></tr>`).join('')}</tbody></table><p style="margin-top:10px">إجمالي المنتجات: ${allProducts.length}</p>`;
        document.body.appendChild(sheet);
        if (!window.POSDocs) throw new Error('محرك الطباعة غير متاح');
        await POSDocs.printReport(sheet, { title: 'ورقة الجرد اليدوي' });
        setTimeout(() => sheet.remove(), 1200);
      } catch (error) {
        alert(error.message || 'تعذر تجهيز ورقة الجرد اليدوي');
      }
    };

    window.searchProduct = function() {
      searchTerm = barcodeInput.value.trim();
      currentPage = 1;
      fetchProducts(1);
    };

    window.clearSearch = function() {
      barcodeInput.value = '';
      searchTerm = '';
      currentPage = 1;
      fetchProducts(1);
    };

    // المسح الضوئي
    barcodeInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const code = this.value.trim();
        if (!code) { searchProduct(); return; }
        const found = products.find(p => p.barcode === code);
        if (found) {
          adjustments[found.id] = parseFloat(found.stock_quantity) || 0;
          countedStatus[found.id] = true;
          searchTerm = '';
          this.value = '';
          fetchProducts(currentPage);
          const input = document.getElementById(`qty_${found.id}`);
          if (input) setTimeout(() => input.focus(), 100);
        } else {
          searchProduct();
        }
      }
    });

    // تحديد منتج
    window.selectProduct = function(productId) {
      selectedProductId = productId;
      renderTable();
    };

    // عرض حركة المنتج
    window.viewMovements = async function(productId) {
      const detailsDiv = document.getElementById('movementDetails');
      const listDiv = document.getElementById('movementList');
      const titleEl = document.getElementById('movementProductTitle');

      const product = products.find(p => p.id === productId);
      titleEl.innerHTML = `<i class="fas fa-history"></i> سجل حركة المنتج: ${escapeHtml(product ? product.name : '#' + productId)}`;
      detailsDiv.style.display = 'block';
      listDiv.innerHTML = '<div class="loading">جاري تحميل الحركة...</div>';

      try {
        const res = await fetch(`${API_BASE}/products/${productId}/stock-movements`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('فشل جلب الحركة');
        const data = await res.json();
        const movements = data.movements || [];
        if (movements.length === 0) {
          listDiv.innerHTML = '<div class="empty">لا توجد حركة مخزون لهذا المنتج</div>';
          return;
        }

        let html = '';
        movements.forEach(m => {
          const change = m.quantity_change || 0;
          const typeClass = change > 0 ? 'badge-in' : (change < 0 ? 'badge-out' : 'badge-info');
          const typeLabel = change > 0 ? 'دخول' : (change < 0 ? 'خروج' : 'تعديل');
          const refTypeMap = {
            'sale': 'بيع', 'cancel_sale': 'إلغاء بيع', 'return_sale': 'إرجاع بيع',
            'full_return_sale': 'مرتجع كلي', 'undo_cancel_sale': 'عكس إلغاء بيع',
            'undo_return_sale': 'عكس إرجاع', 'purchase': 'شراء', 'cancel_purchase': 'إلغاء شراء',
            'return_purchase': 'إرجاع شراء', 'undo_cancel_purchase': 'عكس إلغاء شراء',
            'online_order': 'طلب إنترنت', 'update_online_order': 'تحديث طلب إنترنت',
            'update_online_order_revert': 'عكس تحديث طلب', 'cancel_online_order': 'إلغاء طلب إنترنت',
            'delivery_failed': 'فشل توصيل', 'online_order_return': 'إرجاع طلب إنترنت',
            'sale_update': 'تحديث فاتورة', 'sale_update_revert': 'عكس تحديث فاتورة',
            'inventory_adjust': 'تسوية جرد', 'initialization': 'تأسيس النظام',
            'cancel_sale_cogs': 'إلغاء تكلفة بيع', 'undo_cancel_sale_cogs': 'عكس إلغاء تكلفة'
          };
          const refLabel = refTypeMap[m.reference_type] || m.reference_type || 'غير معروف';
          html += `
            <div class="movement-detail">
              <div class="title">
                <span class="badge ${typeClass}">${typeLabel}</span>
                <span>${change > 0 ? '+' : ''}${change}</span>
                <span style="font-weight:400;font-size:0.9rem;color:var(--muted);margin-right:10px;">
                  ${m.old_quantity} → ${m.new_quantity}
                </span>
                ${m.supplier_name ? `<span class="badge badge-info" style="font-size:0.7rem;">${escapeHtml(m.supplier_name)}</span>` : ''}
              </div>
              <div class="meta">
                <span><i class="far fa-calendar-alt"></i> ${posDateTime(m.created_at)}</span>
                <span><i class="fas fa-tag"></i> ${escapeHtml(refLabel)} ${m.reference_id ? '#'+escapeHtml(m.reference_id) : ''}</span>
                ${m.note ? `<span><i class="fas fa-pencil-alt"></i> ${escapeHtml(m.note)}</span>` : ''}
                ${m.created_by_name ? `<span><i class="fas fa-user"></i> ${escapeHtml(m.created_by_name)}</span>` : ''}
              </div>
            </div>
          `;
        });
        listDiv.innerHTML = html;
      } catch (e) {
        listDiv.innerHTML = `<div class="empty">خطأ: ${e.message}</div>`;
        console.error(e);
      }
      detailsDiv.scrollIntoView({ behavior: 'smooth' });
    };

    window.closeMovementDetails = function() {
      document.getElementById('movementDetails').style.display = 'none';
      selectedProductId = null;
      renderTable();
    };

    // حفظ الجرد
    window.saveAdjustment = async function() {
      const items = [];
      let hasChanges = false;
      products.forEach(p => {
        const current = parseFloat(p.stock_quantity) || 0;
        const newQty = (adjustments[p.id] !== undefined) ? adjustments[p.id] : current;
        if (Math.abs(newQty - current) > 0.001 || countedStatus[p.id]) {
          items.push({ product_id: p.id, new_quantity: newQty });
          hasChanges = true;
        }
      });

      if (!hasChanges) {
        alert('ℹ️ لا توجد تغييرات لحفظها.');
        return;
      }

      const officer = document.getElementById('inventoryOfficer').value.trim() || 'غير محدد';
      const date = document.getElementById('inventoryDate').value;

      const payload = {
        adjustment_date: date,
        items: items,
        note: `جرد بتاريخ ${date} – المسؤول: ${officer}`
      };

      try {
        const res = await fetch(`${API_BASE}/inventory/adjust`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'فشل الحفظ');
        }
        const result = await res.json();
        alert('✅ تم حفظ الجرد بنجاح!\n' +
              `عدد المنتجات المعدلة: ${result.adjustments?.length || 0}\n` +
              `قيد اليومية: #${result.journal_entry_id || '—'}`);
        await fetchProducts(currentPage);
      } catch (err) {
        alert('❌ خطأ في الحفظ: ' + err.message);
        console.error(err);
      }
    };

    // الطباعة الموحدة هي المسار المعتمد لهذه الصفحة.

    // تحديث البيانات
    window.refreshData = function() {
      fetchProducts(currentPage);
    };

    // التهيئة
    document.getElementById('inventoryDate').value = new Date().toISOString().slice(0,10);
    const savedOfficer = localStorage.getItem('inventoryOfficer') || '';
    if (savedOfficer) document.getElementById('inventoryOfficer').value = savedOfficer;
    document.getElementById('inventoryOfficer').addEventListener('change', function() {
      localStorage.setItem('inventoryOfficer', this.value);
    });

    fetchProducts(1);
    console.log('✅ تطبيق المخزون والجرد جاهز');
  })();
</script>

<script src="sidebar-config.js"></script>
    <script src="notification-center-v3.js"></script>
</body>
</html>
