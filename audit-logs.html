<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل النشاط | نظام نقاط البيع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="sidebar-v4.css"><script src="date-utils.js"></script>
    <script src="number-utils.js"></script>
    <script src="document-utils.js"></script>
    <script src="sidebar-config.js"></script>
    <script src="api-client.js"></script>
    <script src="permissions.js"></script>
    <script src="filter-utils.js"></script>
    <script src="offline-sync.js"></script>
    <script src="notification-center-v3.js"></script>
</head>
<body><div class="app-wrapper"><div id="sidebar-container"></div><main class="main-content">
<div class="page-head"><div><h1><i class="fas fa-shield-alt"></i> سجل نشاط المستخدمين</h1><div class="muted">تسجيل محاولات الدخول والعمليات والصفحات والنتائج لكل مستخدم.</div></div><button id="btn-export-audit-logs" class="btn btn-primary" data-permission="audit.export" onclick="exportAuditLogs()"><i class="fas fa-file-export"></i> تصدير CSV</button></div>
<section class="card"><form class="filters" onsubmit="loadAuditLogs(1);return false"><div class="field"><label>المستخدم <b style="color:var(--danger)">*</b></label><select id="user_id"><option value="">اختر المستخدم</option></select></div><div class="field"><label>من تاريخ <b style="color:var(--danger)">*</b></label><input type="date" id="from" required></div><div class="field"><label>إلى تاريخ <b style="color:var(--danger)">*</b></label><input type="date" id="to" required></div><div class="field"><label>بحث إضافي</label><input id="search" placeholder="المسار أو المورد"></div><div class="field"><label>العملية</label><input id="action" placeholder="مثال: sale.create أو إنشاء فاتورة بيع"></div><div class="field"><label>النتيجة</label><select id="status"><option value="">الكل</option><option value="success">نجاح</option><option value="failed">فشل / منع</option></select></div><button id="btn-load-audit-logs" class="btn btn-primary" type="submit"><i class="fas fa-search"></i> عرض السجل</button><button id="btn-reset-audit-filters" class="btn btn-outline" type="button" onclick="resetFilters()">مسح</button></form><div id="filter-hint" class="muted" style="margin-top:10px">اختر المستخدم والفترة لعرض سجل نشاطه.</div></section>
<section class="card"><div id="summary" class="muted" style="margin-bottom:10px">لم يتم اختيار مستخدم وفترة بعد.</div><div class="table-wrap"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>الدور</th><th>العملية</th><th>المسار</th><th>النتيجة</th><th>التفاصيل</th><th>عنوان IP</th></tr></thead><tbody id="logs"><tr><td colspan="8" class="empty">جاري التحميل...</td></tr></tbody></table></div><div class="pagination"><button id="btn-audit-prev-page" class="btn btn-outline" onclick="loadAuditLogs(page-1)">السابق</button><span id="page-label">1</span><button id="btn-audit-next-page" class="btn btn-outline" onclick="loadAuditLogs(page+1)">التالي</button></div></section>
</main></div><div id="toast"></div>
<script>
const API = (window.API_BASE_URL || (window.apiClient && window.apiClient.baseUrl) || 'https://api.ibnalmukhtar.com').replace(/\/$/, '');
let isLoadingAuditLogs = false;
let isExportingAuditLogs = false;
let isLoadingAuditUsers = false;let token=localStorage.getItem('pos_token')||'',page=1,pages=1,hasAuditFilter=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const ACTION_LABELS={
  'auth.login':'تسجيل الدخول','auth.logout':'تسجيل الخروج','backup.export':'تصدير نسخة احتياطية','backup.restore':'استعادة نسخة احتياطية',
  'sale.create':'إنشاء فاتورة بيع','sale.update':'تعديل فاتورة بيع','sale.return':'إرجاع فاتورة بيع','sale.cancel':'إلغاء فاتورة بيع','sale.return.reverse':'التراجع عن إرجاع بيع',
  'purchase.create':'إنشاء فاتورة شراء','purchase.update':'تعديل فاتورة شراء','purchase.return':'إرجاع فاتورة شراء','purchase.cancel':'إلغاء فاتورة شراء',
  'voucher.create':'إنشاء سند مالي','voucher.update':'تعديل سند مالي','voucher.cancel':'إلغاء سند مالي','expense.create':'إضافة مصروف','expense.update':'تعديل مصروف','expense.delete':'حذف مصروف',
  'product.create':'إضافة منتج','product.update':'تعديل منتج','product.delete':'حذف منتج','inventory.adjust':'تسوية أو جرد المخزون',
  'driver.create':'إضافة مندوب','driver.update':'تعديل مندوب','driver.delete':'حذف مندوب','driver.payment':'تسوية حساب مندوب',
  'online-order.create':'إنشاء طلب إنترنت','online-order.update':'تعديل طلب إنترنت','online-order.cancel':'إلغاء طلب إنترنت','online-order.assign-driver':'إسناد طلب لمندوب','online-order.status-update':'تحديث حالة طلب إنترنت',
  'customer.create':'إضافة عميل','customer.update':'تعديل عميل','customer.delete':'حذف عميل','customer.payment':'تسجيل دفعة عميل',
  'user.create':'إضافة مستخدم','user.update':'تعديل مستخدم','user.delete':'حذف مستخدم',
  'wallet.create':'إضافة محفظة','wallet.update':'تعديل محفظة','wallet.delete':'حذف محفظة','wallet.transfer':'تحويل بين المحافظ','wallet.exchange':'صرف أو تحويل عملة',
  'currency.create':'إضافة عملة','currency.update':'تعديل عملة','currency.delete':'حذف عملة',
  'accounting.journal.create':'إضافة قيد يومية','accounting.initialize':'تهيئة المحاسبة','accounting.close':'إغلاق أو إعادة فتح السنة المالية',
  'settings.update':'تعديل الإعدادات','notifications.test':'اختبار الإشعارات','integration.update':'تعديل التكامل','system.update':'تعديل النظام'
};
function actionLabel(action){
  const code=String(action||'');
  if(ACTION_LABELS[code]) return ACTION_LABELS[code];
  const [resource,verb]=code.split('.');
  const resources={sale:'البيع',purchase:'الشراء',product:'المنتج',customer:'العميل',driver:'المندوب',user:'المستخدم',wallet:'المحفظة',currency:'العملة',expense:'المصروف',voucher:'السند',inventory:'المخزون',settings:'الإعدادات','online-order':'طلب الإنترنت'};
  const verbs={create:'إنشاء',update:'تعديل',delete:'حذف',cancel:'إلغاء',return:'إرجاع',payment:'تسجيل دفعة',transfer:'تحويل',exchange:'صرف أو تحويل',adjust:'تسوية أو جرد'};
  return (verbs[verb]&&resources[resource])?`${verbs[verb]} ${resources[resource]}`:'عملية مسجلة';
}
function actionCell(action){const code=String(action||'');return `<span title="الرمز التقني للعملية">${esc(actionLabel(code))}</span><small style="display:block;color:var(--muted);direction:ltr;text-align:right">${esc(code||'-')}</small>`}
function toast(m){const e=document.getElementById('toast');e.className='toast';e.textContent=m;setTimeout(()=>e.className='',3500)}
function params(){const p=new URLSearchParams();['user_id','search','action','status','from','to'].forEach(k=>{const e=document.getElementById(k),v=e?.value||'';if(v)p.set(k,v)});p.set('page',page);p.set('limit','50');return p}
function selectedRangeIsValid(){const u=document.getElementById('user_id')?.value||'',f=document.getElementById('from')?.value||'',t=document.getElementById('to')?.value||'';return Boolean(u&&f&&t&&f<=t)}
async function loadAuditUsers(){try{const r=await fetch(`${API}/audit-logs/users`,{headers:{Authorization:`Bearer ${token}`,'X-Page-Name':'audit-logs.html'}});const d = await r.json().catch(() => ({}));if(!r.ok)throw Error(d.error||'فشل تحميل المستخدمين');const s=document.getElementById('user_id');(d.users||[]).forEach(u=>{const o=document.createElement('option');o.value=u.user_id;o.textContent=`${u.username||'غير معروف'}${u.role?' — '+u.role:''}`;s.appendChild(o)})}catch(e){toast(e.message)}}
async function loadAuditLogs(next=1) {
    if (isLoadingAuditLogs) return;
    if (!window.POSPermissions?.can('audit.view')) return;
    if (!selectedRangeIsValid()) {
        hasAuditFilter = false;
        document.getElementById('filter-hint').textContent = 'اختر المستخدم والفترة (من وإلى) لعرض السجل.';
        document.getElementById('summary').textContent = 'لم يتم اختيار مستخدم وفترة بعد.';
        document.getElementById('logs').innerHTML = '<tr><td colspan="8" class="empty">اختر المستخدم والفترة ثم اضغط عرض السجل</td></tr>';
        return;
    }
    hasAuditFilter = true;
    page = Math.max(1, Math.min(next, pages));
    const btn = document.getElementById('btn-load-audit-logs');
    const origText = btn ? btn.innerHTML : '';
    try {
        isLoadingAuditLogs = true;
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري العرض...'; }
        const r = await fetch(`${API}/audit-logs?${params()}`, { headers: { Authorization: `Bearer ${token}`, 'X-Page-Name': 'audit-logs.html' } });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw Error(d.error || 'فشل تحميل السجل');
        pages = d.pages || 1;
        document.getElementById('filter-hint').textContent = 'تم عرض السجل حسب المستخدم والفترة المحددين.';
        document.getElementById('summary').textContent = `إجمالي السجلات: ${Number(d.total || 0).toLocaleString('en-US')}`;
        document.getElementById('page-label').textContent = `${page} / ${pages}`;
        document.getElementById('logs').innerHTML = (d.logs || []).map(x => `<tr><td dir="ltr">${esc(POSDate.dateTime(x.created_at))}</td><td>${esc(x.username || 'غير معروف')}</td><td>${esc(x.role || '-')}</td><td>${actionCell(x.action)}</td><td>${esc(x.path || '-')}</td><td class="${x.success ? 'ok' : 'fail'}">${x.success ? 'نجاح' : 'فشل'} (${esc(x.status_code)})</td><td class="details">${esc(x.details ? JSON.stringify(x.details) : '')}</td><td>${esc(x.ip_address || '-')}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">لا توجد عمليات لهذا المستخدم خلال الفترة المحددة</td></tr>';
    } catch (e) {
        toast(e.message);
    } finally {
        isLoadingAuditLogs = false;
        if (btn) { btn.disabled = false; btn.innerHTML = origText; }
    }
}
function resetFilters(){['user_id','search','action','status','from','to'].forEach(k=>{const e=document.getElementById(k);if(e)e.value=''});hasAuditFilter=false;document.getElementById('summary').textContent='لم يتم اختيار مستخدم وفترة بعد.';document.getElementById('filter-hint').textContent='اختر المستخدم والفترة (من وإلى) لعرض سجل نشاطه.';document.getElementById('logs').innerHTML='<tr><td colspan="8" class="empty">اختر المستخدم والفترة ثم اضغط عرض السجل</td></tr>'}
async function exportAuditLogs() {
    if (isExportingAuditLogs) return;
    if (!selectedRangeIsValid()) return toast('اختر المستخدم والفترة أولاً');
    const btn = document.getElementById('btn-export-audit-logs');
    const origText = btn ? btn.innerHTML : '';
    try {
        isExportingAuditLogs = true;
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التصدير...'; }
        const p = params();
        p.delete('page');
        const r = await fetch(`${API}/audit-logs/export?${p}`, { headers: { Authorization: `Bearer ${token}`, 'X-Page-Name': 'audit-logs.html' } });
        if (!r.ok) throw Error('غير مصرح أو فشل التصدير');
        const b = await r.blob(), a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'audit-log.csv';
        a.click();
        URL.revokeObjectURL(a.href);
    } catch (e) {
        toast(e.message);
    } finally {
        isExportingAuditLogs = false;
        if (btn) { btn.disabled = false; btn.innerHTML = origText; }
    }
}
window.addEventListener('load',async()=>{resetFilters();await loadAuditUsers()});
</script></body>
</html>
