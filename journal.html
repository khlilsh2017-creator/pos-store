<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>القيود - النظام المحاسبي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root { --primary: #1a56db; --primary-hover: #1e40af; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --success: #16a34a; --danger: #dc2626; --warning: #f59e0b; --info: #0ea5e9; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1); --sidebar-width: 220px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        .input-field, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; background: white; transition: 0.2s; }
        .input-field:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
        .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-outline { background: transparent; border: 1px solid var(--border); }
        .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
        .text-center { text-align: center; }
        .text-muted { color: var(--muted); }
        .text-danger { color: var(--danger); }
        .mt-10 { margin-top: 10px; }
        .mb-10 { margin-bottom: 10px; }
        .flex-row { display: flex; flex-wrap: wrap; gap: 15px; }
        .flex-1 { flex: 1; min-width: 200px; }
        .flex-2 { flex: 2; min-width: 200px; }
        .hidden { display: none; }
        .card-section { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
        .app-wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: var(--card); border-left: 1px solid var(--border); box-shadow: 2px 0 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding: 20px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
        .sidebar .brand { text-align: center; padding: 0 15px 20px; border-bottom: 1px solid var(--border); margin-bottom: 15px; font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .sidebar .brand i { font-size: 1.8rem; display: block; margin-bottom: 5px; }
        .sidebar .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--text); text-decoration: none; border-radius: 0 20px 20px 0; transition: 0.15s; font-weight: 600; font-size: 0.9rem; border-right: 3px solid transparent; cursor: pointer; }
        .sidebar .nav-link:hover { background: var(--bg); border-right-color: var(--primary); }
        .sidebar .nav-link.active { background: var(--bg); border-right-color: var(--primary); color: var(--primary); }
        .sidebar .nav-link i { width: 20px; text-align: center; }
        .sidebar .logout-btn { margin-top: auto; border-top: 1px solid var(--border); padding-top: 15px; margin-bottom: 10px; }
        .main-content { flex: 1; padding: 20px; background: var(--bg); overflow-y: auto; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--text); color: white; padding: 14px 24px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; min-width: 200px; max-width: 400px; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        .toast.info { background: var(--info); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table th, table td { border: 1px solid var(--border); padding: 10px; text-align: center; }
        table th { background: var(--bg); font-weight: 700; }
        .table-wrap { overflow-x: auto; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal.open { display: flex; }
        .modal-content { background: white; max-width: 700px; width: 90%; max-height: 90vh; overflow-y: auto; border-radius: 16px; padding: 24px; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .modal-close { position: absolute; top: 15px; left: 15px; font-size: 1.5rem; color: var(--muted); cursor: pointer; background: none; border: none; transition: 0.2s; }
        .modal-close:hover { color: var(--danger); }
        .modal-actions { margin-top: 20px; display: flex; gap: 15px; justify-content: flex-end; flex-wrap: wrap; }
        @media (max-width: 768px) { .sidebar { width: 60px; padding: 10px 0; } .sidebar .brand span { display: none; } .sidebar .nav-link span { display: none; } .sidebar .nav-link { justify-content: center; padding: 12px 0; } }
        .detail-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f1f5f9; }
        .detail-row .label { color: var(--muted); font-weight: 600; }
        .detail-row .value { font-weight: 600; }
        .wallet-badge { background: #dbeafe; color: #1e40af; padding: 2px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <nav class="sidebar">
            <div class="brand"><i class="fas fa-store-alt"></i><span>ابن المختار</span></div>
            <a class="nav-link" href="index.html"><i class="fas fa-th-large"></i> <span>لوحة التحكم</span></a>
            <a class="nav-link" href="sale.html"><i class="fas fa-cash-register"></i> <span>البيع</span></a>
            <a class="nav-link" href="products.html"><i class="fas fa-boxes"></i> <span>المنتجات</span></a>
            <a class="nav-link" href="customers.html"><i class="fas fa-users"></i> <span>العملاء</span></a>
            <a class="nav-link" href="suppliers.html"><i class="fas fa-truck"></i> <span>الموردين</span></a>
            <a class="nav-link" href="purchases.html"><i class="fas fa-shopping-cart"></i> <span>المشتريات</span></a>
            <a class="nav-link" href="expenses.html"><i class="fas fa-receipt"></i> <span>المصروفات</span></a>
            <a class="nav-link" href="payments.html"><i class="fas fa-hand-holding-usd"></i> <span>سندات</span></a>
            <a class="nav-link" href="cash-wallets.html"><i class="fas fa-wallet"></i> <span>المحافظ</span></a>
            <a class="nav-link" href="cash-wallets.html"><i class="fas fa-coins"></i> <span>الصندوق</span></a>
            <a class="nav-link" href="invoices.html"><i class="fas fa-file-invoice"></i> <span>الفواتير</span></a>
            <a class="nav-link active" href="journal.html"><i class="fas fa-book"></i> <span>القيود</span></a>
            <a class="nav-link" href="reports.html"><i class="fas fa-chart-pie"></i> <span>التقارير</span></a>
            <a class="nav-link" href="operations.html"><i class="fas fa-tools"></i> <span>عمليات</span></a>
            <a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> <span>إعدادات</span></a>
            <div class="logout-btn"><div class="nav-link" onclick="logout()" style="color:var(--danger);"><i class="fas fa-sign-out-alt"></i> <span>خروج</span></div></div>
        </nav>

        <main class="main-content">
            <div class="card-section">
                <h4><i class="fas fa-book"></i> قيود اليومية</h4>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>التاريخ</th>
                                <th>البيان</th>
                                <th>المبلغ الإجمالي</th>
                                <th>تفاصيل</th>
                            </tr>
                        </thead>
                        <tbody id="journal-entries-body">
                            <tr><td colspan="5" class="text-muted">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal لعرض تفاصيل القيد -->
    <div id="journal-detail-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('journal-detail-modal')">&times;</button>
            <h4><i class="fas fa-list-ul"></i> تفاصيل القيد</h4>
            <div id="journal-detail-body"></div>
            <div class="modal-actions">
                <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button>
                <button class="btn btn-outline btn-sm" onclick="closeModal('journal-detail-modal')">إغلاق</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const API = 'https://api.ibnalmukhtar.com';
        let token = localStorage.getItem('pos_token') || '';
        if (!token) window.location.href = 'index.html';

        // خريطة لتخزين أسماء الحسابات
        let accountsMap = {};

        function showToast(msg, type='info') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
            t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }
        function logout() { if(confirm('تأكيد الخروج؟')) { localStorage.removeItem('pos_token'); window.location.href='index.html'; } }
        function openModal(id) { document.getElementById(id).classList.add('open'); }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }

        // جلب الحسابات من الخادم
        async function loadAccounts() {
            try {
                const res = await fetch(`${API}/accounts`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (data.accounts) {
                    data.accounts.forEach(acc => { accountsMap[acc.id] = acc.name; });
                }
            } catch (e) {
                console.warn('فشل تحميل الحسابات', e);
            }
        }

        // عرض تفاصيل القيد في مودال
        function showJournalDetails(entry) {
            const body = document.getElementById('journal-detail-body');
            let detailsHtml = '';
            if (entry.details && Array.isArray(entry.details) && entry.details.length > 0) {
                detailsHtml = `
                    <table>
                        <thead><tr><th>الحساب</th><th>مدين</th><th>دائن</th><th>ملاحظة</th></tr></thead>
                        <tbody>
                            ${entry.details.map(d => {
                                const accountName = accountsMap[d.account_id] || `حساب #${d.account_id}`;
                                // التحقق من وجود اسم محفظة في الملاحظة
                                let noteDisplay = d.notes || '';
                                if (noteDisplay.includes('محفظة')) {
                                    noteDisplay = `<span class="wallet-badge">${noteDisplay}</span>`;
                                }
                                return `
                                    <tr>
                                        <td>${accountName}</td>
                                        <td>${d.debit > 0 ? d.debit.toFixed(2) : '-'}</td>
                                        <td>${d.credit > 0 ? d.credit.toFixed(2) : '-'}</td>
                                        <td>${noteDisplay || '-'}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                detailsHtml = '<p class="text-muted">لا توجد تفاصيل إضافية</p>';
            }
            body.innerHTML = `
                <div style="margin-bottom: 10px;">
                    <div class="detail-row"><span class="label">رقم القيد</span><span class="value">${entry.id}</span></div>
                    <div class="detail-row"><span class="label">التاريخ</span><span class="value">${entry.entry_date}</span></div>
                    <div class="detail-row"><span class="label">البيان</span><span class="value">${entry.description}</span></div>
                    <div class="detail-row"><span class="label">المرجع</span><span class="value">${entry.reference_type || '-'} ${entry.reference_id ? '#'+entry.reference_id : ''}</span></div>
                </div>
                <h5 style="margin-top:10px;">تفاصيل القيد</h5>
                ${detailsHtml}
            `;
            openModal('journal-detail-modal');
        }

        // تحميل القيود وعرضها
        async function loadJournalEntries() {
            try {
                const res = await fetch(`${API}/journal-entries`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const tbody = document.getElementById('journal-entries-body');
                if (!data.entries || data.entries.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-muted">لا توجد قيود</td></tr>';
                    return;
                }
                tbody.innerHTML = data.entries.map(e => {
                    // حساب المبلغ الإجمالي من التفاصيل (إن وجدت)
                    let total = 0;
                    if (e.details && Array.isArray(e.details)) {
                        total = e.details.reduce((sum, d) => sum + (d.debit || 0) + (d.credit || 0), 0);
                    }
                    return `
                        <tr>
                            <td>${e.id}</td>
                            <td>${e.entry_date}</td>
                            <td>${e.description}</td>
                            <td>${total > 0 ? total.toFixed(2) : '-'}</td>
                            <td>
                                <button class="btn btn-info btn-sm" onclick='showJournalDetails(${JSON.stringify(e).replace(/'/g,"\\'")})'>
                                    <i class="fas fa-eye"></i> عرض
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('journal-entries-body').innerHTML = '<tr><td colspan="5" class="text-danger">فشل تحميل القيود</td></tr>';
                showToast('خطأ في تحميل القيود', 'error');
            }
        }

        // إغلاق المودال عند الضغط خارج المحتوى
        document.getElementById('journal-detail-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal('journal-detail-modal');
        });

        // تهيئة الصفحة
        window.onload = async function() {
            await loadAccounts();
            await loadJournalEntries();
        };
    </script>
</body>
</html>
