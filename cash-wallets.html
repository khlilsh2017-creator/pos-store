<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصندوق والمحافظ - النظام المحاسبي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary: #1a56db;
            --primary-hover: #1e40af;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --info: #0ea5e9;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --sidebar-width: 220px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .input-field, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: white;
            transition: 0.2s;
        }
        .input-field:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-outline { background: transparent; border: 1px solid var(--border); }
        .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
        .text-center { text-align: center; }
        .text-muted { color: var(--muted); }
        .text-danger { color: var(--danger); }
        .mt-10 { margin-top: 10px; }
        .mb-10 { margin-bottom: 10px; }
        .flex-row { display: flex; flex-wrap: wrap; gap: 15px; }
        .flex-1 { flex: 1; min-width: 200px; }
        .flex-2 { flex: 2; min-width: 200px; }
        .hidden { display: none; }
        .card-section {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .app-wrapper { display: flex; min-height: 100vh; }
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card);
            border-left: 1px solid var(--border);
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar .brand { text-align: center; padding: 0 15px 20px; border-bottom: 1px solid var(--border); margin-bottom: 15px; font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .sidebar .brand i { font-size: 1.8rem; display: block; margin-bottom: 5px; }
        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: var(--text);
            text-decoration: none;
            border-radius: 0 20px 20px 0;
            transition: 0.15s;
            font-weight: 600;
            font-size: 0.9rem;
            border-right: 3px solid transparent;
            cursor: pointer;
        }
        .sidebar .nav-link:hover { background: var(--bg); border-right-color: var(--primary); }
        .sidebar .nav-link.active { background: var(--bg); border-right-color: var(--primary); color: var(--primary); }
        .sidebar .nav-link i { width: 20px; text-align: center; }
        .sidebar .logout-btn { margin-top: auto; border-top: 1px solid var(--border); padding-top: 15px; margin-bottom: 10px; }
        .main-content { flex: 1; padding: 20px; background: var(--bg); overflow-y: auto; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--text); color: white; padding: 14px 24px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; min-width: 200px; max-width: 400px; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        .toast.info { background: var(--info); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .wallet-card {
            background: var(--bg);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
            flex-wrap: wrap;
        }
        .wallet-card .balances {
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
        }
        .wallet-card .balances span {
            background: white;
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .cash-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 10px 0;
        }
        .cash-summary .stat-card {
            flex: 1;
            min-width: 150px;
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-right: 4px solid var(--primary);
        }
        .cash-summary .stat-card .label { font-size: 0.9rem; color: var(--muted); }
        .cash-summary .stat-card .value { font-size: 1.5rem; font-weight: 700; }
        .currency-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        .currency-table th, .currency-table td { border: 1px solid var(--border); padding: 8px; text-align: center; }
        .currency-table th { background: var(--bg); }
        .inline-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
        .inline-form .form-group { flex: 1; min-width: 120px; }
        .voucher-list { max-height: 300px; overflow-y: auto; }
        .voucher-item { border-bottom: 1px solid var(--border); padding: 6px 0; display: flex; justify-content: space-between; align-items: center; }
        @media (max-width: 768px) {
            .sidebar { width: 60px; padding: 10px 0; }
            .sidebar .brand span { display: none; }
            .sidebar .nav-link span { display: none; }
            .sidebar .nav-link { justify-content: center; padding: 12px 0; }
        }
        .exchange-box { background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px dashed var(--primary); margin: 10px 0; }
    </style>
    <script src="number-utils.js"></script>
    <script src="permissions.js"></script>
    <script src="filter-utils.js"></script>
    <link rel="stylesheet" href="sidebar-v4.css" />
    <script src="/offline-sync.js"></script>
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <!-- إدارة العملات -->
            <div class="card-section" data-permission="currencies.view">
                <h4><i class="fas fa-coins"></i> عرض العملات</h4>
                <div id="currency-section">
                    <div class="flex-row">
                        <div class="flex-1">
                            <h5 data-permission="settings.currencies.manage">إضافة عملة جديدة</h5>
                            <form id="currency-form" data-permission="settings.currencies.manage" onsubmit="addCurrency(event)" class="inline-form">
                                <div class="form-group"><label>الرمز</label><input type="text" id="cur-code" class="input-field" required placeholder="مثل: USD" /></div>
                                <div class="form-group"><label>الاسم</label><input type="text" id="cur-name" class="input-field" required placeholder="دولار أمريكي" /></div>
                                <div class="form-group"><label>سعر الصرف (بالريال)</label><input type="number" id="cur-rate" class="input-field" step="0.01" required /></div>
                                <div class="form-group" style="display:flex;align-items:center;gap:6px;">
                                    <input type="checkbox" id="cur-isbase" /> <label>أساسية</label>
                                </div>
                                <div class="form-group"><button type="submit" class="btn btn-success"><i class="fas fa-plus"></i> إضافة</button></div>
                            </form>
                        </div>
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="currency-table">
                            <thead><tr><th>الرمز</th><th>الاسم</th><th>سعر الصرف</th><th>أساسية</th><th>الإجراءات</th></tr></thead>
                            <tbody id="currency-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- قسم حالة الصندوق والمحافظ -->
            <div id="ledger-unified-filter-host" class="ledger-unified-filter-host" data-permission="cash.view"></div>
            <div class="card-section" data-permission="cash.view">
                <h4><i class="fas fa-chart-line"></i> حالة الصندوق والمحافظ</h4>
                <div id="cash-status" data-permission="cash.view" class="cash-summary">جاري التحميل...</div>
            </div>

            <div class="flex-row">
                <!-- عمليات الصندوق -->
                <div class="card-section flex-1" data-permission="cash.view">
                    <h4><i class="fas fa-coins"></i> حركة الصندوق</h4>
                    <label>النوع</label>
                    <select id="cash-type" class="input-field">
                        <option value="open">فتح صندوق</option>
                        <option value="deposit">إيداع</option>
                        <option value="withdraw">سحب</option>
                        <option value="close">إغلاق صندوق</option>
                    </select>
                    <label>المبلغ</label><input type="number" id="cash-amount" class="input-field" step="0.01" />
                    <label>العملة</label>
                    <select id="cash-currency" class="input-field"></select>
                    <label>ملاحظة</label><input type="text" id="cash-note" class="input-field" />
                    <button class="btn btn-primary mt-10" onclick="addCashOperation()"><i class="fas fa-save"></i> تسجيل</button>
                    <hr />
                    <h5>سجل حركات الصندوق التفصيلي</h5>
                    <button type="button" class="btn btn-outline btn-sm ledger-filter-toggle" onclick="toggleLedgerFilter('cash')"><i class="fas fa-filter"></i> إظهار/إخفاء تصفية الصندوق</button>
                    <div id="cash-ledger-filters" class="flex-row ledger-filters" data-permission="cash.view" hidden>
                        <div class="flex-1"><label>نوع العملية</label><select id="cash-filter-type" class="input-field"><option value="">كل الأنواع</option><option value="open">فتح صندوق</option><option value="deposit">إيداع</option><option value="withdraw">سحب</option><option value="close">إغلاق صندوق</option></select></div>
                        <div class="flex-1"><label>العملة</label><select id="cash-filter-currency" class="input-field"><option value="">كل العملات</option></select></div>
                        <div class="flex-1"><label>تفاصيل العملية</label><select id="cash-filter-detail" class="input-field"><option value="">كل التفاصيل</option><option value="open">فتح الصندوق</option><option value="close">إغلاق الصندوق</option><option value="cash_wallet_transfer">تحويل صندوق/محفظة</option><option value="exchange">مصارفة</option><option value="sale">مبيعات</option><option value="purchase">مشتريات</option><option value="expense">مصروف</option><option value="customer_payment">سند عميل</option><option value="supplier_payment">سند مورد</option><option value="manual">عملية يدوية</option><option value="other">أخرى</option></select></div>
                        <div class="flex-1" style="display:flex;align-items:end;gap:6px"><button class="btn btn-primary" onclick="loadCashLedger()"><i class="fas fa-filter"></i> تصفية</button><button class="btn btn-outline" onclick="printCashLedger()"><i class="fas fa-print"></i> طباعة</button></div>
                    </div>
                    <div id="cash-ledger-summary" class="text-muted mt-10"></div>
                    <div id="cash-log" style="max-height:420px; overflow:auto;"></div>
                </div>

                <!-- المحافظ -->
                <div class="card-section flex-1" data-permission="wallets.view">
                    <h4><i class="fas fa-wallet"></i> المحافظ</h4>
                    <div id="wallets-list" class="mb-10"></div>
                    <hr />
                    <h5 data-permission="wallets.manage">إضافة محفظة جديدة</h5>
                    <form id="wallet-form" data-permission="wallets.manage" onsubmit="addWallet(event)">
                        <label>اسم المحفظة</label><input type="text" id="wallet-name" class="input-field" required />
                        <button type="submit" class="btn btn-success mt-10"><i class="fas fa-plus"></i> إضافة</button>
                    </form>
                    <hr />
                    <h5 data-permission="wallets.manage">تحويل / إيداع / سحب</h5>
                    <div class="flex-row" data-permission="wallets.manage">
                        <div class="flex-1"><label>نوع العملية</label><select id="transfer-type" class="input-field" onchange="handleTransferType()">
                            <option value="wallet">تحويل بين محفظتين</option>
                            <option value="cash_in">إيداع نقدي إلى محفظة</option>
                            <option value="cash_out">سحب من محفظة إلى الصندوق</option>
                            <option value="exchange">مصارفة داخلية (محفظة)</option>
                            <option value="cash_exchange">مصارفة داخلية (الصندوق)</option>
                        </select></div>
                        <div class="flex-1" id="from-wallet-group"><label>من محفظة</label><select id="from-wallet" class="input-field"></select></div>
                        <div class="flex-1" id="to-wallet-group"><label>إلى محفظة</label><select id="to-wallet" class="input-field"></select></div>
                    </div>
                    <div class="flex-row" data-permission="wallets.manage">
                        <div class="flex-1"><label id="transfer-amount-label">المبلغ</label><input type="number" id="transfer-amount" class="input-field" step="0.01" min="0.01" oninput="updateExchangePreview()" /></div>
                        <div class="flex-1" id="transfer-currency-group" style="display:none;"><label id="transfer-from-currency-label">العملة</label><select id="transfer-currency" class="input-field" onchange="updateExchangePreview()"></select></div>
                        <div class="flex-1" id="exchange-to-currency-group" style="display:none;"><label>عملة الهدف</label><select id="exchange-to-currency" class="input-field" onchange="updateExchangePreview()"></select></div>
                        <div class="flex-1" id="transfer-rate-field"><label>سعر الصرف (اختياري)</label><input type="number" id="transfer-exchange-rate" class="input-field" step="0.01" placeholder="اترك فارغاً لاستخدام السعر الافتراضي" /></div>
                        <div id="exchange-preview" class="flex-1" style="display:none;color:var(--primary);font-weight:700;padding:10px 0;"></div>
                        <div class="flex-1" id="transfer-fee-field"><label for="transfer-fee">رسوم التحويل (اختياري)</label><input type="number" id="transfer-fee" class="input-field" min="0" step="0.01" value="0" placeholder="0.00" /></div>
                        <div class="flex-1" id="fee-deducted-field" style="display:flex;align-items:center;gap:7px"><input type="checkbox" id="fee-deducted-from-amount" /><label for="fee-deducted-from-amount">خصم الرسوم من المبلغ المحدد</label></div>
                    </div>
                    <div class="flex-row" data-permission="wallets.manage">
                        <div class="flex-1"><button class="btn btn-warning mt-10" onclick="executeTransfer()"><i class="fas fa-exchange-alt"></i> تنفيذ</button></div>
                    </div>
                    <h5 class="mt-10" data-permission="wallets.transactions.view">سجل حركات المحافظ التفصيلي</h5>
                    <button type="button" class="btn btn-outline btn-sm ledger-filter-toggle" onclick="toggleLedgerFilter('wallet')"><i class="fas fa-filter"></i> إظهار/إخفاء تصفية المحافظ</button>
                    <div id="wallet-ledger-filters" class="flex-row ledger-filters" data-permission="wallets.transactions.view" hidden>
                        <div class="flex-1"><label>المحفظة</label><select id="wallet-filter-wallet" class="input-field"><option value="">كل المحافظ</option></select></div>
                        <div class="flex-1"><label>نوع العملية</label><select id="wallet-filter-type" class="input-field"><option value="">كل الأنواع</option><option value="deposit">إيداع</option><option value="withdraw">سحب</option></select></div>
                        <div class="flex-1"><label>تفاصيل العملية</label><select id="wallet-filter-detail" class="input-field"><option value="">كل التفاصيل</option><option value="cash_in">إيداع من الصندوق</option><option value="cash_out">سحب إلى الصندوق</option><option value="wallet_transfer_in">تحويل وارد من محفظة</option><option value="wallet_transfer_out">تحويل صادر إلى محفظة</option><option value="exchange">مصارفة</option><option value="sale">مبيعات</option><option value="purchase">مشتريات</option><option value="expense">مصروف</option><option value="customer_payment">سند عميل</option><option value="supplier_payment">سند مورد</option><option value="fee">رسوم/خسائر صرف</option><option value="other">أخرى</option></select></div>
                        <div class="flex-1" style="display:flex;align-items:end;gap:6px"><button class="btn btn-primary" onclick="loadWalletLedger()"><i class="fas fa-filter"></i> تصفية</button><button class="btn btn-outline" onclick="printWalletLedger()"><i class="fas fa-print"></i> طباعة</button></div>
                    </div>
                    <div id="wallet-ledger-summary" class="text-muted mt-10"></div>
                    <div id="wallet-transactions" data-permission="wallets.transactions.view" style="max-height:420px; overflow:auto;"></div>
                </div>
            </div>

            <!-- ========== سندات نقدية ========== -->
            <div class="card-section">
                <h4><i class="fas fa-file-invoice"></i> سندات نقدية (قبض / صرف)</h4>
                <div class="flex-row">
                    <div class="flex-1">
                        <form id="voucher-form" onsubmit="addCashVoucher(event)">
                            <div class="flex-row">
                                <div class="flex-1">
                                    <label>النوع</label>
                                    <select id="voucher-type" class="input-field" required>
                                        <option value="receipt">سند قبض</option>
                                        <option value="payment">سند صرف</option>
                                    </select>
                                </div>
                                <div class="flex-1">
                                    <label>المبلغ</label>
                                    <input type="number" id="voucher-amount" class="input-field" step="0.01" required />
                                </div>
                            </div>
                            <div class="flex-row">
                                <div class="flex-1">
                                    <label>العملة</label>
                                    <select id="voucher-currency" class="input-field" required></select>
                                </div>
                                <div class="flex-1">
                                    <label>سعر الصرف (اختياري)</label>
                                    <input type="number" id="voucher-exchange-rate" class="input-field" step="0.01" placeholder="اترك فارغاً للافتراضي" />
                                </div>
                            </div>
                            <div class="flex-row">
                                <div class="flex-1">
                                    <label>السبب / الملاحظة</label>
                                    <input type="text" id="voucher-reason" class="input-field" placeholder="سبب السند" />
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary mt-10"><i class="fas fa-save"></i> تسجيل سند</button>
                        </form>
                    </div>
                    <div class="flex-1">
                        <h5>آخر السندات</h5>
                        <div id="vouchers-list" class="voucher-list"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="toast-container" id="toast-container"></div>

    <script>
        const API = 'https://api.ibnalmukhtar.com';
        let token = localStorage.getItem('pos_token') || '';
        if (!token) window.location.href = 'index.html';

        function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
        function clean(value) { return escapeHtml(value); }

        function operationDetailLabel(value) { return ({ open:'فتح الصندوق', close:'إغلاق الصندوق', cash_in:'إيداع من الصندوق', cash_out:'سحب إلى الصندوق', cash_wallet_transfer:'تحويل صندوق/محفظة', wallet_transfer_in:'تحويل وارد من محفظة', wallet_transfer_out:'تحويل صادر إلى محفظة', exchange:'مصارفة', sale:'مبيعات', purchase:'مشتريات', expense:'مصروف', customer_payment:'سند عميل', supplier_payment:'سند مورد', fee:'رسوم/خسائر صرف', manual:'عملية يدوية', other:'أخرى' }[value] || value || 'أخرى'); }
        function getUnifiedLedgerState() { return window.__posFilterControllers?.['cash-wallets']?.getState?.() || window.POSFilters?.load?.('cash-wallets', { preset:'all', limit:100 }) || { from:'', to:'' }; }
        function addUnifiedLedgerDates(params) { const state = getUnifiedLedgerState(); if (state.from) params.set('from', state.from); if (state.to) params.set('to', state.to); return params; }
        function deriveOperationDetail(type, note) { const text = String(note || ''); if (type === 'open') return 'open'; if (type === 'close') return 'close'; if (/مصارفة/.test(text)) return 'exchange'; if (/محفظة|تحويل/.test(text)) return 'cash_wallet_transfer'; if (/بيع|مبيعات/.test(text)) return 'sale'; if (/شراء|مشتريات/.test(text)) return 'purchase'; if (/مصروف|نفقات/.test(text)) return 'expense'; if (/عميل/.test(text)) return 'customer_payment'; if (/مورد/.test(text)) return 'supplier_payment'; if (/رسوم|خسائر صرف/.test(text)) return 'fee'; if (/يدوي|إيداع|سحب/.test(text)) return 'manual'; return 'other'; }
        function toggleLedgerFilter(kind) { const panel = document.getElementById(kind === 'cash' ? 'cash-ledger-filters' : 'wallet-ledger-filters'); if (!panel) return; panel.hidden = !panel.hidden; }
        async function loadUnifiedLedgers() { await Promise.allSettled([loadCashLedger(), loadWalletLedger()]); }

        async function loadCashStatus() {
            if (!window.POSPermissions?.can('cash.view')) return;
            const headers = { 'Authorization': `Bearer ${token}` };
            try {
                const res = await fetch(`${API}/cash`, { headers });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || 'تعذر تحميل حالة الصندوق');
                const balances = data.cash_balances || {};
                let html = '';
                for (const curId in balances) {
                    const b = balances[curId] || {};
                    html += `<div class="stat-card"><div class="label">💰 ${escapeHtml(b.code || b.name || curId)} (صندوق)</div><div class="value" style="color:var(--primary);">${formatPosMoney(Number(b.amount || 0))}</div></div>`;
                }
                // فشل جلب المحافظ لا يمنع عرض حالة الصندوق.
                try {
                    const walletsRes = await fetch(`${API}/wallets`, { headers });
                    const walletsData = await walletsRes.json().catch(() => ({}));
                    const walletRows = walletsRes.ok && Array.isArray(walletsData.wallets) ? walletsData.wallets : [];
                    walletRows.forEach(w => {
                        const balanceStr = Array.isArray(w.balances) && w.balances.length
                            ? w.balances.map(b => `${escapeHtml(b.code || '')}: ${formatPosMoney(Number(b.balance || 0))}`).join(' | ')
                            : '0';
                        html += `<div class="stat-card" style="border-right-color:var(--info);"><div class="label">💳 ${escapeHtml(w.name || 'محفظة')}</div><div class="value" style="font-size:1rem; color:var(--info);">${balanceStr}</div></div>`;
                    });
                } catch (_) { /* عرض الصندوق وحده عند تعذر المحافظ */ }
                const totalBase = Number(data.total_cash_and_wallets_base ?? (Number(data.total_cash_base || 0) + Number(data.total_wallets_base || 0)));
                html += `<div class="stat-card" style="border-right-color:var(--success);"><div class="label">🏦 الإجمالي الكلي (بالريال)</div><div class="value" style="color:var(--success);">${formatPosMoney(totalBase)}</div></div>`;

            document.getElementById('exchange-to-currency-group').style.display = isExchange ? 'block' : 'none';

            document.getElementById('transfer-rate-field').style.display = isExchange ? 'none' : 'block';
            document.getElementById('transfer-amount-label').textContent = isExchange ? 'المبلغ المراد مصارفته من عملة المصدر' : 'المبلغ';
            document.getElementById('transfer-from-currency-label').textContent = isExchange ? 'عملة المصدر' : 'العملة';

        function updateExchangePreview() {
            const type = document.getElementById('transfer-type')?.value;
            const preview = document.getElementById('exchange-preview');
            if (!preview || !['exchange', 'cash_exchange'].includes(type)) { if (preview) preview.style.display = 'none'; return; }
            const amount = Number(document.getElementById('transfer-amount').value || 0);
            const fromId = Number(document.getElementById('transfer-currency').value || 0);
            const toId = Number(document.getElementById('exchange-to-currency').value || 0);
            const from = currencyCatalog.find(c => Number(c.id) === fromId), to = currencyCatalog.find(c => Number(c.id) === toId);
            if (!amount || amount <= 0 || !from || !to || !Number(from.rate_to_base) || !Number(to.rate_to_base)) { preview.style.display = 'none'; return; }
            const converted = amount * Number(from.rate_to_base) / Number(to.rate_to_base);
            preview.style.display = 'block';
            preview.textContent = `الناتج المتوقع: ${formatPosMoney(converted, 2)} ${to.code} مقابل ${formatPosMoney(amount, 2)} ${from.code}`;
        }

        async function executeTransfer() {
            const type = document.getElementById('transfer-type').value;
            const amount = parseFloat(document.getElementById('transfer-amount').value);
            const fee = parseFloat(document.getElementById('transfer-fee').value) || 0;
            const feeDeducted = document.getElementById('fee-deducted-from-amount').checked;
            const exchangeRate = parseFloat(document.getElementById('transfer-exchange-rate').value) || undefined;
            if (!amount || amount <= 0) return showToast('المبلغ غير صالح', 'warning');
            if (fee < 0 || (feeDeducted && fee >= amount)) return showToast('الرسوم يجب أن تكون أقل من المبلغ عند الخصم منه', 'warning');

            let body = { type, amount, fee, fee_deducted_from_amount: feeDeducted };
            if (exchangeRate && !isNaN(exchangeRate)) body.exchange_rate = exchangeRate;

            if (type === 'wallet') {
                const from = parseInt(document.getElementById('from-wallet').value);
                const to = parseInt(document.getElementById('to-wallet').value);
                const currency = parseInt(document.getElementById('transfer-currency').value);
                if (!from || !to || !currency) return showToast('اختر المحفظتين والعملة', 'warning');
                body.from_wallet_id = from;
                body.to_wallet_id = to;
                body.currency_id = currency;
            } else if (type === 'cash_in') {
                const to = parseInt(document.getElementById('to-wallet').value);
                const currency = parseInt(document.getElementById('transfer-currency').value);
                if (!to || !currency) return showToast('اختر المحفظة والعملة', 'warning');
                body.to_wallet_id = to;
                body.currency_id = currency;
            } else if (type === 'cash_out') {
                const from = parseInt(document.getElementById('from-wallet').value);
                const currency = parseInt(document.getElementById('transfer-currency').value);
                if (!from || !currency) return showToast('اختر المحفظة والعملة', 'warning');
                body.from_wallet_id = from;
                body.currency_id = currency;
            } else if (type === 'exchange') {
                const wallet = parseInt(document.getElementById('from-wallet').value);
                const fromCurr = parseInt(document.getElementById('transfer-currency').value);
                const toCurr = parseInt(document.getElementById('exchange-to-currency').value);
                if (!wallet || !fromCurr || !toCurr) return showToast('اختر المحفظة والعملتين', 'warning');
                if (fromCurr === toCurr) return showToast('لا يمكن الصرف لنفس العملة', 'warning');
                body.wallet_id = wallet; body.from_currency_id = fromCurr; body.to_currency_id = toCurr;
            } else if (type === 'cash_exchange') {
                const fromCurr = parseInt(document.getElementById('transfer-currency').value);
                const toCurr = parseInt(document.getElementById('exchange-to-currency').value);
                if (!fromCurr || !toCurr) return showToast('اختر عملة الصندوق المصدر والعملة الهدف', 'warning');
                if (fromCurr === toCurr) return showToast('لا يمكن الصرف لنفس العملة', 'warning');
                body.from_currency_id = fromCurr; body.to_currency_id = toCurr;
            } else {
                return showToast('نوع غير معروف', 'error');
            }

            // تحديد المسار المناسب
            let endpoint = '/wallets/transfer';
            if (type === 'exchange') endpoint = '/wallets/exchange';
            if (type === 'cash_exchange') endpoint = '/cash/exchange';

            try {
                const res = await fetch(`${API}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('تم التنفيذ', 'success');
                    loadWallets();
                    loadCashStatus();
                    document.getElementById('transfer-amount').value = '';
                    document.getElementById('transfer-exchange-rate').value = '';
                    document.getElementById('transfer-fee').value = '0';
                    document.getElementById('fee-deducted-from-amount').checked = false;
                } else showToast(data.error, 'error');
            } catch { showToast('خطأ', 'error'); }
        }

            const type = document.getElementById('voucher-type').value;
            const amount = parseFloat(document.getElementById('voucher-amount').value);
            const currency_id = parseInt(document.getElementById('voucher-currency').value);
            const reason = document.getElementById('voucher-reason').value;
            const exchange_rate = parseFloat(document.getElementById('voucher-exchange-rate').value) || undefined;
            if (!amount || !currency_id) return showToast('أدخل المبلغ واختر العملة', 'warning');
            try {
                const body = { type, amount, currency_id, reason };
                if (exchange_rate && !isNaN(exchange_rate)) body.exchange_rate = exchange_rate;
                const res = await fetch(`${API}/cash/voucher`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (res.ok) {
                    showToast('تم تسجيل السند', 'success');
                    document.getElementById('voucher-form').reset();
                    loadVouchers();
                    loadCashStatus();
                } else { const err = await res.json(); showToast(err.error, 'error'); }
            } catch { showToast('خطأ', 'error'); }
        }

        async function cancelVoucher(voucherId) {
            if (!confirm('هل أنت متأكد من إلغاء هذا السند؟')) return;
            try {
                const res = await fetch(`${API}/cash/cancel-voucher`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voucher_id: voucherId })
                });
                if (res.ok) {
                    showToast('تم الإلغاء', 'success');
                    loadVouchers();
                    loadCashStatus();
                } else { const err = await res.json(); showToast(err.error, 'error'); }
            } catch { showToast('خطأ', 'error'); }
        }

        // ========== تحميل الصفحة ==========
        window.onload = async function() {
            await loadCurrencies();
            await loadCashStatus();
            await loadWallets();
            await loadVouchers();
            handleTransferType();
        };
    </script>
    <script src="date-utils.js"></script>
    <script src="document-utils.js"></script>
    <script src="sidebar-config.js"></script>
    <script src="notification-center-v3.js"></script>
</body>
</html>
